        html += `<tr class="${bg}">
          <td class="p-1.5 font-medium w-1/2">${item.item}</td>
          <td class="p-1.5 text-charcoal-400">${item.qty} × ${item.unit}</td>
          <td class="p-1.5 text-right text-teal-700 font-bold">$${item.price.toFixed(2)}</td>
        </tr>`;
      });
      html += `</table></div>`;
    });

  } else {
    // Weekly lists
    weeks.forEach(function(wk, wi) {
      const firstDay = wk[0].day;
      const lastDay  = wk[wk.length-1].day;
      const isSatStart = wk[0].dayName === 'Sat';
      const shopNote = isSatStart ? '🛒 Shop: Sat '+firstDay+' morning' : '🛒 Shop: Sat (prior month)';
      const wLabel   = wk[0].dayName+' '+firstDay+' – '+wk[wk.length-1].dayName+' '+lastDay;
      const items = buildWeeklyList(wk);
      const cats  = groupByCat(items);
      const total = estimateCost(items).toFixed(2);
      const overBudget = parseFloat(total) > 150;

      html += `<div class="mb-5">
        <div class="flex items-center justify-between mb-2">
          <h3 class="font-display font-bold text-sm text-teal-700">Week ${wi+1}: ${wLabel}</h3>
          <div class="text-xs text-teal-600 font-medium">${shopNote}</div>
          <div class="text-xs font-bold px-2 py-1 rounded-full ${overBudget?'bg-coral-100 text-coral-600':'bg-sage-100 text-sage-600'}">
            Est. $${total} / $150
          </div>
        </div>`;

      // Check tofu in this week
      const hasTofuThisWeek = items.some(function(i){return i.item.toLowerCase().includes('tofu');});
      if(hasTofuThisWeek) {
        html += `<div class="text-xs text-teal-600 bg-teal-50 rounded px-2 py-1 mb-2">🟨 Tofu week — 1 block (14 oz) included for this week's rotation</div>`;
      }

      Object.keys(cats).forEach(function(cat) {
        const emoji = CAT_EMOJI[cat]||'📦';
        html += `<div class="mb-2">
          <h4 class="font-bold text-xs text-charcoal-400 mb-1">${emoji} ${cat}</h4>
          <table class="w-full text-xs border-collapse">`;
        cats[cat].forEach(function(item, idx) {

  html += `</div>`;
  return html;
}

function renderBatch() {
  const meta = MONTH_META[currentMonth];
  const plan = buildDailyPlan(currentMonth);

  // Sat→Fri cycle: batch prep aligns with Saturday grocery run
  const weeks = [];
  let week = [];
  plan.forEach(function(d) {
    if(d.dayName === 'Sat' && week.length > 0) { weeks.push(week); week = []; }
    week.push(d);
  });
  if(week.length) weeks.push(week);

  // Month/year for date math
  const [mName, mYear] = currentMonth.split(' ');
  const MONTH_NUMS = {Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11};
  const mNum = MONTH_NUMS[mName];
  const yr = parseInt(mYear);
  function makeDate(day){ return new Date(yr, mNum, day); }
  function fmtDate(d){ return d.toLocaleDateString('en-US',{month:'short',day:'numeric'}); }
  function addDays(d,n){ const r=new Date(d); r.setDate(r.getDate()+n); return r; }

  // Derive batch tasks from actual week meals
  function getSatTasks(wk) {
    const tasks = [];
    const dinners = [...new Set(wk.map(function(d){return d.dinner;}))];
    const lunches = [...new Set(wk.map(function(d){return d.lunch;}))];
    const seen = {};
    dinners.forEach(function(name) {
      if(seen[name]) return; seen[name]=true;
      const r = RECIPE_DB[name]||genRecipe(name);
      const n = name.toLowerCase();
      if(r.freezer) tasks.push({label:'❄️ Batch cook + freeze: '+name, detail:'Cool fully, portion into containers, label with date'});
      else if(n.includes('slow')||n.includes('cooker')) tasks.push({label:'🍲 Slow cooker prep: '+name, detail:'Chop all vegetables, measure spices, set timer for Sunday morning'});
      else tasks.push({label:'🥘 Dinner prep: '+name, detail:'Chop vegetables, pre-measure spices, pre-cook any grains'});
    });
    lunches.slice(0,2).forEach(function(name) {
      if(seen[name]) return; seen[name]=true;
      tasks.push({label:'🥗 Lunch prep: '+name, detail:'Wash/chop greens, portion into containers, keep dressings separate'});
    });
    // Always include basics
    tasks.push({label:'🥣 Cook grains', detail:'Batch cook 4 cups brown rice + 2 cups quinoa for the week'});
    tasks.push({label:'🫘 Cook beans', detail:'If using dried: soak overnight Friday, simmer Saturday 90 min'});
    tasks.push({label:'🥦 Roast vegetables', detail:'Sheet pan roast broccoli, bell pepper, zucchini at 400°F for 25 min'});
    return tasks;
  }

  function getSunTasks(wk) {
    const tasks = [];
    const breakfasts = [...new Set(wk.map(function(d){return d.breakfast;}))];
    tasks.push({label:'🌅 Morning meal prep', detail:'Prep breakfasts for Mon–Fri morning rush'});
    breakfasts.slice(0,3).forEach(function(name) {
      const n = name.toLowerCase();
      if(n.includes('overnight')||n.includes('oat')) tasks.push({label:'🥣 Overnight oats (batch)', detail:'Make 5 jars with oats, almond milk, fruit — refrigerate for Mon–Fri'});
      else if(n.includes('smoothie')) tasks.push({label:'🥤 Smoothie packs', detail:'Portion frozen fruit + spinach into 5 zip bags — grab-and-blend each morning'});
      else if(n.includes('egg')||n.includes('muffin')) tasks.push({label:'🥚 Egg muffins', detail:'Bake 12-count muffin tin of veggie egg muffins — refrigerate up to 5 days'});
    });
    // Sunday standard tasks
    tasks.push({label:'🥬 Wash & chop produce', detail:'All vegetables for the week — store in airtight containers with paper towels'});
    tasks.push({label:'🧅 Aromatics', detail:'Mince 1 head garlic + dice 3 onions — store covered in fridge'});
    tasks.push({label:'🥑 Avocados', detail:'Buy firm avocados Sunday — they\'ll be perfect by Wed/Thu'});
    tasks.push({label:'📦 Pack grab-and-go', detail:'Pre-pack snack bags: fruit + nut portions for school days'});
    return tasks;
  }

  // Reheat instructions for labels
  function getReheatShort(name) {
    const n = name.toLowerCase();
    if(n.includes('soup')||n.includes('stew')||n.includes('chili')) return 'Stovetop med 8-10 min or microwave 3-4 min, stir halfway';
    if(n.includes('rice')||n.includes('grain')||n.includes('quinoa')) return 'Microwave 2-3 min covered w/1 tbsp water';
    if(n.includes('bean')||n.includes('lentil')) return 'Stovetop med 6-8 min w/splash of water, or microwave 2-3 min';
    if(n.includes('tofu')) return 'Pan-fry 3-4 min each side OR microwave 2 min then pan 2 min';
    if(n.includes('pasta')) return 'Stovetop w/splash water 5-6 min or microwave 2-3 min covered';
    if(n.includes('curry')) return 'Stovetop med-low 8-10 min stir often, or microwave 3 min';
    return 'Stovetop med 8-10 min or microwave 2-3 min until 165°F';
  }

  // Batch sub-tab state
  const batchTab = localStorage.getItem('batchTab_'+currentMonth)||'schedule';

  let html = `<div class="card">
    <h2 class="font-display text-xl font-bold text-teal-500 mb-1">🍳 ${currentMonth} Batch Prep</h2>
    <p class="text-xs text-charcoal-400 mb-3">Prep starts Saturday after grocery run · Covers meals through next Friday · Months overlap — carry-over meals noted below</p>
    <div class="flex gap-2 mb-4 flex-wrap">
      <button class="cal-view-btn ${batchTab==='schedule'?'active':''}" data-batchtab="schedule">📅 Prep Schedule</button>
      <button class="cal-view-btn ${batchTab==='labels'?'active':''}" data-batchtab="labels">🏷️ Container Labels</button>
    </div>`;

  if(batchTab === 'schedule') {
    // Month overlap note for Week 1
    if(weeks.length > 0 && weeks[0][0].dayName !== 'Sat') {
      html += '<div class="card-sm bg-gold-50 border-l-4 border-gold-400 mb-3 text-xs text-charcoal-500"><strong class="text-gold-600">↩️ Carry-over from prior month:</strong> The first partial week continues meals prepped last month. No new Saturday grocery run until <strong>' + (weeks[1] ? weeks[1][0].dayName + ' ' + weeks[1][0].day : 'next Saturday') + '</strong>.</div>';
    }
    weeks.forEach(function(wk, wi) {
      const satDay = (wk.find(function(d){return d.dayName==='Sat';})||wk[wk.length-1]).day;
      const satDate = makeDate(satDay);
      const sunDate = addDays(satDate, 1);
      const firstDay = wk[0].day;
      const lastDay  = wk[wk.length-1].day;
      const wLabel   = wk[0].dayName+' '+firstDay+'–'+wk[wk.length-1].dayName+' '+lastDay;

      const satTasks = getSatTasks(wk);
      const sunTasks = getSunTasks(wk);

      html += `<div class="mb-5">
        <h3 class="font-display font-bold text-sm text-teal-700 mb-2">Week ${wi+1}: ${wLabel}</h3>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
          <!-- Saturday -->
          <div class="card-sm border-l-4 border-gold-400">
            <h4 class="font-bold text-sm mb-2">🛒 Saturday ${satDay} — ${fmtDate(satDate)}</h4>
            <p class="text-xs text-charcoal-400 mb-2">After grocery run · ~1.5–2 hours</p>
            <ul class="space-y-2">`;
      satTasks.forEach(function(t) {
        html += `<li class="text-xs"><span class="font-bold text-teal-700">${t.label}</span><br><span class="text-charcoal-400">${t.detail}</span></li>`;
      });
      html += `</ul></div>
          <!-- Sunday -->
          <div class="card-sm border-l-4 border-sage-400">
            <h4 class="font-bold text-sm mb-2">☀️ Sunday ${satDay+1} — ${fmtDate(sunDate)}</h4>
            <p class="text-xs text-charcoal-400 mb-2">Morning prep · ~1–1.5 hours</p>
            <ul class="space-y-2">`;
      sunTasks.forEach(function(t) {
        html += `<li class="text-xs"><span class="font-bold text-teal-700">${t.label}</span><br><span class="text-charcoal-400">${t.detail}</span></li>`;
      });
      html += `</ul></div>
        </div></div>`;
    });

  } else {
    // Avery 2x4 labels (print-ready)
    html += `<div class="card-sm bg-teal-50 border border-teal-200 mb-4 text-xs">
      <strong>🖨️ Print Instructions:</strong> Print this page on standard 8.5×11" paper using Avery 5163 (2"×4" labels, 10 per sheet).
      File → Print → Scale to fit page. Labels show: Meal name · Date frozen · Expiration · Reheat instructions.
    </div>
    <div class="grid grid-cols-2 gap-2" style="font-family:'Inter',sans-serif;">`;

    // Generate labels for all freezer-ready meals across all weeks
    const labelMeals = [];
    weeks.forEach(function(wk, wi) {
      const satDay = (wk.find(function(d){return d.dayName==='Sat';})||wk[wk.length-1]).day;
      const satDate = makeDate(satDay);
      const seen = {};
      wk.forEach(function(d) {
        const name = d.dinner;
        if(seen[name]) return;
        const r = RECIPE_DB[name]||genRecipe(name);
        if(r.freezer) {
          seen[name] = true;
          const n = name.toLowerCase();
          let expDays = 90;
          if(n.includes('tofu')) expDays = 60;
          else if(n.includes('grain')||n.includes('rice')||n.includes('pasta')) expDays = 30;
          const expDate = addDays(satDate, expDays);
          labelMeals.push({
            name: name,
            frozen: fmtDate(satDate)+', '+yr,
            expires: fmtDate(expDate)+', '+yr,
            reheat: getReheatShort(name),
            week: wi+1
          });
        }
      });
    });

    if(!labelMeals.length) {
      html += `<div class="col-span-2 text-xs text-charcoal-400 text-center py-4">No freezer-ready meals this month. Labels will appear once freezer meals are in the plan.</div>`;
    } else {
      labelMeals.forEach(function(m) {
        html += `<div style="border:1px dashed #aaa; border-radius:6px; padding:10px 12px; background:#fff; min-height:96px; display:flex; flex-direction:column; justify-content:space-between;">
          <div style="font-size:13px; font-weight:700; color:#0d6b7c; margin-bottom:4px;">${m.name}</div>
          <div style="font-size:10px; color:#2d3748;">❄️ Frozen: <strong>${m.frozen}</strong></div>
          <div style="font-size:10px; color:#e07a5f;">⏰ Use By: <strong>${m.expires}</strong></div>
          <div style="font-size:9px; color:#4a5568; margin-top:4px; line-height:1.4;">🔥 ${m.reheat}</div>
        </div>`;
      });
      // Pad to even number for 2-column grid
      if(labelMeals.length % 2 !== 0) {
        html += `<div style="border:1px dashed #ddd; border-radius:6px; min-height:96px; background:#fafafa;"></div>`;
      }
    }

    html += `</div>`;
  }

  html += `</div>`;
  return html;
}

function renderFreezer() {
  const meta = MONTH_META[currentMonth];
  const plan = buildDailyPlan(currentMonth);

  // Build Sun-Sat weeks (same logic as other tabs)
  const weeks = [];
  let week = [];
  plan.forEach(function(d) {
    if(d.dayName === 'Sun' && week.length > 0) { weeks.push(week); week = []; }
    week.push(d);
  });
  if(week.length) weeks.push(week);

  // Helper: get Saturday of a given week array
  function getSatDate(wk) {
    const sat = wk.find(function(d){ return d.dayName==='Sat'; });
    return sat ? sat.day : wk[wk.length-1].day;
  }
  function getSunDate(wk) {
    const sun = wk.find(function(d){ return d.dayName==='Sun'; });
    return sun ? sun.day : wk[0].day;
  }

  // Month/year for date math
  const [mName, mYear] = currentMonth.split(' ');
  const MONTH_NUMS = {Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11};
  const mNum = MONTH_NUMS[mName];
  const yr = parseInt(mYear);

  function makeDateObj(day) {
    return new Date(yr, mNum, day);
  }
  function fmtFullDate(d) {
    return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
  }
  function addDays(d, n) {
    const r = new Date(d); r.setDate(r.getDate()+n); return r;
  }

  // Freezer-ready meals from plan
  function getFreezerMeals(wk) {
    const meals = [];
    const seen = {};
    wk.forEach(function(d) {
      const name = d.dinner;
      if(seen[name]) return;
      const r = RECIPE_DB[name] || genRecipe(name);
      if(r.freezer) { seen[name]=true; meals.push({name:name, day:d.day, r:r}); }
    });
    return meals;
  }

  // Reheat instructions by meal type
  function getReheat(name, r) {
    const n = name.toLowerCase();
    if(n.includes('soup')||n.includes('stew')||n.includes('chili')) return 'Stovetop: heat on medium 8-10 min stirring often, or microwave 3-4 min stirring halfway';
    if(n.includes('rice')||n.includes('grain')) return 'Microwave 2-3 min with 1 tbsp water covered, or stovetop 5 min with splash of water';
    if(n.includes('bean')||n.includes('lentil')) return 'Stovetop on medium 6-8 min with splash of water/broth, or microwave 2-3 min';
    if(n.includes('tofu')) return 'Pan-fry 3-4 min each side to crisp up, or microwave 2 min then finish in pan 2 min';
    if(n.includes('pasta')) return 'Stovetop with splash of water 5-6 min, or microwave 2-3 min covered with damp paper towel';
    if(n.includes('curry')) return 'Stovetop on medium-low 8-10 min stirring often, or microwave 3 min stirring halfway';
    return 'Stovetop on medium 8-10 min or microwave 2-3 min until heated through (165°F internal)';
  }

  let html = `<div class="card">
    <h2 class="font-display text-xl font-bold text-teal-500 mb-1">❄️ ${currentMonth} Freezer Inventory</h2>
    <p class="text-xs text-charcoal-400 mb-3">Batch-cooked on Saturdays & Sundays · Dates calculated from actual prep weekends</p>
    <div class="card-sm bg-blue-50 border border-blue-200 mb-4 text-xs">
      <strong class="text-blue-700">❄️ Freezer Safety Guide</strong><br>
      Soups/stews/beans: <strong>up to 3 months</strong> · Cooked grains/rice: <strong>up to 1 month</strong> · Tofu dishes: <strong>up to 2 months</strong><br>
      Always cool completely before freezing · Label every container with meal + date
    </div>`;

  weeks.forEach(function(wk, wi) {
    const satDay = getSatDate(wk);
    const sunDay = getSunDate(wk);
    const satDate = makeDateObj(satDay);
    // Sunday prep = day after Saturday in same week, or if week starts Sunday use first day
    // Actually Sunday in this week context is the first day of the week
    const sunDate = makeDateObj(sunDay);
    // Prep dates: Saturday of this week + Sunday of NEXT week (or same week's Sunday if it exists)
    // Use Saturday as primary, Sunday as secondary prep day
    const prepSat = satDate;
    // Expiration = 90 days from Saturday for soups, 30 days for grains
    const exp90 = fmtFullDate(addDays(prepSat, 90));
    const exp60 = fmtFullDate(addDays(prepSat, 60));
    const exp30 = fmtFullDate(addDays(prepSat, 30));
    const prepLabel = fmtFullDate(prepSat);

    const freezerMeals = getFreezerMeals(wk);

    const sunDate2 = makeDateObj(satDay + 1); // day after Saturday = Sunday
    const sun2Label = fmtFullDate(sunDate2);

    const firstDay = wk[0].day;
    const lastDay  = wk[wk.length-1].day;
    const wLabel   = `${wk[0].dayName} ${firstDay}–${wk[wk.length-1].dayName} ${lastDay}`;

    html += `<div class="mb-4">
      <h3 class="font-display font-bold text-sm text-teal-700 mb-2">Week ${wi+1}: ${wLabel}</h3>
      <div class="text-xs text-charcoal-400 mb-2">
        🧊 Prep: <strong>Sat ${satDay} (${prepLabel})</strong> + <strong>Sun ${satDay+1} (${sun2Label})</strong>
      </div>`;

    if(!freezerMeals.length) {
      html += `<div class="card-sm text-xs text-charcoal-400">No freezer-ready dinners this week. Fresh-only meals planned.</div>`;
    } else {
      html += `<div class="overflow-x-auto"><table class="w-full text-xs border-collapse" style="table-layout:fixed">
        <thead><tr class="bg-teal-100 text-teal-800">
          <th class="text-left p-2 font-bold" style="width:28%">Meal</th>
          <th class="text-left p-2 font-bold" style="width:16%;white-space:nowrap">Date Frozen</th>
          <th class="text-left p-2 font-bold" style="width:16%;white-space:nowrap">Use By</th>
          <th class="text-left p-2 font-bold" style="width:40%">Reheat Instructions</th>
        </tr></thead><tbody>`;
      freezerMeals.forEach(function(m, idx) {
        const n = m.name.toLowerCase();
        let useBy = exp90;
        let freezeType = '🍲 Soup/Stew';
        if(n.includes('tofu')) { useBy=exp60; freezeType='🟨 Tofu'; }
        else if(n.includes('grain')||n.includes('rice')||n.includes('quinoa')) { useBy=exp30; freezeType='🌾 Grain'; }
        else if(n.includes('pasta')) { useBy=exp30; freezeType='🍝 Pasta'; }
        const reheat = getReheat(m.name, m.r);
        const rowBg = idx%2===0?'bg-white':'bg-cream-50';
        html += `<tr class="${rowBg} border-b border-charcoal-100" style="vertical-align:top">
          <td class="p-2 font-medium">${m.name}<br><span class="text-[10px] text-charcoal-300">${freezeType}</span></td>
          <td class="p-2 text-teal-700 font-bold" style="white-space:nowrap">${prepLabel}</td>
          <td class="p-2 text-coral-600 font-bold" style="white-space:nowrap">${useBy}</td>
          <td class="p-2 text-charcoal-500">${reheat}</td>
        </tr>`;
      });
      html += `</tbody></table></div>`;
    }
    html += `</div>`;
  });

  html += `</div>`;
  return html;
}

function render() {
  const content = document.getElementById('content');
  switch(currentTab) {
    case 'calendar': content.innerHTML = renderCalendar(); break;
    case 'meals': content.innerHTML = renderMeals(); break;
    case 'recipes': content.innerHTML = renderRecipes(); break;
    case 'grocery': content.innerHTML = renderGrocery(); break;
    case 'batch': content.innerHTML = renderBatch(); break;
    case 'freezer': content.innerHTML = renderFreezer(); break;
    case 'exercise': content.innerHTML = renderExercise(); break;
    case 'tracker': content.innerHTML = renderTracker(); break;
    case 'budget': content.innerHTML = renderBudget(); break;
    case 'kids': content.innerHTML = renderKids(); break;
  }
  renderSidebar();
  bindDynamicEvents();
  if (typeof lucide !== "undefined" && typeof lucide.createIcons === "function") {
    lucide.createIcons();
  }
}

// ═══════════════════════════════════
// EVENT BINDING
// ═══════════════════════════════════
function bindDynamicEvents() {
  // Exercise checkboxes
  document.querySelectorAll('.exercise-cb').forEach(cb => {
    cb.addEventListener('change', function() {
      const key = `exercise_${currentMonth}`;
      const saved = JSON.parse(localStorage.getItem(key)||'{}');
      saved[this.dataset.key] = this.checked;
      localStorage.setItem(key, JSON.stringify(saved));
    });
  });

  // Tracker weights
  document.querySelectorAll('.tracker-weight').forEach(inp => {
    inp.addEventListener('input', function() {
      const key = `tracker_${currentMonth}`;
      const saved = JSON.parse(localStorage.getItem(key)||'{"weights":{},"measurements":{},"notes":""}');
      if(!saved.weights) saved.weights = {};
      saved.weights[`${this.dataset.member}_w${this.dataset.week}`] = this.value;
      localStorage.setItem(key, JSON.stringify(saved));
    });
  });

  // Tracker measurements
  document.querySelectorAll('.tracker-measure').forEach(inp => {
    inp.addEventListener('input', function() {
      const key = `tracker_${currentMonth}`;
      const saved = JSON.parse(localStorage.getItem(key)||'{"weights":{},"measurements":{},"notes":""}');
      if(!saved.measurements) saved.measurements = {};
      saved.measurements[`${this.dataset.person}_${this.dataset.type}`] = this.value;
      localStorage.setItem(key, JSON.stringify(saved));
    });
  });

  // Tracker notes
  const notesEl = document.querySelector('.tracker-notes');
  if(notesEl) {
    notesEl.addEventListener('input', function() {
      const key = `tracker_${currentMonth}`;
      const saved = JSON.parse(localStorage.getItem(key)||'{"weights":{},"measurements":{},"notes":""}');
      saved.notes = this.value;
      localStorage.setItem(key, JSON.stringify(saved));
    });
  }

  // Budget
  document.querySelectorAll('.budget-actual, .budget-note').forEach(inp => {
    inp.addEventListener('input', function() {
      const key = `budget_${currentMonth}`;
      const saved = JSON.parse(localStorage.getItem(key)||'{}');
      saved[this.dataset.cat] = this.value;
      localStorage.setItem(key, JSON.stringify(saved));
      // Update total
      let total = 0;
      document.querySelectorAll('.budget-actual').forEach(a => { total += parseFloat(a.value)||0; });
      const el = document.getElementById('budget-total');
      if(el) el.textContent = '$'+total;
    });
  });

  // Star chart
  document.querySelectorAll('.star-cell').forEach(cell => {
    cell.addEventListener('click', function() {
      const kid = this.dataset.kid, day = this.dataset.day;
      const key = `stars_${currentMonth}`;
      const saved = JSON.parse(localStorage.getItem(key)||'{}');
      if(!saved[kid]) saved[kid] = {};
      saved[kid][day] = !saved[kid][day];
      localStorage.setItem(key, JSON.stringify(saved));
      this.classList.toggle('filled');
      this.textContent = saved[kid][day] ? '⭐' : day;
      // Update total
      const total = Object.values(saved[kid]).filter(v=>v).length;
      const totalEl = document.querySelector(`.kid-total[data-kid="${kid}"]`);
      if(totalEl) totalEl.textContent = total+'⭐';
    });
  });

  // Recipe nav
  // Calendar view toggle
  document.querySelectorAll('.cal-view-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      calendarView = this.dataset.calview;
      document.getElementById('content').innerHTML = renderCalendar();
      bindDynamicEvents();
    });
  });

  // recipe-nav-btn clicks handled via inline onclick="setRecipeCategory()"

  // Exercise day checkboxes — weekly storage (exday_month_wN)
  document.querySelectorAll('.ex-day-check').forEach(function(cb) {
    cb.addEventListener('change', function() {
      var wk = this.dataset.wk;
      var dayKey = this.dataset.daykey;
      var exKey = 'exday_' + currentMonth + '_w' + wk;
      var saved = {};
      try { saved = JSON.parse(localStorage.getItem(exKey)||'{}'); } catch(e) { saved = {}; }
      if(this.checked) { saved[dayKey] = true; } else { delete saved[dayKey]; }
      localStorage.setItem(exKey, JSON.stringify(saved));
      // Update the "X/N done" counter
      var wkItems = document.querySelectorAll('.ex-day-check[data-wk="' + wk + '"]');
      var doneNow = 0;
      wkItems.forEach(function(c){ if(c.checked) doneNow++; });
      var badge = document.querySelector('.exdone-ex-' + wk);
      if(badge) badge.textContent = doneNow + '/' + wkItems.length + ' done';
    });
  });

  // Kid-act link clicks → switch to dictionary and highlight that card
  document.querySelectorAll('.kid-act-link').forEach(function(link) {
    link.addEventListener('click', function(e) {
      e.preventDefault();
      var slug = this.dataset.kidslug;
      if(typeof switchExTab === 'function') { switchExTab('dictionary', slug); }
      else { localStorage.setItem('exTab_' + currentMonth, 'dictionary'); localStorage.setItem('exHighlight_' + currentMonth, slug); render(); }
      setTimeout(function() {
        var card = document.getElementById('excard_' + slug);
        if (card) card.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }, 120);
    });
  });

  // Family Team Plan — sub-tab switching (plain string, NOT JSON)
  document.querySelectorAll('[data-teamtab]').forEach(function(btn) {
    btn.addEventListener('click', function() {
      localStorage.setItem('teamTab_' + currentMonth, this.dataset.teamtab);
      render();
    });
  });

  // Family Team Plan — win/goal/notes textareas
  document.querySelectorAll('.team-win').forEach(function(el) {
    el.addEventListener('input', function() {
      var key = 'teamweek_' + currentMonth + '_w' + this.dataset.week;
      var saved = JSON.parse(localStorage.getItem(key)||'{}');
      saved[this.dataset.member + '_win'] = this.value;
      localStorage.setItem(key, JSON.stringify(saved));
    });
  });
  document.querySelectorAll('.team-goal').forEach(function(el) {
    el.addEventListener('input', function() {
      var key = 'teamweek_' + currentMonth + '_w' + this.dataset.week;
      var saved = JSON.parse(localStorage.getItem(key)||'{}');
      saved[this.dataset.member + '_goal'] = this.value;
      localStorage.setItem(key, JSON.stringify(saved));
    });
  });
  document.querySelectorAll('.team-notes').forEach(function(el) {
    el.addEventListener('input', function() {
      var key = 'teamweek_' + currentMonth + '_w' + this.dataset.week;
      var saved = JSON.parse(localStorage.getItem(key)||'{}');
      saved['family_notes'] = this.value;
      localStorage.setItem(key, JSON.stringify(saved));
    });
  });

  // Batch Prep sub-tab switching
  document.querySelectorAll('[data-batchtab]').forEach(function(btn) {
    btn.addEventListener('click', function() {
      localStorage.setItem('batchTab_' + currentMonth, this.dataset.batchtab);
      render();
    });
  });

  // Grocery sub-tab switching
  document.querySelectorAll('[data-groctab]').forEach(function(btn) {
    btn.addEventListener('click', function() {
      localStorage.setItem('grocTab_' + currentMonth, this.dataset.groctab);
      render();
    });
  });

  // Tracker exercise day checkboxes
  document.querySelectorAll('.ex-tracker-check').forEach(function(cb) {
    cb.addEventListener('change', function() {
      var wk = this.dataset.wk;
      var dayKey = this.dataset.daykey;
      var exKey = 'excheck_' + currentMonth + '_w' + wk;
      var saved = {};
      try { saved = JSON.parse(localStorage.getItem(exKey)||'{}'); } catch(e) { saved = {}; }
      if(this.checked) { saved[dayKey] = true; } else { delete saved[dayKey]; }
      localStorage.setItem(exKey, JSON.stringify(saved));
      // Update the "X/N done" counter without full re-render
      var card = this.closest('.card-sm');
      if(card) {
        var total = card.querySelectorAll('.ex-tracker-check').length;
        var done = card.querySelectorAll('.ex-tracker-check:checked').length;
        var spans = card.querySelectorAll('span');
        for(var s=0; s<spans.length; s++) {
          if(spans[s].textContent.indexOf('/ done') !== -1 || spans[s].textContent.match(/\d+\/\d+ done/)) {
            spans[s].textContent = done + '/' + total + ' done'; break;
          }
        }
      }
    });
  });

  // Exercise tab switching (plan vs dictionary)
  document.querySelectorAll('[data-extab]').forEach(function(btn) {
    btn.addEventListener('click', function() {
      localStorage.setItem('exTab_' + currentMonth, this.dataset.extab);
      render();
    });
  });
}

// ═══════════════════════════════════
// INIT — defensive wrapper for Safari/iOS
// ═══════════════════════════════════
window.onerror = function(msg, src, line, col, err) {
  var c = document.getElementById('content');
  if (c) {
    c.innerHTML = '<div style="padding:24px;background:#c53030;color:#fff;font-family:monospace;border-radius:8px;margin:20px;">'
      + '<b>App Error (line ' + line + '):</b><br>' + msg
      + (err ? '<br><br>' + err.stack : '') + '</div>';
  }
};

function _initApp() {
  // Lucide icons (loaded with defer — may or may not be ready)
  if (typeof lucide !== 'undefined' && typeof lucide.createIcons === 'function') {
    try { lucide.createIcons(); } catch(e) {}
  }

  // Month nav
  var monthNav = document.getElementById('month-nav');
  if (monthNav) {
    monthNav.addEventListener('click', function(e) {
      var btn = e.target.closest('.month-btn');
      if (!btn) return;
      currentMonth = btn.dataset.month;
      calendarView = 'month';
      render();
      var sb = document.getElementById('sidebar');
      if (sb) sb.classList.remove('open');
    });
  }

  // Tab nav
  var tabBar = document.getElementById('tab-bar');
  if (tabBar) {
    tabBar.addEventListener('click', function(e) {
      var btn = e.target.closest('.tab-btn');
      if (!btn || btn.id === 'print-btn') return;
      currentTab = btn.dataset.tab;
      document.querySelectorAll('.tab-btn').forEach(function(b) { b.classList.remove('active'); });
      btn.classList.add('active');
      render();
    });
  }

  // Print button
  var printBtn = document.getElementById('print-btn');
  if (printBtn) {
    printBtn.addEventListener('click', function() { window.print(); });
  }

  // Mobile menu toggle
  var mobileBtn = document.getElementById('mobile-menu-btn');
  if (mobileBtn) {
    mobileBtn.addEventListener('click', function() {
      var sb = document.getElementById('sidebar');
      if (sb) sb.classList.toggle('open');
    });
  }

  // Initial render — wrapped so errors display visibly instead of silently crashing
  try {
    render();
  } catch(e) {
    var c = document.getElementById('content');
    if (c) {
      c.innerHTML = '<div style="padding:24px;background:#c53030;color:#fff;font-family:monospace;border-radius:8px;margin:20px;">'
        + '<b>Render Error:</b><br>' + e.message
        + '<br><br>' + (e.stack || '') + '</div>';
    }
  }
}

// Ensure DOM is ready regardless of script position or browser quirks
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', _initApp);
} else {
  _initApp();
}
</script>
</body>
</html>
