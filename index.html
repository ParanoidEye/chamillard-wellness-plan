<style>
:root {
  --teal: #0d6b7c; --cream: #fdf8f0; --sage: #7b9e87; --coral: #e07a5f;

}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { font-family: 'Inter', sans-serif; background: var(--cream); color: var(--charcoal); margin:0; }
.font-display { font-family: 'Nunito', sans-serif; }

/* Sidebar */

#sidebar .month-btn.active { background:rgba(255,255,255,.15); color:#fff; font-weight:700; border-left-color:#e07a5f; }
#sidebar .phase-badge { font-size:9px; display:block; opacity:.7; margin-top:1px; }

/* Main */
#main { margin-left:220px; min-height:100vh; }
#tab-bar { display:flex; flex-wrap:wrap; gap:4px; padding:8px 16px; background:#fff; border-bottom:1px solid #e6f5f7; position:sticky; top:0; z-index:30; }
.tab-btn { padding:6px 12px; font-size:12px; font-weight:600; border:none; border-radius:8px; cursor:pointer; background:#f0f5f1; color:#2d3748; transition: all .15s; white-space:nowrap; }
.tab-btn.active { background:#0d6b7c; color:#fff; }
.recipe-link { color:#0d6b7c; text-decoration:underline; cursor:pointer; font-size:inherit; }
.recipe-link:hover { color:#e07a5f; }
.tab-btn:hover:not(.active) { background:#d4e3d8; }

#content { padding:20px; max-width:1200px; margin:0 auto; }

/* Cards */
.card { background:#fff; border-radius:14px; padding:20px; box-shadow:0 2px 12px rgba(13,107,124,.06); margin-bottom:16px; }
.card-sm { background:#fff; border-radius:10px; padding:14px; box-shadow:0 1px 6px rgba(13,107,124,.05); }

/* Pills */
.pill { display:inline-block; padding:2px 8px; border-radius:20px; font-size:10px; font-weight:600; }
.pill-yellow { background:#fef9e7; color:#b88c1a; }
.pill-green { background:#f0f5f1; color:#4b6050; }
.pill-teal { background:#e6f5f7; color:#0d6b7c; }
.pill-orange { background:#fdf0ec; color:#d4634a; }
.pill-coral { background:#f9d6cc; color:#b84e38; }
.pill-sage { background:#d4e3d8; color:#3a4a3e; }
.pill-gold { background:#fef9e7; color:#b88c1a; }
.pill-purple { background:#f5f0fa; color:#6b3f92; }

/* Calendar */
.cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:3px; }
.cal-header { font-size:11px; font-weight:700; text-align:center; padding:6px 2px; color:#0d6b7c; }
.cal-cell { border:1px solid #e6f5f7; border-radius:8px; padding:4px; min-height:90px; font-size:9px; background:#fff; }
.cal-cell .day-num { font-weight:700; font-size:12px; color:#0d6b7c; }
.cal-empty { background:transparent; border:none; }

/* Tables */
.meal-table { width:100%; border-collapse:separate; border-spacing:0; font-size:11px; }
.meal-table th { background:#0d6b7c; color:#fff; padding:8px 6px; text-align:left; font-size:11px; font-weight:600; }
.meal-table th:first-child { border-radius:8px 0 0 0; }
.meal-table th:last-child { border-radius:0 8px 0 0; }
.meal-table td { padding:7px 6px; border-bottom:1px solid #e6f5f7; }
.meal-table tr:nth-child(even) { background:#fdf8f0; }
.meal-table tr:hover { background:#e6f5f7; }

/* Recipe cards */
.recipe-card { background:#fff; border-radius:12px; padding:16px; box-shadow:0 1px 8px rgba(13,107,124,.06); margin-bottom:12px; page-break-inside:avoid; }
.recipe-card h4 { color:#0d6b7c; font-family:'Nunito',sans-serif; font-weight:700; font-size:15px; margin:0 0 8px; }
.kid-box { background:#fdf0ec; border-radius:8px; padding:10px; margin-top:8px; border-left:3px solid #e07a5f; }

/* Star chart */
.star-cell { width:28px; height:28px; display:flex; align-items:center; justify-content:center; cursor:pointer; border-radius:6px; font-size:16px; transition:all .15s; border:1px solid #e6f5f7; }
.star-cell:hover { background:#fef9e7; }
.star-cell.filled { background:#fef9e7; }

/* Checkbox */
.cb-item { display:flex; align-items:flex-start; gap:8px; padding:4px 0; font-size:13px; }
.cb-item input[type=checkbox] { margin-top:3px; accent-color:#0d6b7c; width:16px; height:16px; }

/* Sticky subnav */
.sticky-sub { position:sticky; top:48px; background:#fdf8f0; z-index:20; padding:8px 0; border-bottom:1px solid #e6f5f7; }
.sticky-sub button { padding:5px 14px; border-radius:20px; font-size:12px; font-weight:600; border:1px solid #b3e0e6; background:#fff; color:#0d6b7c; cursor:pointer; transition:all .15s; }
.sticky-sub button:hover, .sticky-sub button.active { background:#0d6b7c; color:#fff; }

/* Print */
@media print {
  #sidebar, #tab-bar, #mobile-menu-btn, #mobile-sidebar, .no-print, .sticky-sub { display:none !important; }
  #main { margin-left:0 !important; }
  body { background:#fff !important; }
  .card, .recipe-card { box-shadow:none !important; border:1px solid #ddd; }
  .recipe-card { page-break-inside:avoid !important; }
  .recipe-section-header { page-break-before:always !important; }
  .grocery-week { page-break-before:always !important; }
  .tracker-section { page-break-before:always !important; }
  @page { size:letter; margin:0.5in; }
  * { font-size:11pt; }
  .cal-grid { font-size:8pt; }
}

/* Mobile */
@media (max-width:768px) {
  #sidebar { transform:translateX(-100%); }
  #sidebar.open { transform:translateX(0); }
  #main { margin-left:0; }
  .cal-cell { min-height:60px; font-size:7px; }
  .cal-cell .day-num { font-size:10px; }
  #tab-bar { gap:3px; padding:6px 8px; }
  .tab-btn { padding:5px 8px; font-size:10px; }

.cal-t{background:#e6f5f7;color:#0b5c6b;}.cal-o{background:#fdf0ec;color:#b84e38;}

.week-day-label{font-family:'Nunito',sans-serif;font-weight:800;font-size:13px;color:#0d6b7c;margin-bottom:8px;border-bottom:1.5px solid #e6f5f7;padding-bottom:4px;}

.week-meal-row{display:flex;flex-direction:column;border-radius:6px;padding:5px 6px;margin-bottom:4px;}
.week-meal-label{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;opacity:.65;margin-bottom:1px;}
.week-meal-name{font-size:11px;font-weight:600;line-height:1.3;}
.week-breakfast{background:#fef9e7;color:#b88c1a;}.week-lunch{background:#f0f5f1;color:#4b6050;}
.week-dinner{background:#e6f5f7;color:#0b5c6b;}.week-snack{background:#fdf0ec;color:#b84e38;}
@media print{
  #cal-view-bar{display:none!important;}
  .cal-grid-month{min-width:unset!important;gap:1px;}
  .cal-cell-sm{min-height:52px!important;}
  .cal-pill-xs{font-size:7px!important;}
  .recipe-card{page-break-inside:avoid;}
  .recipe-section-header{page-break-before:always;}
  @page{size:landscape;margin:8mm;}

.recipe-nav-btn.active { background:#0d6b7c !important; color:#fff !important; font-weight:700; border-color:#0d6b7c !important; }

function getSeasonFromKey(monthKey) {
  var m = monthKey.split(' ')[0];
  if (m==='Jun'||m==='Jul'||m==='Aug') return 'summer';
  if (m==='Sep'||m==='Oct'||m==='Nov') return 'fall';
  if (m==='Dec'||m==='Jan'||m==='Feb') return 'winter';
  return 'spring';
}

function seasonalizeMeal(meal, season) {
  var swaps = SEASONAL_SWAPS[season];
  return (swaps && swaps[meal]) ? swaps[meal] : meal;
}

const DAY_NAMES = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

function buildDailyPlan(monthKey) {
  if (planCache[monthKey]) return planCache[monthKey];
  const {rotation,days,shift} = MONTH_META[monthKey];
  const p = MEAL_POOLS[rotation];
  const _mn = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const _pts = monthKey.split(" ");
  const startDow = new Date(parseInt(_pts[1]), _mn.indexOf(_pts[0]), 1).getDay();
  const season = getSeasonFromKey(monthKey);
  const plan = [];
  for (let d=0; d<days; d++) {
    plan.push({
      day: d+1,
      dayName: DAY_NAMES[(startDow+d)%7],
      breakfast: seasonalizeMeal(p.breakfasts[d], season),
      lunch:     seasonalizeMeal(p.lunches[(d+shift)%31], season),
      dinner:    seasonalizeMeal(p.dinners[(d+(shift*2)%31+31)%31], season),
      snack:     seasonalizeMeal(p.snacks[(d+(shift*3)%31+31)%31], season)
    });
  }
  planCache[monthKey] = plan;
  return plan;
}

addRecipe('Sweet Potato Egg Muffins','breakfast',{prep:'12min',cook:'22min',serves:5,freezer:true,
  ingredients:['8 large eggs','1 medium sweet potato (about 1 cup mashed)','2 cups fresh baby spinach — roughly chopped','1 tsp garlic powder','½ tsp onion powder','¼ tsp ground cinnamon','¼ tsp black pepper','½ tsp salt','olive oil spray for greasing the pan'],
  steps:['Wash hands. Preheat your oven to 375°F. Make sure a rack is in the center of the oven.','Grease a 12-cup standard muffin tin thoroughly with olive oil spray — get the sides and bottom of every cup so the muffins pop out easily.','Pierce the sweet potato all over with a fork. Place on a microwave-safe plate and microwave on high 5–6 minutes, flipping once halfway through, until completely soft when squeezed. Let cool 3 minutes, then slice in half and scoop out the orange flesh into a bowl. Mash it well with a fork until smooth. Measure out 1 cup.','Crack all 8 eggs into a large bowl and beat well with a fork or whisk.','Add the mashed sweet potato, chopped spinach, garlic powder, onion powder, cinnamon, salt, and pepper to the eggs. Stir firmly until everything is evenly combined — the batter will look orange-yellow with green flecks.','Use a ladle or large spoon to pour the batter into 10 of the 12 muffin cups, filling each about three-quarters full. Leave 2 cups empty (or fill with a tiny bit of water so the tin heats evenly).','Place the muffin tin in the preheated oven. Bake 20–22 minutes until the tops are puffed, golden at the edges, and a toothpick inserted in the center of one muffin comes out clean.','Remove from the oven. Let cool in the tin for 5 minutes — do not try to remove them immediately or they will stick.','Run a butter knife around the edge of each muffin, then pop them out with a spoon. Serve 2 per person. To freeze: cool completely, place in a single layer on a baking sheet and freeze 1 hour, then transfer to a zip bag. Reheat from frozen in the microwave 90 seconds.'],
  kids:{aleene:'Mash the cooked sweet potato until completely smooth',kaily:'Stir all the ingredients together in the large bowl',lilly:'Scoop batter into each muffin cup using a large spoon'},
  nutrition:{cal:175,protein:'12g',fat:'7g',carbs:'16g',sugar:'5g'}});

addRecipe('Egg & Sweet Potato Hash','breakfast',{prep:'12min',cook:'18min',serves:5,freezer:false,
  ingredients:['6 large eggs','2 medium sweet potatoes — peeled and cut into ½-inch cubes','½ medium red bell pepper — seeds removed and diced','½ medium onion — peeled and diced','2 garlic cloves — minced','1 tbsp olive oil','1 tsp smoked paprika','½ tsp cumin','salt and pepper to taste'],
  steps:['Wash hands. Peel the sweet potatoes and cut into ½-inch cubes — try to make them all the same size so they cook evenly.','Dice the bell pepper and onion. Mince the garlic. Set everything aside in separate piles.','Heat olive oil in a large nonstick or cast-iron skillet over medium-high heat. When the oil shimmers, add the sweet potato cubes in a single layer. Do not stir yet.','Cook the sweet potatoes undisturbed for 4–5 minutes until the bottom sides are golden brown. Then stir and cook another 4–5 minutes, stirring every 2 minutes, until the cubes are golden all over and fork-tender.','Reduce heat to medium. Add the diced onion and bell pepper. Cook 3 minutes, stirring occasionally, until softened.','Add the minced garlic, smoked paprika, and cumin. Stir everything together and cook 1 minute until fragrant.','Taste the hash and season with salt and pepper. Use a spoon to create 6 small wells spaced evenly in the hash.','Crack one egg into a small cup and gently pour it into one of the wells. Repeat for all 6 eggs.','Cover the skillet with a lid and cook 3–4 minutes until the egg whites are fully set but the yolks are still a little soft. If you prefer fully cooked yolks, cook 1–2 minutes more.','Remove the lid. Season the eggs with a pinch of salt and pepper. Scoop portions onto 5 plates — some people get 1 egg and some share the sixth. Serve hot.'],
  kids:{aleene:'Cut sweet potato cubes with help from an adult',kaily:'Measure and mix the smoked paprika and cumin together',lilly:'Carefully crack each egg into a small cup before it goes into the well'},
  nutrition:{cal:250,protein:'13g',fat:'10g',carbs:'28g',sugar:'7g'}});

addRecipe('Veggie Egg Muffin Cups','breakfast',{prep:'12min',cook:'22min',serves:5,freezer:true,
  ingredients:['8 large eggs','1 medium red bell pepper — seeds removed and diced very small','1 cup broccoli florets — chopped into tiny pieces (about ¼-inch)','½ medium onion — peeled and diced very small','2 garlic cloves — minced','1 tsp dried Italian seasoning','½ tsp garlic powder','salt and pepper to taste','olive oil spray'],
  steps:['Wash hands. Preheat oven to 375°F with a rack in the center.','Dice the bell pepper, onion, and broccoli into very small pieces — smaller than you think. Large chunks will make it hard to fill the muffin cups and the vegetables need to cook through in the time given.','Mince the garlic.','Spray a 12-cup muffin tin generously with olive oil spray — cover the sides and bottom of every cup completely.','Crack all 8 eggs into a large bowl. Beat well with a fork or whisk until the whites and yolks are fully combined.','Add the diced bell pepper, broccoli, onion, garlic, Italian seasoning, garlic powder, salt, and pepper to the eggs. Stir thoroughly so the vegetables are evenly distributed throughout.','Use a ladle or large spoon to fill 10 muffin cups about three-quarters full with the egg-vegetable mixture. Stir the bowl between scoops to keep the vegetables evenly distributed.','Place the tin in the oven and bake 20–22 minutes until the tops are puffed and golden and a toothpick inserted in the center comes out clean.','Let cool in the tin 5 minutes. Run a knife around each muffin and pop out with a spoon. Serve 2 per person.','To freeze: cool completely, freeze on a baking sheet 1 hour, then store in a zip bag up to 1 month. To reheat: microwave from frozen 90 seconds, or 60 seconds if refrigerated.'],
  kids:{aleene:'Chop broccoli florets into tiny pieces',kaily:'Beat the eggs well and stir in all the vegetables',lilly:'Fill each muffin cup carefully with a spoon'},
  nutrition:{cal:165,protein:'14g',fat:'9g',carbs:'6g',sugar:'3g'}});

addRecipe('Sweet Potato Hash & Eggs','breakfast',{prep:'12min',cook:'20min',serves:5,freezer:false,
  ingredients:['6 large eggs','3 medium sweet potatoes — peeled and diced small','1 medium zucchini — ends trimmed and diced small','½ medium onion — peeled and diced','1 tbsp olive oil','1 tsp garlic powder','½ tsp smoked paprika','salt and pepper to taste','2 tbsp fresh flat-leaf parsley — chopped (optional)'],
  steps:['Wash hands. Peel the sweet potatoes and dice into small cubes — about ½-inch. Dice the zucchini and onion to a similar size so everything cooks at the same rate.','Heat olive oil in a large skillet over medium-high heat. Add the sweet potato cubes in a single layer. Do not stir for the first 5 minutes — letting them sit builds a golden crust.','After 5 minutes, stir and cook another 4 minutes, stirring every 2 minutes, until golden all over and nearly fork-tender.','Add the diced onion and cook 2 minutes, stirring occasionally.','Add the diced zucchini, garlic powder, and smoked paprika. Stir everything together. Cook 3–4 more minutes until the zucchini is tender and slightly golden.','Season the hash with salt and pepper. Taste and adjust. Spread the hash evenly in the pan.','Use a large spoon to create 6 evenly spaced wells in the hash. Crack one egg into a small cup and pour it into each well.','Cover the skillet with a lid. Cook 4–5 minutes until the egg whites are fully set. Leave yolks slightly soft for a runny yolk, or cook 2 more minutes for firm yolks.','Remove from heat. Scatter the chopped parsley over the top if using. Scoop onto 5 plates and serve hot.'],
  kids:{aleene:'Peel the sweet potatoes using a vegetable peeler',kaily:'Sprinkle the garlic powder and smoked paprika over the hash',lilly:'Tear parsley leaves and scatter them over the finished dish'},
  nutrition:{cal:260,protein:'13g',fat:'10g',carbs:'32g',sugar:'8g'}});

addRecipe('Tofu Scramble & Veggies','breakfast',{prep:'8min',cook:'12min',serves:5,freezer:false,
  ingredients:['2 blocks (14 oz each) extra-firm tofu','2 cups fresh baby spinach','1 red bell pepper — seeds removed and diced','½ medium onion — peeled and diced','2 garlic cloves — minced','1 tbsp olive oil','2 tbsp low-sodium soy sauce','1 tsp turmeric powder','1 tsp garlic powder','½ tsp onion powder','¼ tsp black pepper'],
  steps:['Wash hands. Open the tofu packages. Wrap each block in 2–3 layers of paper towels or a clean kitchen towel. Place a heavy pan or cutting board on top and press for 5 minutes to push out as much moisture as possible — less moisture means crispier, more flavorful tofu.','While tofu presses, dice the bell pepper and onion. Mince the garlic.','Unwrap the pressed tofu. Using clean hands or a fork, crumble it directly into a bowl until it looks like coarse scrambled eggs — some bigger chunks are fine.','In a small bowl, mix the soy sauce, turmeric, garlic powder, onion powder, and black pepper together. Stir well.','Heat olive oil in a large nonstick skillet over medium-high heat. Add the diced onion. Cook 3 minutes, stirring, until softened.','Add the bell pepper and cook 2 more minutes, stirring occasionally.','Add the minced garlic and cook 30 seconds, stirring constantly.','Add the crumbled tofu to the skillet. Spread it out in an even layer. Let it cook undisturbed for 2 minutes to get a slight golden color on the bottom.','Stir the tofu and pour the soy sauce spice mixture evenly over it. Stir well so the turmeric coats everything — it will turn a bright golden-yellow color.','Add the baby spinach and fold it in. Cook 2 minutes, stirring, until the spinach is wilted. Taste and adjust seasoning with salt if needed. Divide into 5 portions and serve hot.'],
  kids:{aleene:'Press the tofu in the towel and crumble it into the bowl',kaily:'Mix the soy sauce and all spices together in the small bowl',lilly:'Stir in the spinach leaves at the very end'},
  nutrition:{cal:215,protein:'18g',fat:'11g',carbs:'10g',sugar:'3g'}});

addRecipe('Tofu & Sweet Potato Scramble','breakfast',{prep:'10min',cook:'18min',serves:5,freezer:false,
  ingredients:['2 blocks (14 oz each) extra-firm tofu','2 medium sweet potatoes — peeled and cut into ½-inch cubes','2 cups fresh baby spinach','½ medium onion — peeled and diced','2 garlic cloves — minced','1 tbsp olive oil','2 tbsp low-sodium soy sauce','1 tsp turmeric','1 tsp smoked paprika','½ tsp cumin','salt and pepper to taste'],
  steps:['Wash hands. Press both tofu blocks: wrap in paper towels, set a heavy pan on top, and wait 5 minutes. Then crumble the tofu into a bowl with your hands until it looks like chunky scrambled eggs.','Peel the sweet potatoes and cut into ½-inch cubes. Dice the onion. Mince the garlic.','Heat olive oil in a large nonstick skillet over medium-high heat. Add the sweet potato cubes in a single layer. Do not stir for 5 minutes so they brown on the bottom.','Stir the potatoes and cook another 4–5 minutes, stirring every 2 minutes, until golden all over and fork-tender. If they are cooking too fast, reduce heat slightly.','Add the diced onion and cook 2 minutes, stirring.','Add the minced garlic, smoked paprika, and cumin. Stir and cook 1 minute.','Push the vegetables to the sides of the pan to create space in the center. Add the crumbled tofu to the center. Let it sit 2 minutes untouched to develop color.','In a small bowl, mix the soy sauce and turmeric together. Pour it over the tofu and sweet potato mixture. Stir everything together so the turmeric colors the tofu golden.','Add the spinach and fold in. Cook 2 minutes until fully wilted. Taste and add salt and pepper as needed.','Divide into 5 equal portions and serve hot. This reheats well the next day — store leftovers in the refrigerator in a sealed container.'],
  kids:{aleene:'Press and crumble the tofu while the sweet potatoes cook',kaily:'Mix the soy sauce and turmeric together in the small bowl',lilly:'Fold the spinach into the scramble and watch it wilt'},
  nutrition:{cal:270,protein:'18g',fat:'10g',carbs:'27g',sugar:'7g'}});

addRecipe('Tofu & Kale Scramble','breakfast',{prep:'10min',cook:'14min',serves:5,freezer:false,
  ingredients:['2 blocks (14 oz each) extra-firm tofu','3 cups fresh kale — tough stems removed, leaves roughly torn','½ medium onion — peeled and diced','2 garlic cloves — minced','1 tbsp olive oil','2 tbsp low-sodium soy sauce','1 tsp turmeric','1 tsp garlic powder','1 tbsp fresh lemon juice','salt and pepper to taste'],
  steps:['Wash hands. Press the tofu for 5 minutes: wrap both blocks in paper towels, place a heavy pot or cutting board on top. Then crumble into a bowl until it resembles scrambled eggs.','Strip the kale leaves from their thick center stems by holding the stem and pulling the leaf away. Discard stems. Roughly tear the leaves into bite-sized pieces and rinse in a colander. Shake off excess water.','Dice the onion and mince the garlic.','Heat olive oil in a large nonstick skillet over medium heat. Add the onion and cook 3 minutes, stirring, until soft.','Add the garlic and cook 30 seconds, stirring constantly.','Add the kale to the pan along with 3 tablespoons of water. The water creates steam. Stir continuously 3–4 minutes until all the kale is wilted, bright green, and tender. If the pan dries out, add another splash of water.','Push the kale to the sides. Add the crumbled tofu in the center. Let it sit undisturbed 2 minutes to brown slightly.','Mix soy sauce and turmeric in a small bowl. Pour over the entire pan. Stir well so the turmeric colors everything golden-yellow.','Add the garlic powder and stir again. Taste and adjust seasoning with salt and pepper.','Squeeze the lemon juice over the scramble and fold once more. Divide into 5 portions and serve hot immediately.'],
  kids:{aleene:'Strip the kale leaves from the stems and rinse them',kaily:'Press and crumble the tofu while other ingredients are prepped',lilly:'Squeeze the lemon juice over the scramble at the end'},
  nutrition:{cal:205,protein:'18g',fat:'10g',carbs:'9g',sugar:'2g'}});

addRecipe('Savory Tofu Breakfast Bowl','breakfast',{prep:'10min',cook:'15min',serves:5,freezer:false,
  ingredients:['2 blocks (14 oz each) extra-firm tofu','2½ cups brown rice or quinoa — cooked (about 5 cups cooked total)','2 cups fresh baby spinach','1 medium zucchini — ends trimmed and diced','½ medium onion — peeled and diced','2 garlic cloves — minced','1 tbsp olive oil','3 tbsp low-sodium soy sauce','1 tsp turmeric','1 tsp sesame oil','4 green onions — sliced thin for topping','salt and pepper to taste'],
  steps:['Wash hands. If you need to cook the rice or quinoa, start it now — follow the package directions. It needs to be ready before you assemble the bowls.','Press the tofu for 5 minutes in paper towels with a heavy weight on top. Then crumble into a bowl.','Dice the zucchini and onion. Mince the garlic.','Heat olive oil in a large nonstick skillet over medium-high heat. Add the onion and cook 3 minutes, stirring.','Add the diced zucchini and cook 3 minutes more, stirring occasionally, until slightly golden.','Add the minced garlic and cook 30 seconds, stirring.','Push vegetables to the side. Add the crumbled tofu in the center. Cook 2 minutes without stirring to develop a golden base.','Mix the soy sauce and turmeric in a small bowl. Pour over the pan. Add the sesame oil. Stir everything together — the tofu will turn bright golden-yellow.','Add the spinach and fold in. Cook 2 minutes until wilted. Taste and add salt and pepper if needed.','To assemble the bowls: place a scoop of cooked rice or quinoa in the bottom of each of 5 bowls. Top with an equal portion of the tofu and vegetable mixture. Scatter sliced green onions over each bowl. Drizzle with a tiny bit more soy sauce if desired. Serve immediately.'],
  kids:{aleene:'Crumble the pressed tofu and stir in soy sauce and turmeric',kaily:'Assemble the bowls — add rice and tofu mixture to each',lilly:'Scatter the green onions over each finished bowl'},
  nutrition:{cal:310,protein:'20g',fat:'11g',carbs:'35g',sugar:'3g'}});

addRecipe('Apple Cinnamon Oatmeal','breakfast',{prep:'3min',cook:'10min',serves:5,freezer:false,
  ingredients:['2½ cups old-fashioned rolled oats','5 cups water','2 medium apples — cored and diced into small pieces (no need to peel)','2 tbsp pure maple syrup (or honey)','1½ tsp ground cinnamon','¼ tsp ground nutmeg','¼ tsp vanilla extract','pinch of salt'],
  steps:['Wash hands. Core and dice the apples into small ½-inch pieces. You do not need to peel them — the peel adds fiber and color.','Bring 5 cups of water to a boil in a medium saucepan over high heat.','Once boiling, stir in the oats and a pinch of salt. Reduce heat to medium-low.','Cook the oats 5 minutes, stirring every 90 seconds to prevent sticking to the bottom of the pan.','After 5 minutes, stir in the diced apple pieces. Continue cooking 2–3 more minutes, stirring often, until the oats are thick and creamy and the apple pieces have softened slightly but still hold their shape.','Remove the pan from the heat. Stir in the cinnamon, nutmeg, vanilla extract, and maple syrup. Taste — add more cinnamon or maple syrup if you would like.','Let the oatmeal rest 1 minute off the heat — it will thicken slightly as it cools.','Ladle into 5 bowls, dividing evenly. The serving should look thick and creamy, not watery.','Optional: top each bowl with a few extra apple slices and a light dusting of cinnamon. Serve while hot.'],
  kids:{aleene:'Core and dice the apples into small pieces',kaily:'Stir the oats every 90 seconds to keep them from sticking',lilly:'Sprinkle cinnamon over each finished bowl'},
  nutrition:{cal:230,protein:'6g',fat:'3g',carbs:'47g',sugar:'14g'}});

addRecipe('Chia Pudding & Mango','breakfast',{prep:'8min',cook:'0min',serves:5,freezer:false,
  ingredients:['¾ cup chia seeds','3½ cups unsweetened oat milk','2 tbsp pure maple syrup','1 tsp vanilla extract','2 ripe mangoes — peeled, pit removed, and diced into small cubes'],
  steps:['Wash hands. Measure the oat milk into a large bowl or pitcher. Add the maple syrup and vanilla extract. Stir well to combine.','Add the chia seeds to the oat milk mixture. Stir vigorously for 1 minute so the seeds are evenly distributed and not clumped together.','Wait 5 minutes, then stir again — this second stir is important. Chia seeds tend to clump at the bottom as they first start to absorb liquid. Breaking up those clumps now ensures a creamy, even pudding.','Cover the bowl tightly with plastic wrap or a lid. Refrigerate for at least 4 hours, or overnight — overnight is best. The pudding will thicken from a liquid to a thick, creamy texture as the chia seeds absorb the milk.','The next morning: while the pudding is still in the refrigerator, peel and dice the mangoes. Stand the mango upright and slice the flesh away from the flat pit on each side. Score the flesh in a grid pattern, then use a spoon to scoop the cubes out.','Remove the pudding from the refrigerator. Stir it once to make sure it is smooth and thick throughout. If it is thicker than you like, stir in 2–3 tablespoons of extra oat milk.','Spoon the pudding into 5 bowls or jars, dividing evenly. Top each serving generously with fresh diced mango.','Serve immediately, or keep covered in the refrigerator up to 3 days. This is an excellent make-ahead breakfast for busy school mornings.'],
  kids:{aleene:'Stir the chia seeds into the oat milk and do the second stir after 5 minutes',kaily:'Dice the mango into cubes and arrange them on top of each bowl',lilly:'Scoop the pudding into each bowl with a large spoon'},
  nutrition:{cal:255,protein:'7g',fat:'9g',carbs:'38g',sugar:'16g'}});

addRecipe('Berry Overnight Oats','breakfast',{prep:'8min',cook:'0min',serves:5,freezer:false,
  ingredients:['2½ cups old-fashioned rolled oats','2½ cups unsweetened oat milk','1 cup plain non-dairy yogurt (coconut or oat-based)','2 tbsp pure maple syrup','1 tsp vanilla extract','¼ tsp ground cinnamon','2 cups mixed berries (blueberries, raspberries, sliced strawberries — fresh or frozen)','pinch of salt'],
  steps:['Wash hands. In a large bowl, combine the rolled oats, oat milk, non-dairy yogurt, maple syrup, vanilla extract, cinnamon, and a pinch of salt.','Stir everything together thoroughly until the oats are fully coated and the yogurt and milk are fully mixed in. No dry oat pockets should remain.','If using frozen berries, add half of them directly to the oat mixture now and stir in — they will thaw overnight and flavor the oats. If using fresh berries, save all of them for topping.','Divide the oat mixture evenly between 5 jars, bowls, or containers with lids. Each container should be about halfway full to leave room for toppings.','Seal the containers tightly and place in the refrigerator. Refrigerate at least 6 hours, or ideally overnight. The oats absorb the liquid and become thick and creamy by morning.','In the morning: remove the containers from the refrigerator. Give each one a quick stir. The oats should be thick — if too thick, add a splash of oat milk and stir.','Top each container generously with fresh berries. Add a light drizzle of extra maple syrup if desired.','Serve directly from the jar or pour into a bowl. These keep refrigerated up to 4 days — great for prepping on Sunday for the whole school week.'],
  kids:{aleene:'Measure and stir all the oat mixture ingredients together in the big bowl',kaily:'Pour the oat mixture evenly into each jar or container',lilly:'Top each jar with fresh berries in the morning'},
  nutrition:{cal:265,protein:'7g',fat:'5g',carbs:'50g',sugar:'13g'}});

addRecipe('Almond Butter Toast & Banana','breakfast',{prep:'5min',cook:'3min',serves:5,freezer:false,
  ingredients:['5 slices whole wheat bread','5 tbsp natural almond butter (no added sugar)','3 ripe bananas — peeled and sliced into rounds','1 tbsp honey or maple syrup — for drizzling','¼ tsp ground cinnamon'],
  steps:['Wash hands. Peel the bananas and slice them into rounds about ¼-inch thick. Set aside on a small plate.','Place all 5 bread slices in the toaster. Toast on your preferred setting until golden brown and firm — usually medium or medium-dark.','While the toast is still warm, place each slice on a plate. Warm toast makes the almond butter easier to spread.','Scoop 1 tablespoon of almond butter onto each slice of toast. Using the back of a spoon, spread the almond butter all the way to the edges of the toast — an even layer helps every bite taste the same.','Arrange banana slices on top of the almond butter in a single layer, covering as much of the toast as possible.','Drizzle a very thin stream of honey or maple syrup over each toast — about ½ teaspoon per slice. Less is more here.','Dust a light pinch of cinnamon over each piece of toast.','Serve immediately. This is a great school-morning breakfast because it takes under 5 minutes and can be eaten on the go. The banana provides quick energy and the almond butter provides protein to keep hunger away until lunch.'],
  kids:{aleene:'Spread the almond butter evenly across each piece of toast',kaily:'Peel and slice the bananas into neat rounds',lilly:'Arrange the banana slices on top of the almond butter'},
  nutrition:{cal:290,protein:'8g',fat:'11g',carbs:'43g',sugar:'15g'}});

  ingredients:['2½ cups old-fashioned rolled oats','5 cups water','2 ripe pears — cored and diced into small pieces','2 tbsp pure maple syrup','1 tsp ground cinnamon','¼ tsp ground ginger','¼ tsp vanilla extract','pinch of salt','2 tbsp chopped walnuts (optional — for topping)'],
  steps:['Wash hands. Core the pears and dice into small ½-inch pieces. You can leave the peel on for extra fiber and color. Set aside.','Bring 5 cups of water to a boil in a medium saucepan over high heat. Add a pinch of salt.','Once boiling, stir in the rolled oats. Reduce heat to medium-low.','Cook the oats 5 minutes, stirring every 90 seconds to prevent sticking. The oats should start to thicken and look creamy.','After 5 minutes, add the diced pear pieces. Stir to combine. Cook 2 more minutes — the pear will soften slightly but stay in pieces.','Remove from heat. Stir in the cinnamon, ginger, vanilla extract, and maple syrup. Taste and add more maple syrup if you like it sweeter.','Let the oatmeal rest off the heat for 1 minute — it will thicken a little more.','Scoop into 5 bowls, dividing evenly. Top each bowl with a few extra pear pieces and a pinch of cinnamon. If using walnuts, scatter a small amount over each bowl.','Serve immediately while hot. Leftovers can be stored covered in the refrigerator and reheated with a splash of water or oat milk the next morning.'],

addRecipe('Apple Walnut Overnight Oats','breakfast',{prep:'8min',cook:'0min',serves:5,freezer:false,
  ingredients:['2½ cups old-fashioned rolled oats','2½ cups unsweetened oat milk','½ cup unsweetened applesauce','2 tbsp pure maple syrup','1½ tsp ground cinnamon','¼ tsp ground nutmeg','¼ tsp vanilla extract','2 medium apples — cored and diced small (for topping in the morning)','¼ cup chopped walnuts (for topping)','pinch of salt'],

addRecipe('Warm Spiced Oatmeal','breakfast',{prep:'3min',cook:'10min',serves:5,freezer:false,
  ingredients:['2½ cups old-fashioned rolled oats','5 cups water','2 tbsp pure maple syrup','1½ tsp ground cinnamon','½ tsp ground ginger','¼ tsp ground cardamom','¼ tsp ground cloves','¼ tsp vanilla extract','pinch of salt','oat milk for serving (optional)'],
  steps:['Wash hands. Measure out all the spices — cinnamon, ginger, cardamom, and cloves — into a small bowl together. Mixing them first makes it easy to add at the right moment.','Bring 5 cups of water to a boil in a medium saucepan. Add a pinch of salt.','Once boiling, stir in the rolled oats. Reduce heat to medium-low.','Cook 5 minutes, stirring every 90 seconds.','Remove from heat. Immediately stir in the spice mixture, vanilla extract, and maple syrup. Stir thoroughly for 30 seconds so the spices are completely mixed in — no brown powder pockets.','Let rest off heat 1 minute so the oats finish thickening and the spices bloom in the warmth.','Taste and adjust sweetness with a little extra maple syrup if desired.','Scoop into 5 bowls. If you like a thinner, creamier oatmeal, pour a small splash of oat milk over the top of each bowl before serving.','Serve hot. This is a warming, comforting breakfast — especially great on cold mornings.'],
  kids:{aleene:'Measure all spices into the small bowl and mix them together',kaily:'Stir the oats every 90 seconds as they cook',lilly:'Pour the spice mixture into the finished oatmeal and stir it in'},

addRecipe('Chia Pudding & Banana','breakfast',{prep:'8min',cook:'0min',serves:5,freezer:false,
  ingredients:['¾ cup chia seeds','3½ cups unsweetened oat milk','2 tbsp pure maple syrup','1 tsp vanilla extract','¼ tsp ground cinnamon','4 ripe bananas — peeled and sliced into rounds'],
  steps:['Wash hands. Pour the oat milk into a large bowl. Add the maple syrup, vanilla extract, and cinnamon. Whisk or stir until fully combined.','Add the chia seeds. Stir vigorously for 1 full minute to distribute the seeds evenly.','Wait 5 minutes, then stir again firmly — this second stir is critical to break up any clumps of chia seeds that have settled at the bottom.','Cover the bowl tightly with plastic wrap or a lid and refrigerate for at least 4 hours, or overnight. Overnight produces the best, creamiest texture.','The next morning: peel and slice the bananas just before serving — banana browns quickly once cut, so slice at the last moment.','Remove the pudding from the refrigerator. Stir once more. If it is thicker than you like, stir in a tablespoon or two of oat milk to loosen it.','Spoon the chia pudding into 5 bowls or jars, dividing evenly.','Arrange banana slices generously on top of each serving.','Serve immediately. For a school morning, you can layer the pudding and banana in a jar the night before and eat it on the way.'],
  kids:{aleene:'Whisk the oat milk, maple syrup, vanilla, and cinnamon together',kaily:'Stir the chia seeds in and do the second stir after 5 minutes',lilly:'Slice bananas and arrange them on top of each serving'},
  nutrition:{cal:265,protein:'7g',fat:'9g',carbs:'41g',sugar:'17g'}});

addRecipe('Cranberry Oatmeal','breakfast',{prep:'3min',cook:'10min',serves:5,freezer:false,
  ingredients:['2½ cups old-fashioned rolled oats','5 cups water','½ cup dried cranberries (unsweetened or lightly sweetened)','2 tbsp pure maple syrup','1 tsp ground cinnamon','¼ tsp ground orange zest (or ½ tsp fresh orange zest)','¼ tsp vanilla extract','pinch of salt'],
  steps:['Wash hands. Measure out all the ingredients and have them ready before you start — the oats come together quickly.','Bring 5 cups of water to a boil in a medium saucepan. Add a pinch of salt.','Once boiling, stir in the rolled oats and dried cranberries together. Reduce heat to medium-low.','Cook 5–6 minutes, stirring every 90 seconds. The cranberries will plump up slightly as they absorb moisture and soften.','After 5–6 minutes, the oats should be thick and creamy and the cranberries will look glossy and plump.','Remove from heat. Stir in the cinnamon, orange zest, vanilla extract, and maple syrup. Stir for 30 seconds.','Taste and adjust — add more maple syrup for sweetness, or a tiny pinch more cinnamon.','Let rest 1 minute off heat to finish thickening.','Scoop into 5 bowls and serve hot. The cranberries give this oatmeal a beautiful deep pink-red color and a tart-sweet flavor that complements the cinnamon perfectly.'],
  kids:{aleene:'Measure the oats and cranberries and stir them together into the boiling water',kaily:'Stir the oats every 90 seconds to prevent sticking',lilly:'Stir in the maple syrup, cinnamon, and orange zest after the pan comes off the heat'},
  nutrition:{cal:250,protein:'6g',fat:'3g',carbs:'52g',sugar:'17g'}});

addRecipe('Pumpkin Spice Oatmeal','breakfast',{prep:'3min',cook:'10min',serves:5,freezer:false,
  ingredients:['2½ cups old-fashioned rolled oats','4 cups water','1 cup canned pure pumpkin purée (not pie filling)','2 tbsp pure maple syrup','1½ tsp pumpkin pie spice','½ tsp ground cinnamon','¼ tsp vanilla extract','pinch of salt'],
  steps:['Wash hands. Measure the pumpkin purée into a small bowl and set nearby — you will add it to the oats as they cook.','Combine 4 cups of water and a pinch of salt in a medium saucepan. Bring to a boil over high heat.','Once boiling, stir in the rolled oats. Reduce heat to medium-low.','After 2 minutes of cooking, stir in the pumpkin purée. The mixture will look orange — that is perfect.','Cook another 4–5 minutes, stirring every 90 seconds. The pumpkin makes the oats extra thick, so stir more frequently to prevent sticking.','Remove from heat. Stir in the pumpkin pie spice, cinnamon, vanilla extract, and maple syrup. Mix thoroughly.','Taste and adjust sweetness — add more maple syrup if desired.','Let rest 1 minute off heat.','Scoop into 5 bowls. Dust a pinch of extra cinnamon or pumpkin pie spice on top of each bowl for presentation. Serve hot immediately.'],
  kids:{aleene:'Stir the pumpkin purée into the cooking oats at the 2-minute mark',kaily:'Stir the oats every 90 seconds — they need extra attention because of the pumpkin',lilly:'Sprinkle cinnamon on top of each bowl before serving'},
  nutrition:{cal:225,protein:'6g',fat:'3g',carbs:'46g',sugar:'8g'}});

addRecipe('Chia Pudding & Apple','breakfast',{prep:'8min',cook:'0min',serves:5,freezer:false,
  ingredients:['¾ cup chia seeds','3½ cups unsweetened oat milk','2 tbsp pure maple syrup','1 tsp vanilla extract','1½ tsp ground cinnamon','¼ tsp ground nutmeg','2 medium apples — cored and diced small'],
  steps:['Wash hands. Pour the oat milk into a large bowl. Add the maple syrup, vanilla extract, cinnamon, and nutmeg. Stir or whisk until fully combined.','Pour in the chia seeds. Stir vigorously for 1 full minute — it is important to get the seeds spread evenly so they do not all clump together in one spot.','Set a timer for 5 minutes. When it goes off, stir vigorously again, scraping the bottom of the bowl. This second stir breaks up the clumps that have formed.','Cover the bowl tightly with a lid or plastic wrap. Refrigerate for at least 4 hours, or overnight. The pudding will transform from a thin liquid to a thick, scoopable pudding as the chia seeds swell.','In the morning: core the apples and dice them into small pieces. Keep the peel on for extra nutrition and color.','Remove the pudding from the refrigerator. Stir to make sure it is smooth throughout — no large clumps. If it is too thick, stir in a tablespoon or two of oat milk.','Divide evenly into 5 bowls or jars.','Top generously with diced apple and a light additional sprinkle of cinnamon over the top.','Serve immediately, or pack in a jar for a grab-and-go school morning breakfast. Keeps refrigerated up to 4 days.'],
  kids:{aleene:'Stir the chia seeds in and do both stirs (at the start and at 5 minutes)',kaily:'Core and dice the apples into small pieces for the topping',lilly:'Divide the pudding into bowls and add apple topping'},
  nutrition:{cal:250,protein:'7g',fat:'9g',carbs:'38g',sugar:'14g'}});

addRecipe('Pear Overnight Oats','breakfast',{prep:'8min',cook:'0min',serves:5,freezer:false,
  ingredients:['2½ cups old-fashioned rolled oats','2½ cups unsweetened oat milk','½ cup plain non-dairy yogurt (coconut or oat-based)','2 tbsp pure maple syrup','1 tsp ground cinnamon','½ tsp ground ginger','¼ tsp vanilla extract','3 ripe pears — cored and diced small (for morning topping)','pinch of salt'],
  steps:['Wash hands. In a large bowl, combine the rolled oats, oat milk, non-dairy yogurt, maple syrup, cinnamon, ginger, vanilla extract, and pinch of salt.','Stir everything very well until the yogurt and oat milk are completely blended together and every oat is coated. There should be no dry patches.','Taste the raw mixture and adjust sweetness or spice if needed — this is your best chance since it will be harder to adjust after refrigerating.','Divide the mixture evenly between 5 airtight containers or jars. Seal them.','Refrigerate at least 6 hours, or overnight. The oats will absorb the liquid and become very thick and creamy.','The next morning: core and dice the pears into small pieces just before serving — fresh is best.','Remove the oat jars from the refrigerator. Stir each one. If they are thicker than you like, add a splash of oat milk and stir.','Top generously with diced fresh pear and a pinch of extra cinnamon.','Serve right from the jar for a fast morning, or empty into a bowl. These keep refrigerated up to 4 days.'],
  kids:{aleene:'Stir all the oat mixture ingredients together in the large bowl',kaily:'Pour the mixture evenly into each jar — try to fill each one the same amount',lilly:'Top each jar with fresh pear pieces and cinnamon in the morning'},
  nutrition:{cal:275,protein:'7g',fat:'5g',carbs:'53g',sugar:'17g'}});

addRecipe('Overnight Oats & Cinnamon Apple','breakfast',{prep:'8min',cook:'0min',serves:5,freezer:false,
  ingredients:['2½ cups old-fashioned rolled oats','3 cups unsweetened oat milk','¼ cup unsweetened applesauce','2 tbsp pure maple syrup','2 tsp ground cinnamon','¼ tsp ground nutmeg','¼ tsp vanilla extract','2 medium apples — cored and diced small (for morning topping)','pinch of salt'],
  steps:['Wash hands. Combine the rolled oats, oat milk, applesauce, maple syrup, cinnamon, nutmeg, vanilla extract, and pinch of salt in a large mixing bowl.','Stir everything together vigorously for about 1 minute. The applesauce will blend smoothly into the oat milk. Make sure there are no dry oat clumps.','Taste and adjust seasoning — the raw mixture should taste pleasantly spiced and lightly sweet.','Divide the oat mixture evenly between 5 sealed jars or containers with tight-fitting lids.','Refrigerate overnight (at least 6 hours). By morning the oats will be thick and cold.','The next morning: core and dice the apples into small pieces. To prevent browning if prepping ahead, toss the apple pieces with a tiny squeeze of lemon juice.','Remove the oat jars. Stir each one to loosen. Add a splash of oat milk if they are too thick.','Top generously with diced cinnamon apple. Optionally add an extra dusting of cinnamon.','Serve from the jar or a bowl. These are ideal for school mornings because they are 100% ready the night before with no cooking.'],
  kids:{aleene:'Stir all ingredients together in the big bowl until smooth',kaily:'Ladle the mixture into each jar evenly',lilly:'Dice the apples and add them on top of each jar in the morning'},
  nutrition:{cal:260,protein:'6g',fat:'4g',carbs:'51g',sugar:'15g'}});

addRecipe('Overnight Oats & Cranberry','breakfast',{prep:'8min',cook:'0min',serves:5,freezer:false,
  ingredients:['2½ cups old-fashioned rolled oats','3 cups unsweetened oat milk','½ cup plain non-dairy yogurt (coconut or oat-based)','2 tbsp pure maple syrup','1 tsp ground cinnamon','¼ tsp vanilla extract','½ cup dried cranberries (unsweetened or lightly sweetened)','pinch of salt'],
  steps:['Wash hands. In a large bowl, combine the oats, oat milk, non-dairy yogurt, maple syrup, cinnamon, vanilla extract, and pinch of salt.','Stir thoroughly until the yogurt is completely blended in and the mixture is uniform.','Add the dried cranberries and stir them in. They will soften overnight as they absorb moisture and plump up beautifully.','Taste the raw mixture. Adjust sweetness or cinnamon to your liking.','Divide the mixture evenly between 5 jars or airtight containers. The dried cranberries should be distributed throughout all containers — stir once more before pouring if they have sunk.','Seal the containers and refrigerate for at least 6 hours, or overnight.','The next morning: remove the containers from the refrigerator. Stir each one — the cranberries will have plumped significantly and look glossy.','Add a splash of oat milk and stir if you prefer a thinner consistency.','Serve immediately from the jar or a bowl. For an extra-special touch, top with a few fresh cranberries or a light drizzle of maple syrup.'],
  kids:{aleene:'Stir the oat mixture and fold in the cranberries evenly',kaily:'Pour the mixture into each jar, making sure cranberries are in every one',lilly:'Stir each jar in the morning and drizzle extra maple syrup on top'},
  nutrition:{cal:285,protein:'7g',fat:'5g',carbs:'55g',sugar:'18g'}});

addRecipe('Banana Almond Pancakes','breakfast',{prep:'8min',cook:'20min',serves:5,freezer:true,
  ingredients:['2 cups whole wheat flour','2 tbsp baking powder','1 tbsp ground cinnamon','pinch of salt','2 cups unsweetened oat milk','3 large eggs','2 tbsp pure maple syrup','1 tsp vanilla extract','3 ripe bananas — mashed until smooth','¼ cup natural almond butter (no added sugar)','coconut oil or olive oil spray for the pan'],
  steps:['Wash hands. Peel the 3 bananas and place them in a large bowl. Mash them completely with a fork until there are no large lumps — the smoother the better. This takes about 2 minutes of firm mashing.','In a separate medium bowl, whisk together the whole wheat flour, baking powder, cinnamon, and pinch of salt. Set aside.','Add the oat milk, eggs, maple syrup, vanilla extract, and almond butter to the bowl with the mashed banana. Stir until everything is combined — the almond butter will need extra stirring to fully blend in.','Pour the flour mixture into the wet banana mixture. Stir gently with a large spoon or spatula until just combined. Do NOT overmix — a few lumps are completely fine. Overmixing makes pancakes tough.','Let the batter rest 3 minutes while you heat the pan.','Heat a large nonstick skillet or griddle over medium heat. When hot, spray lightly with coconut oil spray or brush with a small amount of oil.','Pour approximately ¼ cup of batter per pancake onto the skillet. Leave about 2 inches between each pancake.','Cook until you see bubbles forming across the surface and the edges look set and dry — about 2–3 minutes. Flip carefully with a spatula and cook another 1–2 minutes on the second side until golden brown.','Transfer finished pancakes to a plate and cover with a clean kitchen towel to keep warm while you cook the remaining batches.','To freeze: let pancakes cool completely on a wire rack. Place parchment paper between each pancake and store in a zip-lock bag in the freezer. Reheat in a toaster for 2 minutes on school mornings.'],
  kids:{aleene:'Mash the bananas and stir the almond butter into the wet mixture',kaily:'Combine the flour mixture into the wet mixture — gently, no overmixing',lilly:'Watch for bubbles on top of the pancakes as the signal to flip'},
  nutrition:{cal:380,protein:'14g',fat:'10g',carbs:'62g',sugar:'18g'}});

addRecipe('Cinnamon Sweet Potato Oatmeal','breakfast',{prep:'8min',cook:'12min',serves:5,freezer:false,
  ingredients:['2½ cups old-fashioned rolled oats','4 cups water','1 cup mashed cooked sweet potato (about 1 large sweet potato — baked or microwaved ahead of time)','2 tbsp pure maple syrup','2 tsp ground cinnamon','½ tsp ground ginger','¼ tsp ground nutmeg','¼ tsp vanilla extract','pinch of salt'],
  steps:['Wash hands. If you have not already cooked the sweet potato: pierce a large sweet potato all over with a fork and microwave on high for 5–7 minutes, turning once halfway, until completely soft when squeezed. Alternatively, bake at 400°F for 45 minutes. Cool for a few minutes, then scoop out the flesh and mash thoroughly with a fork until smooth and free of lumps. You need 1 cup of mashed sweet potato for this recipe.','Bring 4 cups of water to a boil in a medium saucepan over high heat. Add a pinch of salt.','Once boiling, stir in the rolled oats. Reduce heat to medium-low.','After 2 minutes of cooking, stir in the mashed sweet potato. The oatmeal will turn a warm orange-golden color.','Continue cooking 3–4 more minutes, stirring every 90 seconds. Sweet potato oatmeal is thicker and stickier than plain oatmeal, so stir frequently to prevent it from sticking to the bottom of the pan.','Remove from heat. Stir in the cinnamon, ginger, nutmeg, vanilla extract, and maple syrup. Mix well.','Taste and adjust — add more maple syrup for sweetness or more cinnamon for spice.','Let rest 1 minute off heat.','Divide into 5 bowls and serve hot. Optionally top with a drizzle of maple syrup or a sprinkle of extra cinnamon.'],
  kids:{aleene:'Mash the cooked sweet potato until completely smooth with no lumps',kaily:'Stir the sweet potato mash into the cooking oats and stir every 90 seconds',lilly:'Add the cinnamon, ginger, nutmeg, and maple syrup and stir them in at the end'},
  nutrition:{cal:250,protein:'6g',fat:'3g',carbs:'52g',sugar:'11g'}});

addRecipe('Blueberry Oat Muffins (dairy-free)','breakfast',{prep:'10min',cook:'22min',serves:5,freezer:true,
  ingredients:['2 cups whole wheat flour','1½ cups old-fashioned rolled oats','2 tsp baking powder','½ tsp baking soda','1½ tsp ground cinnamon','¼ tsp salt','1½ cups unsweetened oat milk','2 large eggs','¼ cup pure maple syrup','¼ cup unsweetened applesauce','2 tsp vanilla extract','1½ cups fresh or frozen blueberries','olive oil spray or coconut oil for muffin tin'],
  steps:['Wash hands. Preheat the oven to 375°F. Spray a 12-cup muffin tin generously with oil spray, or line with paper muffin cups.','In a large bowl, combine the whole wheat flour, rolled oats, baking powder, baking soda, cinnamon, and salt. Stir with a fork until evenly mixed.','In a separate bowl, whisk together the oat milk, eggs, maple syrup, applesauce, and vanilla extract until fully combined and smooth.','Pour the wet ingredients into the dry ingredients. Stir gently with a large spoon or spatula until just combined — a few streaks of flour are fine. Do NOT overmix or the muffins will be dense and tough.','Gently fold in the blueberries. If using frozen, add them straight from the freezer — do not thaw.','Spoon the batter evenly into the muffin tin, filling each cup about ¾ full. Use a spoon or a ladle. The batter will be thick.','Bake at 375°F for 20–22 minutes, until a toothpick inserted into the center of a muffin comes out clean (a few moist crumbs are OK, but no wet batter).','Remove from the oven and let cool in the tin for 5 minutes. Then transfer muffins to a wire rack to finish cooling.','To freeze: let muffins cool completely. Place in a zip-lock freezer bag. Reheat in the microwave for 45–60 seconds on school mornings, or toast for 3 minutes.'],
  kids:{aleene:'Stir the wet ingredients into the dry ingredients — gently, stop when just combined',kaily:'Fold the blueberries in carefully without smashing them',lilly:'Spoon the batter into each muffin cup, filling them ¾ of the way'},
  nutrition:{cal:295,protein:'9g',fat:'5g',carbs:'55g',sugar:'13g'}});

addRecipe('Mango Smoothie Bowl','breakfast',{prep:'8min',cook:'0min',serves:5,freezer:false,
  ingredients:['4 cups frozen mango chunks','1½ cups unsweetened oat milk or coconut milk','2 tbsp pure maple syrup','1 tsp vanilla extract','toppings: 1 fresh mango (diced), ¼ cup granola, 2 tbsp chia seeds, 1 banana (sliced)'],
  steps:['Wash hands. Make sure the mango chunks are fully frozen — this is what makes the smoothie bowl thick enough to eat with a spoon.','Add the frozen mango, oat milk (start with 1 cup — add more only if needed), maple syrup, and vanilla extract to a blender.','Blend on high speed until smooth. Stop the blender every 15 seconds and press the mango down with a spatula if needed. The mixture should be very thick — like soft serve ice cream — not thin and pourable. Add extra oat milk one tablespoon at a time only if the blender is struggling.','Taste the blended base and adjust sweetness with a little more maple syrup if desired.','Divide the thick smoothie evenly between 5 bowls. Work quickly — the frozen base warms up fast.','Top each bowl immediately with: diced fresh mango, banana slices, a sprinkle of granola, and a pinch of chia seeds.','Serve immediately. Smoothie bowls must be eaten right away — they do not keep and cannot be stored once blended.','Note for parents: blend in 2–3 batches in a standard blender if needed to avoid overloading the motor.'],
  kids:{aleene:'Blend the frozen mango — push it down with the spatula between pulses',kaily:'Dice the fresh mango topping and slice the banana',lilly:'Sprinkle granola and chia seeds on top of each finished bowl'},
  nutrition:{cal:240,protein:'4g',fat:'3g',carbs:'53g',sugar:'38g'}});

addRecipe('Banana Almond Smoothie','breakfast',{prep:'5min',cook:'0min',serves:5,freezer:false,
  ingredients:['5 ripe bananas — peeled and frozen overnight (or use fresh for a thinner smoothie)','4 cups unsweetened oat milk','5 tbsp natural almond butter (no added sugar)','2 tbsp pure maple syrup','1 tsp vanilla extract','1 tsp ground cinnamon','2 cups ice cubes (if using fresh bananas)'],
  steps:['Wash hands. For the creamiest, thickest smoothie, bananas should be peeled and frozen the night before. If using frozen bananas, no ice is needed. If using fresh bananas, add 2 cups of ice to get a cold smoothie.','Break the frozen bananas into 3–4 chunks each so they blend more easily. Place in the blender.','Add the oat milk, almond butter, maple syrup, vanilla extract, and cinnamon to the blender.','Blend on high speed for 45–60 seconds until completely smooth. Stop and scrape down the sides with a spatula if needed, then blend again.','Taste the smoothie — adjust with more almond butter for nuttiness, more maple syrup for sweetness, or more cinnamon for spice.','Pour into 5 glasses, dividing evenly. Serve immediately.','This smoothie is excellent for busy school mornings — it can be prepped in under 5 minutes if bananas are frozen in advance.','Tip: freeze bananas in bulk on Sunday evening — peel, break in half, and store in a zip-lock bag. Ready all week.'],
  kids:{aleene:'Break the frozen bananas into chunks and add all ingredients to the blender',kaily:'Blend on high and scrape down the sides — then blend again until smooth',lilly:'Pour the smoothie carefully into each glass'},
  nutrition:{cal:330,protein:'8g',fat:'11g',carbs:'53g',sugar:'28g'}});

addRecipe('Green Smoothie Bowl','breakfast',{prep:'8min',cook:'0min',serves:5,freezer:false,
  ingredients:['3 cups frozen mango chunks','2 cups fresh baby spinach','1½ cups unsweetened oat milk','2 ripe bananas — peeled','2 tbsp pure maple syrup','1 tsp vanilla extract','toppings: ¼ cup granola, 1 banana (sliced), 2 tbsp chia seeds, ½ cup fresh blueberries'],
  steps:['Wash hands. Add the frozen mango, fresh spinach, oat milk, bananas, maple syrup, and vanilla extract to a blender.','Blend on high speed until completely smooth — about 60 seconds. The spinach will make the smoothie bright green, which is a fun color for kids!','Check the consistency — it should be very thick, like soft-serve. If it is too thin to hold toppings, add ¼ cup more frozen mango. If it is too thick for the blender to move, add oat milk one tablespoon at a time.','Taste and adjust sweetness with extra maple syrup if needed.','Quickly divide the thick green smoothie into 5 bowls using a large spoon or ladle. Work fast — it will begin to warm and thin out.','Top each bowl immediately with banana slices, a sprinkle of granola, chia seeds, and fresh blueberries.','Serve immediately. Do not refrigerate or save — the texture changes as it warms.','Fun fact for kids: the green color comes 100% from spinach, but you cannot taste it at all because the mango and banana are so sweet!'],
  kids:{aleene:'Blend the smoothie ingredients until completely smooth and bright green',kaily:'Slice the banana topping and measure out the blueberries',lilly:'Sprinkle toppings over each bowl — granola, chia seeds, and blueberries'},
  nutrition:{cal:255,protein:'5g',fat:'3g',carbs:'56g',sugar:'36g'}});

addRecipe('Smoothie Bowl (oat milk)','breakfast',{prep:'8min',cook:'0min',serves:5,freezer:false,
  ingredients:['2 cups frozen blueberries','2 cups frozen mango chunks','1 ripe banana — peeled','1½ cups unsweetened oat milk','1 tbsp pure maple syrup','toppings: ¼ cup granola, ½ cup fresh mixed berries, 2 tbsp chia seeds, 5 tsp almond butter'],
  steps:['Wash hands. Add the frozen blueberries, frozen mango, banana, oat milk, and maple syrup to a blender.','Blend on high for 45–60 seconds. The mixture should be very thick and almost purple-colored from the blueberries. If the blender stalls, add oat milk one tablespoon at a time and try again.','Taste the blended base — it should be creamy and naturally sweet. Adjust with a bit more maple syrup if desired.','Spoon the thick blended mixture into 5 bowls, dividing evenly. Use a large spoon and work quickly before it starts to warm up.','Top each bowl with: a small handful of granola, a few fresh berries, a sprinkle of chia seeds, and 1 teaspoon of almond butter drizzled on top (or a small dollop in the center).','Serve immediately — smoothie bowls cannot be stored and must be eaten right away.'],
  kids:{aleene:'Blend all the ingredients until smooth and thick',kaily:'Spoon the smoothie evenly into each bowl',lilly:'Decorate each bowl with granola, berries, and chia seeds'},
  nutrition:{cal:245,protein:'5g',fat:'5g',carbs:'48g',sugar:'28g'}});

addRecipe('Chickpea Breakfast Scramble','breakfast',{prep:'5min',cook:'12min',serves:5,freezer:false,
  ingredients:['2 cans (15 oz each) chickpeas — drained, rinsed, and patted dry','2 cups fresh baby spinach','½ medium onion — peeled and diced','1 red bell pepper — seeds removed and diced','2 garlic cloves — minced','1 tbsp olive oil','1 tsp turmeric','1 tsp smoked paprika','½ tsp cumin','2 tbsp low-sodium soy sauce','salt and pepper to taste'],
  steps:['Wash hands. Open and drain the chickpea cans in a colander. Rinse under cold water. Spread on a clean kitchen towel and pat very dry — the drier the chickpeas, the better they will crisp up.','Dice the onion and bell pepper. Mince the garlic.','Heat olive oil in a large nonstick skillet over medium-high heat. Add the diced onion and bell pepper. Cook 3 minutes, stirring, until softened.','Add the minced garlic and cook 30 seconds, stirring constantly.','Add the dried chickpeas to the skillet. Spread in a single layer. Do not stir for 2 minutes so the bottoms can get golden and slightly crispy.','Stir and cook another 2–3 minutes, continuing to let the chickpeas brown all over.','In a small bowl, mix the turmeric, smoked paprika, cumin, and soy sauce together. Pour over the chickpea mixture. Stir well so every chickpea is coated — the turmeric will turn everything golden-yellow.','Add the spinach and fold in. Cook 2 minutes until wilted.','Taste and season with salt and pepper as needed.','Divide into 5 portions and serve hot. Great with whole wheat toast on the side.'],
  kids:{aleene:'Drain, rinse, and pat the chickpeas completely dry with a towel',kaily:'Mix the spices and soy sauce together in the small bowl',lilly:'Fold the spinach in at the end and watch it wilt'},
  nutrition:{cal:235,protein:'12g',fat:'6g',carbs:'34g',sugar:'7g'}});

addRecipe('Black Bean Breakfast Bowl','breakfast',{prep:'5min',cook:'10min',serves:5,freezer:false,
  ingredients:['2 cans (15 oz each) black beans — drained and rinsed','2½ cups cooked brown rice (about 1 cup uncooked — cook ahead)','2 cups fresh baby spinach','½ medium onion — peeled and diced','2 garlic cloves — minced','1 tbsp olive oil','1 tsp cumin','1 tsp smoked paprika','½ tsp garlic powder','2 tbsp low-sodium soy sauce','4 green onions — sliced thin','salt and pepper to taste'],
  steps:['Wash hands. If you need to cook the brown rice, start it now according to package directions. It takes about 30 minutes. Brown rice is best made ahead the night before for fast assembly on school mornings.','Drain and rinse the black beans in a colander. Set aside.','Dice the onion and mince the garlic.','Heat olive oil in a large nonstick skillet over medium heat. Add the diced onion and cook 3 minutes until soft.','Add the minced garlic, cumin, smoked paprika, and garlic powder. Stir and cook 30 seconds.','Add the black beans to the skillet. Pour the soy sauce over them. Stir well to coat. Cook 3–4 minutes, stirring occasionally, until the beans are hot throughout and slightly thickened by the soy sauce.','Add the spinach and fold in. Cook 2 minutes until wilted.','Taste and adjust seasoning with salt and pepper.','Scoop cooked rice into each of 5 bowls. Top with the black bean and spinach mixture, dividing evenly.','Scatter sliced green onions over the top of each bowl. Serve hot.'],
  kids:{aleene:'Drain and rinse the black beans in the colander',kaily:'Stir the spices and soy sauce into the beans while they cook',lilly:'Scoop rice into each bowl and sprinkle green onions on top'},
  nutrition:{cal:320,protein:'14g',fat:'5g',carbs:'58g',sugar:'2g'}});

addRecipe('Sweet Potato Toast & Avocado','breakfast',{prep:'8min',cook:'18min',serves:5,freezer:false,
  ingredients:['2 large sweet potatoes — scrubbed clean, unpeeled, sliced lengthwise into ¼-inch thick planks','3 ripe avocados — pitted and flesh scooped out','2 tbsp fresh lemon juice','½ tsp garlic powder','salt and pepper to taste','optional toppings: red pepper flakes, everything bagel seasoning'],
  steps:['Wash hands. Scrub the sweet potatoes under running water. Using a sharp knife, slice each sweet potato lengthwise into planks about ¼ inch thick — like slices of bread. You need 10 planks total (2 per person).','Set your toaster to the highest setting. Place sweet potato planks in the toaster slots (or use a toaster oven). Toast once — the planks will come out partially cooked. Toast a second time on the highest setting. After 2 full toaster cycles, the planks should be firm, slightly golden on the edges, and fully cooked through. You can also use a 400°F oven for 20 minutes, flipping halfway.','While the sweet potato toasts, prepare the avocado: scoop the flesh from all 3 avocados into a medium bowl. Add lemon juice, garlic powder, salt, and pepper.','Mash the avocado with a fork until creamy but slightly chunky — a few small pieces of avocado add texture. Taste and adjust salt, lemon, or garlic powder.','When the sweet potato planks are done, lay 2 on each of 5 plates.','Spoon a generous amount of mashed avocado onto each plank and spread it to the edges.','Season each piece with a pinch of salt and pepper. Add red pepper flakes or everything bagel seasoning if desired.','Serve immediately — sweet potato toast is best eaten warm. This is a great dairy-free, grain-free breakfast option.'],
  kids:{aleene:'Mash the avocado with lemon juice, garlic powder, salt, and pepper',kaily:'Spread the mashed avocado evenly onto each sweet potato plank',lilly:'Sprinkle toppings like red pepper flakes or bagel seasoning on each piece'},
  nutrition:{cal:310,protein:'5g',fat:'18g',carbs:'36g',sugar:'8g'}});

addRecipe('Avocado Toast & Poached Egg','breakfast',{prep:'5min',cook:'10min',serves:5,freezer:false,
  ingredients:['5 slices whole wheat bread','3 ripe avocados — pitted and flesh scooped out','5 large eggs','1 tbsp white vinegar','2 tbsp fresh lemon juice','½ tsp garlic powder','salt and freshly ground black pepper to taste','red pepper flakes for topping (optional)'],
  steps:['Wash hands. Scoop the avocado flesh into a medium bowl. Add the lemon juice, garlic powder, salt, and pepper. Mash with a fork until mostly smooth with a few small chunks. Taste and adjust seasoning. Set aside.','Fill a medium saucepan or deep skillet with about 3 inches of water. Bring to a gentle simmer over medium heat — you want small bubbles rising from the bottom, NOT a rolling boil.','Add 1 tablespoon of white vinegar to the water — this helps the egg whites wrap tightly around the yolk as they cook.','While waiting for the water to simmer, toast all 5 bread slices in the toaster until golden brown and firm.','Crack one egg into a small cup or ramekin. Use a spoon to stir the simmering water gently in a circle to create a slow vortex. Slide the egg from the cup into the center of the vortex.','Cook for 2.5 to 3 minutes for a runny yolk, or 3.5 to 4 minutes for a firmer yolk. Use a slotted spoon to gently lift the egg — the whites should be set and opaque. Drain on a paper towel.','Repeat the process for each remaining egg, one at a time.','Spread a generous layer of mashed avocado on each piece of toast, covering all the way to the edges.','Place one poached egg on top of each piece of avocado toast. Season with salt, pepper, and a pinch of red pepper flakes if desired.','Serve immediately — poached eggs should be eaten right away while the yolk is still warm and runny.'],
  kids:{aleene:'Mash the avocado and spread it onto each piece of toast',kaily:'Crack each egg into the small cup before it goes into the water',lilly:'Sprinkle red pepper flakes or extra pepper on each finished plate'},
  nutrition:{cal:320,protein:'13g',fat:'18g',carbs:'28g',sugar:'3g'}});

addRecipe('French Toast (dairy-free)','breakfast',{prep:'8min',cook:'20min',serves:5,freezer:true,
  ingredients:['10 slices whole wheat bread (2 per person)','4 large eggs','1 cup unsweetened oat milk','2 tsp ground cinnamon','1 tsp vanilla extract','1 tbsp pure maple syrup (plus more for serving)','pinch of salt','coconut oil spray or olive oil for the pan'],
  steps:['Wash hands. Crack all 4 eggs into a large shallow bowl or baking dish — one wide enough to dip a slice of bread flat.','Add the oat milk, cinnamon, vanilla extract, 1 tablespoon maple syrup, and pinch of salt to the eggs. Whisk vigorously until completely combined and slightly frothy — about 30 seconds. No streaks of egg yolk should remain.','Taste the egg mixture — it should smell like cinnamon and vanilla. Set aside.','Heat a large nonstick skillet or griddle over medium heat. When hot, spray with coconut oil spray or brush lightly with oil.','Dip one slice of bread into the egg mixture. Let it soak for 5 seconds on the first side, then flip and soak for 5 more seconds on the second side. The bread should absorb the egg mixture but not fall apart.','Place the soaked bread in the hot skillet. Cook 2–3 minutes until the bottom is golden brown and the egg is set. Flip with a spatula and cook another 2 minutes on the second side until golden brown.','Remove to a plate and cover with a clean towel to keep warm. Repeat with all remaining slices.','Serve 2 slices per person. Drizzle with maple syrup at the table.','To freeze: let the French toast cool completely on a wire rack. Place parchment paper between slices and store in a freezer bag. Reheat in the toaster for 2–3 minutes on a school morning.'],
  kids:{aleene:'Whisk the eggs, oat milk, cinnamon, vanilla, and maple syrup until frothy',kaily:'Dip each bread slice for 5 seconds per side — make sure both sides are coated',lilly:'Watch the French toast cook and call out when the edges look golden and set'},
  nutrition:{cal:320,protein:'14g',fat:'8g',carbs:'48g',sugar:'10g'}});

  return {category:cat, prep:prep, cook:cook, serves:5, freezer:freezer, 
    ingredients:ingredients, steps:steps,
    kids: _getKidTasks(name, {isSlow,isSoup,isBaked,isStirFry,isTofu,isBean,isOats,isSmoothie,isSalad,isSnack,isToast,isBreakfast,isLunch}),
    nutrition:{cal:cal, protein:protein, fat:fat, carbs:carbs, sugar:sugar}};
}

function slugName(n) {
  return 'recipe-' + n.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
}

function goToRecipe(name) {
  // Detect which category this recipe belongs to
  const meta = MONTH_META[currentMonth];
  const pool = MEAL_POOLS[meta.rotation];
  if (pool.lunches.includes(name))       currentRecipeCategory = 'lunches';
  else if (pool.dinners.includes(name))  currentRecipeCategory = 'dinners';
  else if (pool.snacks.includes(name))   currentRecipeCategory = 'snacks';
  else                                   currentRecipeCategory = 'breakfasts';

  currentTab = 'recipes';
  document.querySelectorAll('.tab-btn').forEach(function(b) {
    b.classList.toggle('active', b.dataset.tab === 'recipes');
  });
  document.getElementById('content').innerHTML = renderRecipes();
  bindDynamicEvents();
  setTimeout(function() {
    var el = document.getElementById(slugName(name));
    if (el) {
      el.scrollIntoView({ behavior: 'smooth', block: 'start' });
      el.style.outline = '3px solid #e07a5f';
      el.style.outlineOffset = '3px';
      setTimeout(function() { el.style.outline = ''; el.style.outlineOffset = ''; }, 2000);
    }
  }, 150);
}

  var m = mk.split(' ')[0];
  if(['Jun','Jul','Aug'].indexOf(m)>-1) return 'Summer';
  if(['Sep','Oct','Nov'].indexOf(m)>-1) return 'Fall';
  if(['Dec','Jan','Feb'].indexOf(m)>-1) return 'Winter';

function getSeasonEmoji(mk) {

    </tr></thead><tbody>`;
    w.forEach(d => {
      // ── Compute real calories from genRecipe ──
      const _rb = RECIPE_DB[d.breakfast] || genRecipe(d.breakfast);
      const _rl = RECIPE_DB[d.lunch]     || genRecipe(d.lunch);
      const _rd = RECIPE_DB[d.dinner]    || genRecipe(d.dinner);
      const _rs = RECIPE_DB[d.snack]     || genRecipe(d.snack);
      const totalCal = (_rb.nutrition.cal||0) + (_rl.nutrition.cal||0) + (_rd.nutrition.cal||0) + (_rs.nutrition.cal||0);

      // ── Compute accurate prep time ──
      function _mealPrep(name) {
        const n = name.toLowerCase();
        if (/overnight|chia pudding/i.test(n)) return 'overnight';
        if (/smoothie|oat|pancake|toast|egg muffin|chia/i.test(n)) return '5 min';
        if (/hummus|apple|banana|orange|pear|mango|rice cake|trail mix|edamame|pumpkin seed|walnut|sunflower|chickpea|roasted chick|grapes|cucumber|celery|berry|peach|watermelon|strawberry/i.test(n)) return '5 min';
        if (/slow cooker/i.test(n)) return '15 min';
        if (/baked|roast|meatloaf|shepherd|tenderloin/i.test(n)) return '15 min';
        if (/stir.fry|skillet|fajita/i.test(n)) return '10 min';
        if (/soup|stew|chili|chowder|curry/i.test(n)) return '10 min';
        if (/salad|bowl|wrap|lettuce|taco/i.test(n)) return '10 min';
        if (/tofu/i.test(n)) return '15 min';
        return '10 min';
      }
      const _preps = [_mealPrep(d.breakfast), _mealPrep(d.lunch), _mealPrep(d.dinner)].filter(p=>p!=='overnight');
      const _maxPrep = _preps.includes('15 min') ? '15 min' : _preps.includes('10 min') ? '10 min' : '5 min';
      const prepDisplay = /overnight|chia/i.test(d.breakfast) ? '5 min + overnight' : _maxPrep;

      // ── Cal color: green ≤1800, amber ≤2200, red >2200 ──
      const _calColor = totalCal <= 1800 ? '#638068' : totalCal <= 2200 ? '#d4a82d' : '#e07a5f';
      html += `<tr><td class="font-semibold">${d.dayName}</td><td>${d.day}</td>
        <td onclick="goToRecipe('${d.breakfast}')" style="cursor:pointer" title="View recipe">${d.breakfast}</td>

        <td onclick="goToRecipe('${d.dinner}')"    style="cursor:pointer" title="View recipe">${d.dinner}</td>
        <td onclick="goToRecipe('${d.snack}')" style="cursor:pointer" title="View recipe">${d.snack}</td>
        <td class="text-center font-semibold" style="color:${_calColor}">~${totalCal}</td>
        <td class="text-center">${prepDisplay}</td></tr>`;
    });
    html += '</tbody></table></div>';
  });
  html += '</div>';
  return html;
}

function renderRecipes() {
  const meta = MONTH_META[currentMonth];
  const pool = MEAL_POOLS[meta.rotation];
  const season = getSeason(currentMonth);
  const seasonEmoji = getSeasonEmoji(currentMonth);
  const categories = [
    {key:'breakfasts',label:'🍳 Breakfasts',items:pool.breakfasts},
    {key:'lunches',label:'🥗 Lunches',items:pool.lunches},
    {key:'dinners',label:'🍽️ Dinners',items:pool.dinners},
    {key:'snacks',label:'🍎 Snacks',items:pool.snacks}
  ];
  const activeCat = categories.find(function(c){ return c.key === currentRecipeCategory; }) || categories[0];

  // Seasonal tag helper
  function seasonTag(name) {
    const n = name.toLowerCase();
    const s = season.toLowerCase();
    const isSummerFood = /watermelon|mango|peach|cucumber|corn|zucchini|berry|strawberry|smoothie/.test(n);
    const isFallFood   = /pumpkin|squash|apple|sweet potato|harvest|maple|cider/.test(n);
    const isWinterFood = /soup|stew|chili|cocoa|warm|cozy|roast|cranberry/.test(n);
    const isSpringFood = /asparagus|pea|mint|lemon|fresh|spring/.test(n);
    if(isSummerFood && s==='summer') return `<span class="pill" style="background:#fff3cd;color:#856404;">☀️ In Season</span>`;
    if(isFallFood   && s==='fall')   return `<span class="pill" style="background:#fde8d8;color:#7c4a00;">🍂 In Season</span>`;
    if(isWinterFood && s==='winter') return `<span class="pill" style="background:#dbeafe;color:#1e40af;">❄️ Seasonal</span>`;
    if(isSpringFood && s==='spring') return `<span class="pill" style="background:#d1fae5;color:#065f46;">🌱 In Season</span>`;
    return '';
  }

  let html = `<div class="sticky-sub no-print flex flex-wrap gap-2 mb-4">
    ${categories.map(function(c){ return `<button class="recipe-nav-btn${c.key===activeCat.key?' active':''}" onclick="setRecipeCategory('${c.key}')">${c.label}</button>`; }).join('')}

  html += `<div id="section-${activeCat.key}">

    <div class="grid grid-cols-1 md:grid-cols-2 gap-3">`;

  activeCat.items.forEach(function(name) {
    const r = RECIPE_DB[name] || genRecipe(name);
    const sTags = seasonTag(name);
    html += `<div class="recipe-card" id="${slugName(name)}">
      <h4 class="font-display font-bold text-sm text-teal-700 mb-1">${name}</h4>
      <div class="flex flex-wrap gap-1 mb-2">
        <span class="pill pill-teal">⏱ Prep: ${r.prep}</span>
        <span class="pill pill-sage">🔥 Cook: ${r.cook}</span>
        <span class="pill pill-gold">👨‍👩‍👧‍👧 Serves ${r.serves}</span>
        <span class="pill ${r.freezer?'pill-teal':'pill-coral'}">${r.freezer?'🧊 Freezer ✅':'❌ No Freeze'}</span>
        ${sTags}
      </div>
      <div class="text-xs mb-2"><strong>Ingredients:</strong> ${r.ingredients.join(' · ')}</div>
      <ol class="text-xs pl-4 mb-2" style="list-style:decimal;">

    }

    items.push(ksItem('Almond butter single-serve packs', 1, '10-ct box', 6.99, 'Snacks'));
    items.push(ksItem('Rice cakes (plain or lightly salted)', 1, '4.5 oz bag', 2.99, 'Snacks'));
    items.push(ksItem('Mixed nuts (unsalted)', 1, '10 oz bag', 6.49, 'Snacks'));
    items.push(ksItem('Medjool dates', 1, '8 oz bag', 4.99, 'Snacks'));
    items.push(ksItem('Dried mango (unsweetened)', 1, '3 oz bag', 3.29, 'Snacks'));

    // Lunch wraps/grains
    if(allMeals.includes('wrap')||allMeals.includes('burrito')) items.push(ksItem('Whole wheat tortillas (8")', 1, '10-ct bag', 3.49, 'Bakery'));
    if(allMeals.includes('salad')) items.push(ksItem('Mixed salad greens', 1, '5 oz box', 3.29, 'Produce'));

    // Dairy-free / condiments

    items.push(ksItem('Hot sauce (e.g. Cholula)', 1, '5 oz bottle', 2.99, 'Condiments'));
    items.push(ksItem('Tahini', 1, '11 oz jar', 5.49, 'Condiments'));
    items.push(ksItem('Dijon mustard', 1, '12 oz jar', 2.99, 'Condiments'));

    return items;
  }

  // Estimate week cost
  function estimateCost(items) {
    return items.reduce(function(sum, i){ return sum + (i.price||0); }, 0);
  }

  // Group items by category
  function groupByCat(items) {
    const cats = {};
    items.forEach(function(i) {
      if(!cats[i.cat]) cats[i.cat]=[];
      cats[i.cat].push(i);
    });
    return cats;
  }

  // Category emoji map

    'Produce':'🥦', 'Protein':'🫘', 'Dairy/Eggs':'🥚', 'Dairy/Alt':'🥛',
    'Frozen':'❄️', 'Snacks':'🍎', 'Bakery':'🍞', 'Grains':'🌾',
    'Beans':'🫘', 'Condiments':'🧴', 'Pantry':'🥫', 'Oils & Vinegar':'🫙',
    'Spices':'🌿', 'Sweeteners':'🍯', 'Nut Butters':'🥜'

  const grocTab = localStorage.getItem('grocTab_'+currentMonth)||'weekly';

    <div class="card-sm bg-teal-50 border border-teal-200 mb-4 text-xs">

    </div>

      <button class="cal-view-btn ${grocTab==='pantry'?'active':''}" data-groctab="pantry">🥫 Monthly Pantry</button>
    </div>`;

  if(grocTab === 'pantry') {
    const pantCats = groupByCat(PANTRY_MONTHLY);
    const totalPantry = estimateCost(PANTRY_MONTHLY).toFixed(2);
    html += `<div class="card-sm bg-sage-50 border border-sage-200 mb-4">
      <p class="text-xs text-charcoal-500">These items last the <strong>whole month</strong> — buy once, stock your pantry. Not included in weekly $150 budget.</p>

    Object.keys(pantCats).forEach(function(cat) {
