<style>
:root {
  --teal: #0d6b7c; --cream: #fdf8f0; --sage: #7b9e87; --coral: #e07a5f;

}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { font-family: 'Inter', sans-serif; background: var(--cream); color: var(--charcoal); margin:0; }
.font-display { font-family: 'Nunito', sans-serif; }

/* Sidebar */

#sidebar .month-btn.active { background:rgba(255,255,255,.15); color:#fff; font-weight:700; border-left-color:#e07a5f; }
#sidebar .phase-badge { font-size:9px; display:block; opacity:.7; margin-top:1px; }

/* Main */
#main { margin-left:220px; min-height:100vh; }
#tab-bar { display:flex; flex-wrap:wrap; gap:4px; padding:8px 16px; background:#fff; border-bottom:1px solid #e6f5f7; position:sticky; top:0; z-index:30; }
.tab-btn { padding:6px 12px; font-size:12px; font-weight:600; border:none; border-radius:8px; cursor:pointer; background:#f0f5f1; color:#2d3748; transition: all .15s; white-space:nowrap; }
.tab-btn.active { background:#0d6b7c; color:#fff; }
.recipe-link { color:#0d6b7c; text-decoration:underline; cursor:pointer; font-size:inherit; }
.recipe-link:hover { color:#e07a5f; }
.tab-btn:hover:not(.active) { background:#d4e3d8; }

#content { padding:20px; max-width:1200px; margin:0 auto; }

/* Cards */
.card { background:#fff; border-radius:14px; padding:20px; box-shadow:0 2px 12px rgba(13,107,124,.06); margin-bottom:16px; }
.card-sm { background:#fff; border-radius:10px; padding:14px; box-shadow:0 1px 6px rgba(13,107,124,.05); }

/* Pills */
.pill { display:inline-block; padding:2px 8px; border-radius:20px; font-size:10px; font-weight:600; }
.pill-yellow { background:#fef9e7; color:#b88c1a; }
.pill-green { background:#f0f5f1; color:#4b6050; }
.pill-teal { background:#e6f5f7; color:#0d6b7c; }
.pill-orange { background:#fdf0ec; color:#d4634a; }
.pill-coral { background:#f9d6cc; color:#b84e38; }
.pill-sage { background:#d4e3d8; color:#3a4a3e; }
.pill-gold { background:#fef9e7; color:#b88c1a; }
.pill-purple { background:#f5f0fa; color:#6b3f92; }

/* Calendar */
.cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:3px; }
.cal-header { font-size:11px; font-weight:700; text-align:center; padding:6px 2px; color:#0d6b7c; }
.cal-cell { border:1px solid #e6f5f7; border-radius:8px; padding:4px; min-height:90px; font-size:9px; background:#fff; }
.cal-cell .day-num { font-weight:700; font-size:12px; color:#0d6b7c; }
.cal-empty { background:transparent; border:none; }

/* Tables */
.meal-table { width:100%; border-collapse:separate; border-spacing:0; font-size:11px; }
.meal-table th { background:#0d6b7c; color:#fff; padding:8px 6px; text-align:left; font-size:11px; font-weight:600; }
.meal-table th:first-child { border-radius:8px 0 0 0; }
.meal-table th:last-child { border-radius:0 8px 0 0; }
.meal-table td { padding:7px 6px; border-bottom:1px solid #e6f5f7; }
.meal-table tr:nth-child(even) { background:#fdf8f0; }
.meal-table tr:hover { background:#e6f5f7; }

/* Recipe cards */
.recipe-card { background:#fff; border-radius:12px; padding:16px; box-shadow:0 1px 8px rgba(13,107,124,.06); margin-bottom:12px; page-break-inside:avoid; }
.recipe-card h4 { color:#0d6b7c; font-family:'Nunito',sans-serif; font-weight:700; font-size:15px; margin:0 0 8px; }
.kid-box { background:#fdf0ec; border-radius:8px; padding:10px; margin-top:8px; border-left:3px solid #e07a5f; }

/* Star chart */
.star-cell { width:28px; height:28px; display:flex; align-items:center; justify-content:center; cursor:pointer; border-radius:6px; font-size:16px; transition:all .15s; border:1px solid #e6f5f7; }
.star-cell:hover { background:#fef9e7; }
.star-cell.filled { background:#fef9e7; }

/* Checkbox */
.cb-item { display:flex; align-items:flex-start; gap:8px; padding:4px 0; font-size:13px; }
.cb-item input[type=checkbox] { margin-top:3px; accent-color:#0d6b7c; width:16px; height:16px; }

/* Sticky subnav */
.sticky-sub { position:sticky; top:48px; background:#fdf8f0; z-index:20; padding:8px 0; border-bottom:1px solid #e6f5f7; }
.sticky-sub button { padding:5px 14px; border-radius:20px; font-size:12px; font-weight:600; border:1px solid #b3e0e6; background:#fff; color:#0d6b7c; cursor:pointer; transition:all .15s; }
.sticky-sub button:hover, .sticky-sub button.active { background:#0d6b7c; color:#fff; }

/* Print */
@media print {
  #sidebar, #tab-bar, #mobile-menu-btn, #mobile-sidebar, .no-print, .sticky-sub { display:none !important; }
  #main { margin-left:0 !important; }
  body { background:#fff !important; }
  .card, .recipe-card { box-shadow:none !important; border:1px solid #ddd; }
  .recipe-card { page-break-inside:avoid !important; }
  .recipe-section-header { page-break-before:always !important; }
  .grocery-week { page-break-before:always !important; }
  .tracker-section { page-break-before:always !important; }
  @page { size:letter; margin:0.5in; }
  * { font-size:11pt; }
  .cal-grid { font-size:8pt; }
}

/* Mobile */
@media (max-width:768px) {
  #sidebar { transform:translateX(-100%); }
  #sidebar.open { transform:translateX(0); }
  #main { margin-left:0; }
  .cal-cell { min-height:60px; font-size:7px; }
  .cal-cell .day-num { font-size:10px; }
  #tab-bar { gap:3px; padding:6px 8px; }
  .tab-btn { padding:5px 8px; font-size:10px; }

.cal-t{background:#e6f5f7;color:#0b5c6b;}.cal-o{background:#fdf0ec;color:#b84e38;}

.week-day-label{font-family:'Nunito',sans-serif;font-weight:800;font-size:13px;color:#0d6b7c;margin-bottom:8px;border-bottom:1.5px solid #e6f5f7;padding-bottom:4px;}

.week-meal-row{display:flex;flex-direction:column;border-radius:6px;padding:5px 6px;margin-bottom:4px;}
.week-meal-label{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;opacity:.65;margin-bottom:1px;}
.week-meal-name{font-size:11px;font-weight:600;line-height:1.3;}
.week-breakfast{background:#fef9e7;color:#b88c1a;}.week-lunch{background:#f0f5f1;color:#4b6050;}
.week-dinner{background:#e6f5f7;color:#0b5c6b;}.week-snack{background:#fdf0ec;color:#b84e38;}
@media print{
  #cal-view-bar{display:none!important;}
  .cal-grid-month{min-width:unset!important;gap:1px;}
  .cal-cell-sm{min-height:52px!important;}
  .cal-pill-xs{font-size:7px!important;}
  .recipe-card{page-break-inside:avoid;}
  .recipe-section-header{page-break-before:always;}
  @page{size:landscape;margin:8mm;}

.recipe-nav-btn.active { background:#0d6b7c !important; color:#fff !important; font-weight:700; border-color:#0d6b7c !important; }

function getSeasonFromKey(monthKey) {
  var m = monthKey.split(' ')[0];
  if (m==='Jun'||m==='Jul'||m==='Aug') return 'summer';
  if (m==='Sep'||m==='Oct'||m==='Nov') return 'fall';
  if (m==='Dec'||m==='Jan'||m==='Feb') return 'winter';
  return 'spring';
}

function seasonalizeMeal(meal, season) {
  var swaps = SEASONAL_SWAPS[season];
  return (swaps && swaps[meal]) ? swaps[meal] : meal;
}

const DAY_NAMES = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

function buildDailyPlan(monthKey) {
  if (planCache[monthKey]) return planCache[monthKey];
  const {rotation,days,shift} = MONTH_META[monthKey];
  const p = MEAL_POOLS[rotation];
  const _mn = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const _pts = monthKey.split(" ");
  const startDow = new Date(parseInt(_pts[1]), _mn.indexOf(_pts[0]), 1).getDay();
  const season = getSeasonFromKey(monthKey);
  const plan = [];
  for (let d=0; d<days; d++) {
    plan.push({
      day: d+1,
      dayName: DAY_NAMES[(startDow+d)%7],
      breakfast: seasonalizeMeal(p.breakfasts[d], season),
      lunch:     seasonalizeMeal(p.lunches[(d+shift)%31], season),
      dinner:    seasonalizeMeal(p.dinners[(d+(shift*2)%31+31)%31], season),
      snack:     seasonalizeMeal(p.snacks[(d+(shift*3)%31+31)%31], season)
    });
  }
  planCache[monthKey] = plan;
  return plan;
}

// KID TASK HELPER — varied tasks per recipe type

function _getKidTasks(name, flags) {
  // Simple hash from recipe name for variety (picks 0-3)
  function nameHash(s, offset) {
    let v = offset || 0;
    for(let i=0;i<s.length;i++) v = (v * 31 + s.charCodeAt(i)) & 0xffff;
    return v;
  }
  function pick(arr, seed) { return arr[nameHash(name, seed) % arr.length]; }

  const {isSlow,isSoup,isBaked,isStirFry,isTofu,isBean,isOats,isSmoothie,isSalad,isSnack,isToast,isBreakfast,isLunch} = flags;

  // 14 recipe-type task banks — 4 variants each per kid, hash-selected so same recipe always gives same task but different recipes vary
  if(isSlow) {
    return {
      aleene: pick(['Load all ingredients into slow cooker in order','Measure and add spices to the slow cooker','Dice onions and garlic for the slow cooker','Check that slow cooker is set to correct temp'], 1),
      kaily:  pick(['Set slow cooker timer and press start','Measure and stir in the broth','Peel and slice vegetables for the pot','Read the recipe steps aloud while Aleene preps'], 2),
      lilly:  pick(['Place lid on slow cooker and press cook','Rinse beans and pour them in','Watch the timer and tell us when it beeps','Give ingredients a gentle stir before the lid goes on'], 3)
    };
  }
  if(isSmoothie) {
    return {
      aleene: pick(['Measure all fruit and greens into blender','Peel the banana and add to blender','Layer ingredients in blender in the right order','Wash the blender parts after use'], 1),
      kaily:  pick(['Pour almond milk into the blender','Measure the frozen fruit portions','Add ice cubes and press blend','Pour smoothie into glasses evenly'], 2),
      lilly:  pick(['Press the blender button (with help)','Drop in the spinach handful','Taste and give it a thumbs-up or down','Rinse the blender cup with water'], 3)
    };
  }
  if(isOats) {
    return {
      aleene: pick(['Measure oats into each jar or bowl','Layer oats, liquid, and toppings in order','Stir honey and vanilla into the oat mixture','Prepare the fruit toppings and slice if needed'], 1),
      kaily:  pick(['Pour almond milk into the oat mixture','Stir in the chia seeds and spices','Choose the toppings and lay them out','Put lids on jars and label them for the fridge'], 2),
      lilly:  pick(['Add a scoop of fruit on top','Sprinkle granola or nuts on the oats','Put jars carefully in the fridge','Taste a tiny bite to check for sweetness'], 3)
    };
  }
  if(isSalad) {
    return {
      aleene: pick(['Chop lettuce and vegetables for the salad','Slice the avocado and arrange on top','Measure and whisk the dressing ingredients','Rinse and dry all salad greens thoroughly'], 1),
      kaily:  pick(['Wash and spin-dry the greens','Pour the dressing and toss the salad','Arrange toppings in a pretty pattern','Measure out beans or chickpeas for the salad'], 2),
      lilly:  pick(['Tear lettuce leaves into the bowl','Add colorful vegetables one by one','Sprinkle seeds or nuts on top','Carry the salad bowl to the table'], 3)
    };
  }
  if(isSoup) {
    return {
      aleene: pick(['Chop all vegetables and rinse the beans','Dice onion and mince garlic for the base','Measure and add broth to the pot','Stir soup every few minutes and check seasoning'], 1),
      kaily:  pick(['Open cans and pour beans into colander','Measure out the spice blend','Add the vegetables to the pot in order','Set the timer and keep an eye on the heat'], 2),
      lilly:  pick(['Rinse the canned beans with water','Drop bay leaves into the pot','Stir the soup gently with the big spoon','Taste a small spoonful to check flavor'], 3)
    };
  }
  if(isBaked) {
    return {
      aleene: pick(['Season the vegetables and arrange on sheet pan','Mix the marinade or spice rub','Line baking sheet with parchment paper','Check doneness with a fork and report back'], 1),
      kaily:  pick(['Preheat oven and set the timer','Drizzle olive oil and toss to coat','Spread vegetables evenly on the pan','Read the oven temperature from the recipe'], 2),
      lilly:  pick(['Sprinkle spices over everything','Place pan carefully in the oven with help','Press timer buttons and watch through oven window','Carry empty bowl to the sink'], 3)
    };
  }
  if(isStirFry && isTofu) {
    return {
      aleene: pick(['Press tofu with a towel to remove moisture','Cube tofu into even 1-inch pieces','Slice all vegetables for the stir-fry','Coat tofu cubes in cornstarch mixture'], 1),
      kaily:  pick(['Mix the soy sauce and spice coating','Measure cornstarch and spices','Arrange sliced vegetables by type','Help flip tofu in the pan (with tongs)'], 2),
      lilly:  pick(['Watch tofu sizzle and tell us when it looks golden','Drop snap peas into the pan at the right time','Stir gently when asked by a grown-up','Pour sauce over everything at the end'], 3)
    };
  }
  if(isTofu) {
    return {
      aleene: pick(['Drain and press tofu using a towel and heavy pan','Crumble or cube tofu for the recipe','Season tofu with spices and soy sauce','Help flip tofu in pan using a spatula'], 1),
      kaily:  pick(['Measure soy sauce, garlic, and spice amounts','Arrange tofu on the baking pan','Mix the marinade ingredients together','Set the oven timer for tofu baking'], 2),
      lilly:  pick(['Sprinkle seasoning over the tofu','Watch for golden edges on the tofu','Stir veggies around the tofu when told','Put tofu on plates when it is ready'], 3)
    };
  }
  if(isBean && isStirFry) {
    return {
      aleene: pick(['Drain and rinse beans in the colander','Slice all vegetables for the stir-fry','Make the stir-fry sauce from scratch','Add beans at the right time in the recipe'], 1),
      kaily:  pick(['Dice bell peppers and measure spices','Pour sauce into the pan and stir','Measure beans from the can','Stir the pan every 30 seconds'], 2),
      lilly:  pick(['Pour drained beans into a bowl','Watch for sauce to start bubbling','Shake the pan handle (with help)','Scoop finished stir-fry into bowls'], 3)
    };
  }
  if(isBean) {
    return {
      aleene: pick(['Drain and rinse all beans in the colander','Dice onion, garlic, and peppers for the base','Measure out all the spices in little cups','Stir the bean mixture and check seasoning'], 1),
      kaily:  pick(['Open cans and drain beans over the sink','Measure and add cumin, chili powder, oregano','Pour broth or water into the pot','Keep stirring and tell us when it smells amazing'], 2),
      lilly:  pick(['Rinse beans under cool running water','Drop in a bay leaf and push it down','Stir the pot with the long spoon','Taste a little bite to see if it needs salt'], 3)
    };
  }
  if(isToast || (isBreakfast && !isOats && !isSmoothie)) {
    return {
      aleene: pick(['Slice fruit and arrange on a plate','Spread avocado or nut butter evenly on toast','Crack eggs into a small bowl first','Measure coffee or tea water carefully'], 1),
      kaily:  pick(['Put bread in the toaster and press down','Slice bananas or strawberries with a safe knife','Peel and mash the avocado','Set out plates and cups for everyone'], 2),
      lilly:  pick(['Pop the toast up when it is done','Sprinkle cinnamon or Everything Bagel seasoning','Put fruit on each plate','Carry napkins and utensils to the table'], 3)
    };
  }
  if(isSnack) {
    return {
      aleene: pick(['Portion snacks into individual containers','Wash and cut any fruit or veggies','Arrange the snack board with colors in mind','Read the label to check for any allergens'], 1),
      kaily:  pick(['Scoop hummus into small dipping cups','Arrange crackers in a fan shape','Count out portions into snack bags','Pour trail mix into individual cups'], 2),
      lilly:  pick(['Put snap peas or carrots in the dip cup','Carry snack plates to the table carefully','Pick one fruit to add to each plate','Stack crackers in a pretty tower'], 3)
    };
  }
  if(isStirFry) {
    return {
      aleene: pick(['Slice all vegetables into even strips','Mix the stir-fry sauce ingredients','Add vegetables to hot pan in the right order','Toss everything together at the end'], 1),
      kaily:  pick(['Measure sauce ingredients into a small bowl','Stir constantly while ingredients sear','Pour sauce over stir-fry at the right moment','Prepare the rice or noodle base'], 2),
      lilly:  pick(['Watch the oil shimmer and tell us when ready','Drop in the easy vegetables when told','Stir with the flat spoon (with help)','Scoop stir-fry into bowls for serving'], 3)
    };
  }
  // Default / dinner
  return {
    aleene: pick(['Prep and measure all ingredients for the recipe','Season the protein and marinate if needed','Chop vegetables and organize by cooking order','Read each step of the recipe aloud'], 1),
    kaily:  pick(['Measure out all the spices and line them up','Chop easier vegetables like zucchini or mushrooms','Stir the sauce and check consistency','Set the table and fill water glasses'], 2),
    lilly:  pick(['Rinse vegetables under the faucet','Count out ingredients into small bowls','Stir the pot gently with the long spoon','Put napkins and utensils at each place'], 3)
  };
}

function genRecipe(name) {
  if (RECIPE_DB[name]) return RECIPE_DB[name];
  const isBreakfast = MB.includes(name);
  const isLunch     = ML.includes(name);
  const isDinner    = MD.includes(name);
  const isSnack     = MS.includes(name);
  const cat = isBreakfast?'breakfast':isLunch?'lunch':isDinner?'dinner':'snack';
  const isSoup     = /soup|stew|chili|chowder/i.test(name);
  const isSlow     = /slow cooker/i.test(name);
  const isBaked    = /baked|roast|meatloaf|shepherd/i.test(name);
  const isStirFry  = /stir.fry|skillet|fajita/i.test(name);
  const isOats     = /oat|overnight|chia|pudding/i.test(name);
  const isSalad    = /salad|lettuce|wrap/i.test(name);
  const isSmoothie = /smoothie/i.test(name);
  const isToast    = /toast/i.test(name) && !isSmoothie;
  const isGreenSmoothie = /green/i.test(name) && isSmoothie;
  const isTofu     = /tofu/i.test(name);
  const isBean     = /black bean|white bean|chickpea|lentil|three bean|bean chili|bean burrito/i.test(name) && !isTofu;
  const isBowl     = /bowl/i.test(name) && !isSmoothie && !isOats && !isToast;
  const freezer    = isSoup||isBaked||isStirFry||/meatball|burger|muffin cup|pancake|chili|taco/i.test(name);

  let prep='15min', cook='25min';
  if(isOats)            { prep='5min';  cook='0min'; }
  if(isSmoothie)        { prep='5min';  cook='0min'; }
  if(isSlow)            { prep='15min'; cook='6–8hr'; }
  if(isBaked)           { prep='15min'; cook='35min'; }
  if(isSoup && !isSlow) { prep='10min'; cook='30min'; }
  if(isSnack)           { prep='5min';  cook='0min'; }
  if(isToast)           { prep='5min';  cook='10min'; }

  let cal=300, protein='20g', fat='8g', carbs='30g', sugar='4g';
  if(isBreakfast) { cal=320; protein='12g'; fat='8g';  carbs='42g'; sugar='8g'; }
  if(isSnack)     { cal=150; protein='4g';  fat='6g';  carbs='18g'; sugar='5g'; }
  if(isLunch)     { cal=380; protein='28g'; fat='10g'; carbs='38g'; sugar='4g'; }
  if(isDinner)    { cal=450; protein='35g'; fat='14g'; carbs='40g'; sugar='5g'; }
  // Refine by protein type for more realistic per-recipe values
  if(isBreakfast && isSmoothie)                  { cal=275; protein='7g';  fat='4g';  carbs='54g'; sugar='22g'; }
  if(isBreakfast && isOats && /overnight/i.test(name)) { cal=295; protein='10g'; fat='5g'; carbs='52g'; sugar='12g'; }
  if(isBreakfast && isOats && !/overnight/i.test(name)){ cal=310; protein='10g'; fat='6g'; carbs='50g'; sugar='10g'; }
  if(isBreakfast && isTofu)                      { cal=290; protein='18g'; fat='10g'; carbs='22g'; sugar='3g'; }
  if(isBreakfast && isToast)                     { cal=330; protein='14g'; fat='9g';  carbs='40g'; sugar='5g'; }
  if(isLunch && isTofu)                          { cal=345; protein='22g'; fat='12g'; carbs='34g'; sugar='4g'; }
  if(isLunch && isBean)                          { cal=355; protein='19g'; fat='7g';  carbs='52g'; sugar='5g'; }
  if(isLunch && isSalad && !isBean && !isTofu)   { cal=360; protein='26g'; fat='12g'; carbs='28g'; sugar='6g'; }
  if(isDinner && isTofu)                         { cal=365; protein='26g'; fat='13g'; carbs='36g'; sugar='4g'; }
  if(isDinner && isBean)                         { cal=385; protein='21g'; fat='8g';  carbs='58g'; sugar='6g'; }
  if(isDinner && isSlow)                         { cal=410; protein='34g'; fat='10g'; carbs='36g'; sugar='5g'; }
  if(isDinner && isSoup && !isSlow)              { cal=320; protein='28g'; fat='7g';  carbs='30g'; sugar='4g'; }
  if(isSnack && /hummus/i.test(name))            { cal=140; protein='5g';  fat='6g';  carbs='16g'; sugar='2g'; }
  if(isSnack && /almond butter|peanut butter|walnut|pb/i.test(name)) { cal=175; protein='5g'; fat='10g'; carbs='18g'; sugar='8g'; }
  if(isSnack && /edamame|chickpea|bean|hard.boil/i.test(name)) { cal=155; protein='9g'; fat='5g'; carbs='14g'; sugar='2g'; }
  if(isSnack && /trail mix|cranberry trail/i.test(name))       { cal=190; protein='5g'; fat='12g'; carbs='18g'; sugar='9g'; }
  if(isSnack && /mango|watermelon|peach|frozen/i.test(name))   { cal=105; protein='1g'; fat='0g';  carbs='26g'; sugar='22g'; }

  const ing = [];
  // Protein — tofu checked first so tofu dishes don\'t fall into generic bucket
  if      (isTofu && /scramble|breakfast/i.test(name)) { ing.push('14 oz extra-firm tofu, pressed and crumbled'); }
  else if (isTofu)                                      { ing.push('14 oz extra-firm tofu, pressed and cubed'); ing.push('2 tbsp cornstarch'); }
  else if (/chicken thigh/i.test(name))            ing.push('2 lbs boneless chicken thighs');
  else if (/chicken/i.test(name))                  ing.push('1.5 lbs chicken breast');
  else if (/turkey/i.test(name))                   ing.push('1 lb ground turkey');
  else if (/beef/i.test(name))                     ing.push('1 lb lean ground beef');
  else if (/pork/i.test(name))                     ing.push('1 lb pork tenderloin');
  else if (/egg|scramble|frittata/i.test(name) && !isBean && !isTofu) ing.push('6 large eggs');
  else if (/lentil/i.test(name))                   ing.push('1.5 cups green or red lentils');
  else if (/black bean/i.test(name))               ing.push('2 cans (15oz) black beans, drained & rinsed');
  else if (/white bean/i.test(name))               ing.push('2 cans (15oz) white beans, drained & rinsed');
  else if (/chickpea/i.test(name))                 ing.push('2 cans (15oz) chickpeas, drained & rinsed');
  else if (/three bean/i.test(name))               { ing.push('1 can black beans, drained & rinsed'); ing.push('1 can kidney beans, drained & rinsed'); ing.push('1 can chickpeas, drained & rinsed'); }
  else if (/quinoa/i.test(name))                   ing.push('1.5 cups quinoa, rinsed');

  // Grains
  if (/oat/i.test(name))    ing.push('2 cups rolled oats');
  if (/chia/i.test(name) && !ing.some(function(x){return /chia/.test(x);})) ing.push('3 tbsp chia seeds');
  if (/rice(?! cake)/i.test(name) && !ing.some(function(x){return /rice/.test(x);})) ing.push('2 cups brown rice, cooked');
  if (/pasta|noodle/i.test(name)) ing.push('8 oz whole wheat pasta');
  if (/toast|bread/i.test(name))  ing.push('5 slices whole wheat bread');

  // Vegetables - always type-specific, never skipped
  if (isSoup || isSlow) {
    ing.push('2 carrots, diced');
    ing.push('3 stalks celery, sliced');
    ing.push('1 yellow onion, diced');
    if      (/spring|vegetable|veggie/i.test(name)) { ing.push('1 cup frozen peas'); ing.push('1 cup zucchini, chopped'); }
    else if (/butternut|squash/i.test(name))        { ing.push('3 cups butternut squash, cubed'); }
    else if (/kale|white bean/i.test(name))         { ing.push('3 cups chopped kale'); }
    else if (/sweet potato/i.test(name))            { ing.push('2 sweet potatoes, cubed'); }
    else                                             { ing.push('2 cups baby spinach'); }
    ing.push('4 cups low-sodium chicken broth');
  } else if (isStirFry) {
    ing.push('1 red bell pepper, sliced');
    ing.push('2 cups broccoli florets');
    ing.push('1 cup snap peas');
    ing.push('3 cloves garlic, minced');
  } else if (isBaked && !isOats) {
    if      (/broccoli/i.test(name))    { ing.push('3 cups broccoli florets'); }
    else if (/brussels/i.test(name))    { ing.push('2 cups Brussels sprouts, halved'); }
    else if (/asparagus/i.test(name))   { ing.push('1 bunch asparagus, trimmed'); }
    else if (/root|carrot/i.test(name)) { ing.push('3 carrots, chopped'); ing.push('2 parsnips, chopped'); }
    else if (/sweet potato/i.test(name)){ ing.push('3 sweet potatoes, cubed'); }
    else                                 { ing.push('2 cups mixed roasting vegetables'); }
  } else if (isTofu && isStirFry) {
    ing.push('1 red bell pepper, sliced');
    ing.push('2 cups broccoli florets');
    ing.push('1 cup snap peas');
    ing.push('3 cloves garlic, minced');
    ing.push('1 tsp fresh ginger, grated');
  } else if (isTofu && isBaked) {
    ing.push('3 cups mixed roasting vegetables (zucchini, bell pepper, broccoli)');
    ing.push('3 cloves garlic, minced');
  } else if (isTofu && (isSoup||isSlow)) {
    ing.push('2 carrots, diced');
    ing.push('3 stalks celery, sliced');
    ing.push('1 yellow onion, diced');
    ing.push('3 cups chopped kale');
    ing.push('4 cups low-sodium vegetable broth');
  } else if (isTofu) {
    ing.push('1 cup diced bell pepper');
    ing.push('1 cup broccoli florets');
    ing.push('1 yellow onion, diced');
  } else if (isBean && (isSoup||isSlow)) {
    ing.push('2 carrots, diced');
    ing.push('3 stalks celery, sliced');
    ing.push('1 yellow onion, diced');
    if (/kale/i.test(name))         ing.push('3 cups chopped kale');
    else if (/spinach/i.test(name)) ing.push('3 cups baby spinach');
    else if (/sweet potato/i.test(name)) ing.push('2 sweet potatoes, cubed');
    else                             ing.push('2 cups baby spinach');
    ing.push('4 cups low-sodium vegetable broth');
  } else if (isBean && (isStirFry||isBowl||isSalad)) {
    if (/kale/i.test(name))         ing.push('3 cups chopped kale');
    else if (/spinach/i.test(name)) ing.push('2 cups baby spinach');
    else                             ing.push('2 cups mixed greens');
    ing.push('1 red bell pepper, sliced');
    ing.push('1 cup corn kernels');
    ing.push('3 cloves garlic, minced');
  } else if (isBean) {
    ing.push('1 yellow onion, diced');
    ing.push('1 red bell pepper, diced');
    ing.push('3 cloves garlic, minced');
  } else if (isSalad || isBowl) {
    if (/corn/i.test(name))     { ing.push('1 cup corn kernels'); }
    if (/cucumber/i.test(name)) { ing.push('1 cucumber, diced'); }
    ing.push('2 cups mixed greens');
    ing.push('1 cup cucumber, diced');
  } else if (!isOats && !isSmoothie && !isSnack && !isToast) {
    ing.push('1 cup diced bell pepper');
    ing.push('1 cup zucchini, sliced');
    ing.push('1 yellow onion, diced');
  }

  // Fruit
  if (/banana/i.test(name))                         ing.push('3 ripe bananas');
  if (/mango/i.test(name))                          ing.push('1 cup frozen mango chunks');
  if (/berry|blueberry|strawberry/i.test(name))     ing.push('1 cup mixed berries');
  if (/apple/i.test(name) && !isSnack)              ing.push('1 apple, diced');
  if (/peach/i.test(name))                          ing.push('1 cup frozen peaches');
  if (/avocado/i.test(name))                        ing.push('2 ripe avocados');
  if (/sweet potato/i.test(name) && !ing.some(function(x){return /sweet potato/.test(x);})) ing.push('2 sweet potatoes');

  // Pantry
  if (/almond butter|oat milk/i.test(name))      ing.push('3 tbsp almond butter');
  if (/hummus/i.test(name))                         ing.push('1 cup hummus');
  if (/pumpkin/i.test(name))                        ing.push('1 cup canned pumpkin puree');
  if (/peanut butter|pb/i.test(name))             ing.push('3 tbsp peanut butter');
  if (isTofu) {
    ing.push('3 tbsp low-sodium soy sauce');
    ing.push('1 tbsp sesame oil');
    if (!isSoup && !isSlow && !isStirFry) ing.push('2 tbsp olive oil');
  } else if (isBean) {
    ing.push('1 tsp cumin');
    ing.push('1 tsp chili powder');
    ing.push('salt & pepper to taste');
    if (!isSoup && !isSlow) ing.push('2 tbsp olive oil');
  } else if (!isSoup && !isSlow && !isSnack && !isOats && !isSmoothie && !isToast) {
    ing.push('2 tbsp olive oil');
    ing.push('1 tsp garlic powder, 1 tsp cumin, salt & pepper');
  }
  if (isOats)     { ing.push('1 tsp cinnamon'); ing.push('1 tbsp maple syrup'); }
  if (isSmoothie) {
    if (isGreenSmoothie) {
      ing.push('5 cups fresh spinach or baby kale');
      ing.push('5 frozen bananas, sliced');
      ing.push('2.5 cups frozen strawberries or mixed berries');
      ing.push('2.5 cups unsweetened oat milk');
      ing.push('5 tbsp maple syrup');
      ing.push('optional: 5 tbsp chia seeds or ground flax');
    } else {
      ing.push('2.5 cups unsweetened oat milk');
      ing.push('5 frozen bananas');
      ing.push('2.5 cups frozen fruit of choice');
      ing.push('5 tbsp maple syrup');
    }
  }
  if (isSoup || isSlow) { /* broth already added above */ }
  if (isToast) {
    // ingredients are added above via the egg/bread/protein lines;
    // add vinegar + seasoning
    ing.push('1 tbsp white vinegar (for poaching)');
    ing.push('salt & freshly ground black pepper');
    if (/avocado/i.test(name)) { ing.push('2 ripe avocados, mashed'); }
  }

  // Snack specifics
  if (isSnack) {
    if (/rice cake/i.test(name))    ing.push('6 rice cakes');
    if (/trail mix/i.test(name))    { ing.push('1 cup mixed nuts'); ing.push('1/2 cup dried fruit'); }
    if (/edamame/i.test(name))      ing.push('2 cups shelled edamame');
    if (/hard.boil/i.test(name))    { ing.push('6 large eggs'); ing.push('1 tsp everything bagel seasoning'); }
    if (/walnut/i.test(name))       { ing.push('1 cup walnuts'); ing.push('1/4 cup dried cranberries'); }
    if (/sunflower/i.test(name))    { ing.push('1/2 cup sunflower seeds'); ing.push('1/4 cup raisins'); }
    if (ing.length < 2)             { ing.push('fresh cut vegetables (carrots, celery, cucumber)'); ing.push('hummus or dipping sauce'); }
  }

  const ingredients = ing.slice(0, 9);

  // Expanded kid-friendly steps
  var steps;
  if (isSlow) {
    steps = [
      'Wash your hands and gather all ingredients on the counter.',
      'Dice the onion, carrots, and celery into small bite-sized pieces.',
      'If using raw protein, cut into 1-inch chunks and pat dry with a paper towel.',
      'Add the protein to the slow cooker first, then layer vegetables on top.',
      'Pour in the broth and sprinkle all the spices evenly over everything.',
      'Put the lid on securely. Set to LOW for 6-8 hours (or HIGH for 3-4 hours).',
      'When done, use two forks to shred the protein right in the pot.',
      'Taste, adjust salt if needed, and serve with rice or bread.'
    ];
  } else if (isSoup) {
    steps = [
      'Wash your hands and chop all vegetables into small, even pieces.',
      'Heat olive oil in a large pot over medium heat until it shimmers.',
      'Add the onion and cook, stirring often, for 3 minutes until softened.',
      'Add the garlic and remaining vegetables; stir and cook 3 more minutes.',
      'If using raw protein, add it now and stir until no longer pink.',
      'Pour in all the broth and bring to a boil over high heat.',
      'Reduce to low heat, cover, and simmer 20 minutes until vegetables are tender.',
      'Season with salt, pepper, and spices. Taste and adjust. Serve hot!'
    ];
  } else if (isBaked) {
    steps = [
      'Preheat the oven to 375F and line a baking sheet with foil or parchment.',
      'Wash and cut all vegetables into similar-sized pieces so they cook evenly.',
      'Pat the protein completely dry with paper towels - this helps it brown nicely.',
      'In a small bowl, mix olive oil, garlic powder, cumin, salt, and pepper.',
      'Coat the protein all over with the spice mixture using your hands or a brush.',
      'Arrange protein on one side of the pan and vegetables on the other.',
      'Drizzle vegetables with a little extra olive oil and toss to coat evenly.',
      'Bake 30-40 minutes until protein is cooked through and vegetables are tender.',
      'Let rest 5 minutes before serving - this keeps everything juicy!'
    ];
  } else if (isStirFry) {
    steps = [
      'Wash your hands and prep all vegetables - slice evenly so everything cooks at the same speed.',
      'In a small bowl, stir together soy sauce, garlic, and any other sauce ingredients. Set aside.',
      'Heat a large skillet or wok over HIGH heat until very hot.',
      'Add 1 tbsp oil and swirl to coat. Add protein in a single layer - do not crowd it.',
      'Cook protein without stirring 2 minutes, then stir and cook until done. Remove to a plate.',
      'Add remaining oil to the pan. Add vegetables starting with the firmest ones first.',
      'Stir-fry 3-4 minutes, tossing constantly, until vegetables are tender-crisp.',
      'Return protein to the pan, pour sauce over everything, and toss to combine.',
      'Serve immediately over brown rice or noodles!'
    ];
  } else if (isOats && /overnight/i.test(name)) {
    steps = [
      'Measure oats into a mason jar or container with a tight-fitting lid.',
      'Pour in the oat milk and stir well so all the oats are wet.',
      'Add chia seeds and stir again quickly to prevent clumping.',
      'Stir in cinnamon and your sweetener of choice.',
      'Add any mix-ins like nut butter or berries, or keep separate for the morning.',
      'Seal the jar tightly and refrigerate for at least 6 hours or overnight.',
      'In the morning, give it a big stir. Add a splash of milk if too thick.',
      'Top with fresh fruit, nuts, or a drizzle of honey and enjoy cold!'
    ];
  } else if (isOats) {
    steps = [
      'Measure oats and oat milk into a small saucepan.',
      'Place over medium heat and stir constantly as the mixture warms up.',
      'Once it starts to bubble gently, reduce the heat to low.',
      'Keep stirring every minute for 4-5 minutes until thick and creamy.',
      'Remove from heat and stir in cinnamon and sweetener.',
      'Spoon into bowls and let cool 1-2 minutes so no one burns their mouth.',
      'Add your favorite toppings - fruit, nuts, or a drizzle of nut butter.',
      'Enjoy while warm!'
    ];
  } else if (isSmoothie) {
    steps = [
      'Gather all ingredients and place them near the blender.',
      'Add the liquid (oat milk) to the blender first - this helps everything blend smoothly.',
      'Add the frozen or fresh fruit next.',
      'Spoon in nut butter, honey, or any other add-ins.',
      'Put the lid on tightly and press it down with your hand before blending.',
      'Blend on high for 45-60 seconds until completely smooth with no chunks.',
      'Taste - add more honey if sweeter, more milk if too thick.',
      'Pour into bowls or glasses, add toppings, and enjoy right away!'
    ];
  } else if (isSalad || isBowl) {
    steps = [
      'Wash all vegetables and fruit under cold running water.',
      'Chop or slice each ingredient into bite-sized pieces.',
      'Cook any grains (rice or quinoa) per package directions; let cool slightly.',
      'Cook protein if needed - let cool, then slice or cube it.',
      'In a small bowl or jar, whisk together all dressing ingredients until combined.',
      'Build the bowl: start with greens or grains as your base.',
      'Arrange colorful toppings in sections for a beautiful presentation.',
      'Drizzle dressing over the top just before serving and enjoy!'
    ];
  } else if (isSnack) {
    steps = [
      'Wash your hands and gather all the ingredients.',
      'Wash any fresh fruit or vegetables under cold running water.',
      'Slice or cut everything into easy, fun-sized pieces for snacking.',
      'Arrange on a plate or in a container in a colorful pattern.',
      'Add any dipping sauce or nut butter in a small bowl on the side.',
      'Enjoy right away or seal tightly to save for later!'
    ];
  } else if (isToast) {
    steps = [
      'Wash your hands and gather all ingredients on the counter.',
      'Fill a medium saucepan with 3 inches of water and bring to a gentle simmer — small bubbles, not a rolling boil.',
      'Add 1 tbsp white vinegar to the water — this helps the egg whites hold their shape.',
      'Crack each egg individually into a small cup or ramekin first — never directly into the water.',
      'While the water simmers, toast the whole wheat bread slices until golden brown.',
      'Using a spoon, stir the water gently in a circle to create a soft vortex, then slide one egg from the cup into the center.',
      'Poach 2.5–3 min for a runny yolk, or 4 min for a firmer set yolk. Repeat for remaining eggs.',
      'Lift each egg with a slotted spoon and drain briefly on a paper towel.',
      'Place toast on plates, top each slice with a poached egg, season with salt & pepper, and serve immediately!'
    ];
  } else if (isTofu && isStirFry) {
    steps = [
      'Press the tofu: wrap the block in a clean kitchen towel and place something heavy on top for 10 minutes to squeeze out moisture.',
      'While tofu presses, chop all vegetables into even bite-sized pieces so they cook at the same rate.',
      'Cut pressed tofu into 3/4-inch cubes. Sprinkle with cornstarch and toss gently to coat every side.',
      'Heat 1 tbsp sesame oil in a large skillet or wok over HIGH heat until very hot.',
      'Add tofu in a single layer — do NOT crowd it. Cook without moving for 3 minutes until a golden crust forms.',
      'Flip each cube and cook 2 more minutes. Remove tofu to a plate.',
      'Add remaining oil to pan. Add firmest vegetables first; stir-fry 3 minutes, tossing constantly.',
      'Return tofu to pan and pour soy sauce mixture over everything. Toss quickly to coat.',
      'Serve immediately over steamed brown rice!'
    ];
  } else if (isTofu && isBaked) {
    steps = [
      'Preheat oven to 400F. Line a baking sheet with parchment paper.',
      'Press the tofu block: wrap in a clean towel and press for 10 minutes, then cube into 1-inch pieces.',
      'Toss tofu cubes with 1 tbsp soy sauce, 1 tbsp sesame oil, and 1 tbsp cornstarch until evenly coated.',
      'Chop all vegetables into similar-sized pieces and toss with olive oil, salt, and pepper.',
      'Spread tofu on one half of the baking sheet and vegetables on the other.',
      'Bake 25 minutes, then flip the tofu and stir the vegetables.',
      'Return to oven and bake 10 more minutes until tofu is crispy and vegetables are caramelized.',
      'Drizzle with a little extra soy sauce and serve over brown rice or grain of choice.',
      'Top with sesame seeds if you have them — looks great and adds crunch!'
    ];
  } else if (isTofu) {
    steps = [
      'Press the tofu block: wrap in a clean kitchen towel, place a heavy skillet on top, and press 10 minutes.',
      'Crumble or cube the pressed tofu depending on the recipe.',
      'Heat sesame oil in a skillet over medium-high heat.',
      'Add tofu and cook undisturbed for 3-4 minutes until golden on the bottom.',
      'Add vegetables to the pan and stir-fry together for 3 minutes.',
      'Pour in soy sauce and any remaining seasonings; stir well to coat everything.',
      'Cook 2 more minutes, tasting and adjusting salt and pepper.',
      'Serve hot over brown rice, in bowls, or wrapped in whole wheat tortillas.'
    ];
  } else if (isBean && (isSoup||isSlow)) {
    steps = [
      'Drain and rinse the canned beans thoroughly in a colander under cold water.',
      'Dice the onion, carrots, and celery into small, even pieces.',
      'Heat olive oil in a large pot over medium heat. Add onion and cook 3 minutes until soft.',
      'Add garlic, carrots, and celery; stir and cook 3 more minutes.',
      'Add the drained beans, broth, and all spices (cumin, chili powder, salt, pepper).',
      'Bring to a boil over high heat, then reduce to low and cover.',
      'Simmer 20-25 minutes, stirring occasionally, until vegetables are fully tender.',
      'Taste and adjust seasoning. For a thicker soup, mash some beans against the pot wall.',
      'Serve hot with whole wheat bread or over brown rice!'
    ];
  } else if (isBean && isStirFry) {
    steps = [
      'Drain and rinse all canned beans; pat dry gently with a paper towel so they sear instead of steam.',
      'Dice all vegetables into similar-sized pieces.',
      'Heat olive oil in a large skillet over medium-high heat.',
      'Add onion and bell pepper; cook 3 minutes stirring often until edges start to brown.',
      'Add garlic and cook 30 seconds until fragrant.',
      'Add beans to the pan in a single layer. Cook WITHOUT stirring for 2 minutes so beans get a nice crust.',
      'Stir in cumin, chili powder, salt, and any additional seasoning.',
      'Cook 2 more minutes, tossing gently, until everything is heated through and lightly caramelized.',
      'Serve over brown rice or in tortilla bowls with avocado slices.'
    ];
  } else if (isBean) {
    steps = [
      'Drain and rinse the canned beans in a colander under cold running water.',
      'Dice onion and any other vegetables into small, uniform pieces.',
      'Heat olive oil in a large skillet over medium heat until shimmering.',
      'Add onion and cook, stirring, for 3-4 minutes until softened.',
      'Add garlic and cook 30 more seconds until fragrant.',
      'Add the drained beans and all spices; stir well to combine.',
      'Cook 5-7 minutes, stirring occasionally, until beans are heated through and flavors have melded.',
      'Taste and adjust salt and pepper. Add a splash of water if it looks dry.',
      'Serve in bowls, over rice, in wraps, or with avocado slices on the side.'
    ];
  } else {
    steps = [
      'Wash your hands and gather all ingredients on the counter.',
      'Dice the onion and chop all vegetables into similar-sized pieces.',
      'Pat protein completely dry, then season all over with garlic powder, cumin, salt, and pepper.',
      'Heat olive oil in a large skillet over medium-high heat until shimmering.',
      'Add protein and cook until browned and cooked through, turning once halfway.',
      'Remove protein to a plate; add vegetables to the same pan.',
      'Cook vegetables 4-5 minutes, stirring often, until tender and slightly caramelized.',
      'Return protein to the pan, stir everything together, and heat through 1 minute.',
      'Taste, adjust seasoning, plate up, and serve hot!'
    ];
  }

  return {category:cat, prep:prep, cook:cook, serves:5, freezer:freezer, 
    ingredients:ingredients, steps:steps,
    kids: _getKidTasks(name, {isSlow,isSoup,isBaked,isStirFry,isTofu,isBean,isOats,isSmoothie,isSalad,isSnack,isToast,isBreakfast,isLunch}),
    nutrition:{cal:cal, protein:protein, fat:fat, carbs:carbs, sugar:sugar}};
}

let currentMonth = 'Aug 2026';
let currentTab = 'calendar';
let currentRecipeCategory = 'breakfasts';

function slugName(n) {
  return 'recipe-' + n.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
}

function goToRecipe(name) {
  // Detect which category this recipe belongs to
  const meta = MONTH_META[currentMonth];
  const pool = MEAL_POOLS[meta.rotation];
  if (pool.lunches.includes(name))       currentRecipeCategory = 'lunches';
  else if (pool.dinners.includes(name))  currentRecipeCategory = 'dinners';
  else if (pool.snacks.includes(name))   currentRecipeCategory = 'snacks';
  else                                   currentRecipeCategory = 'breakfasts';

  currentTab = 'recipes';
  document.querySelectorAll('.tab-btn').forEach(function(b) {
    b.classList.toggle('active', b.dataset.tab === 'recipes');
  });
  document.getElementById('content').innerHTML = renderRecipes();
  bindDynamicEvents();
  setTimeout(function() {
    var el = document.getElementById(slugName(name));
    if (el) {
      el.scrollIntoView({ behavior: 'smooth', block: 'start' });
      el.style.outline = '3px solid #e07a5f';
      el.style.outlineOffset = '3px';
      setTimeout(function() { el.style.outline = ''; el.style.outlineOffset = ''; }, 2000);
    }
  }, 150);
}

function setRecipeCategory(cat) {
  currentRecipeCategory = cat;
  document.getElementById('content').innerHTML = renderRecipes();
  bindDynamicEvents();
}

let calendarView = 'month';

function getSeason(mk) {
  var m = mk.split(' ')[0];
  if(['Jun','Jul','Aug'].indexOf(m)>-1) return 'Summer';
  if(['Sep','Oct','Nov'].indexOf(m)>-1) return 'Fall';
  if(['Dec','Jan','Feb'].indexOf(m)>-1) return 'Winter';
  return 'Spring';
}
function getSeasonEmoji(mk) {
  var s=getSeason(mk);
  return s==='Summer'?'&#9728;&#65039;':s==='Fall'?'&#127810;':s==='Winter'?'&#10052;&#65039;':'&#127800;';
}

function renderCalendar() {
  var plan = buildDailyPlan(currentMonth);
  var meta = MONTH_META[currentMonth];
  var mn = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var pts = currentMonth.split(' ');
  var startDow = new Date(parseInt(pts[1]), mn.indexOf(pts[0]), 1).getDay();
  var emoji = getSeasonEmoji(currentMonth);
  var season = getSeason(currentMonth);
  // Chunk plan into Sun→Sat weeks
  var weeks = [];
  var week = [];
  plan.forEach(function(p) {
    var dow = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].indexOf(p.dayName);
    if(dow === 0 && week.length > 0) { weeks.push(week); week = []; }
    week.push(p);
  });
  if(week.length > 0) weeks.push(week);
  var html = '<div class="card">';
  html += '<h2 class="font-display text-xl font-bold text-teal-500 mb-1">' + emoji + ' ' + currentMonth + ' Calendar</h2>';
  html += '<p class="text-xs text-charcoal-300 mb-3">' + meta.phase + ' &middot; ' + meta.days + ' days &middot; ' + season + '</p>';
  // Toggle buttons
  html += '<div class="flex flex-wrap gap-2 mb-4" id="cal-view-bar">';
  html += '<button class="cal-view-btn' + (calendarView==='month'?' cal-view-active':'') + '" data-calview="month">Full Month</button>';
  weeks.forEach(function(w,wi) {
    var vk='week'+(wi+1);
    html += '<button class="cal-view-btn'+(calendarView===vk?' cal-view-active':'')
           +'" data-calview="'+vk+'">Week '+(wi+1)+' <small style="opacity:.6">('+ w[0].day +'-'+ w[w.length-1].day +')</small></button>';
  });
  html += '</div>';
  if(calendarView==='month') {
    // Compact month grid
    html += '<div style="overflow-x:auto"><div class="cal-grid-month">';
    DAY_NAMES.forEach(function(d){ html += '<div class="cal-header-sm">'+d+'</div>'; });
    for(var i=0;i<startDow;i++) html += '<div class="cal-empty"></div>';
    plan.forEach(function(p) {
      html += '<div class="cal-cell-sm">';
      html += '<div class="cal-day-num">'+p.day+'</div>';
      html += '<div class="cal-pill-xs cal-y" title="'+p.breakfast+'" style="cursor:pointer" onclick="goToRecipe(this.title)">'+(p.breakfast.length>24?p.breakfast.slice(0,23)+'…':p.breakfast)+'</div>';
      html += '<div class="cal-pill-xs cal-g" title="'+p.lunch+'" style="cursor:pointer" onclick="goToRecipe(this.title)">'+(p.lunch.length>24?p.lunch.slice(0,23)+'…':p.lunch)+'</div>';
      html += '<div class="cal-pill-xs cal-t" title="'+p.dinner+'" style="cursor:pointer" onclick="goToRecipe(this.title)">'+(p.dinner.length>24?p.dinner.slice(0,23)+'…':p.dinner)+'</div>';
      html += '<div class="cal-pill-xs cal-o" title="'+p.snack+'" style="cursor:pointer" onclick="goToRecipe(this.title)">'+(p.snack.length>24?p.snack.slice(0,23)+'…':p.snack)+'</div>';
      html += '</div>';
    });
    html += '</div></div>';
  } else {
    // Large week view — full names
    var wi = parseInt(calendarView.replace('week','')) - 1;
    var wPlan = weeks[wi] || [];
    html += '<div class="week-view-header">' + emoji + ' ' + season
           + ' &mdash; Week '+(wi+1)+' &nbsp;<span style="font-weight:400;font-size:13px">Days '
           + (wPlan[0]?wPlan[0].day:'') + '&ndash;' + (wPlan[wPlan.length-1]?wPlan[wPlan.length-1].day:'')
           + '</span></div>';
    html += '<div class="week-view-grid">';
    wPlan.forEach(function(p) {
      html += '<div class="week-cell">';
      html += '<div class="week-day-label">'+p.dayName+' <span class="week-day-num">'+p.day+'</span></div>';
      html += '<div class="week-meal-row week-breakfast"><span class="week-meal-label">Breakfast</span><span class="week-meal-name" title="'+p.breakfast+'" onclick="goToRecipe(this.title)" style="cursor:pointer;text-decoration:underline dotted">'+p.breakfast+'</span></div>';
      html += '<div class="week-meal-row week-lunch"><span class="week-meal-label">Lunch</span><span class="week-meal-name" title="'+p.lunch+'" onclick="goToRecipe(this.title)" style="cursor:pointer;text-decoration:underline dotted">'+p.lunch+'</span></div>';
      html += '<div class="week-meal-row week-dinner"><span class="week-meal-label">Dinner</span><span class="week-meal-name" title="'+p.dinner+'" onclick="goToRecipe(this.title)" style="cursor:pointer;text-decoration:underline dotted">'+p.dinner+'</span></div>';
      html += '<div class="week-meal-row week-snack"><span class="week-meal-label">Snack</span><span class="week-meal-name" title="'+p.snack+'" onclick="goToRecipe(this.title)" style="cursor:pointer;text-decoration:underline dotted">'+p.snack+'</span></div>';
      html += '</div>';
    });
    html += '</div>';
  }
  html += '</div>';
  return html;
}

function renderMeals() {
  const plan = buildDailyPlan(currentMonth);
  const meta = MONTH_META[currentMonth];
  const badges = ['pill-teal','pill-sage','pill-coral','pill-gold','pill-purple'];
  const badgeLabels = ['teal','sage','coral','gold','purple'];
  let html = `<div class="card">
    <h2 class="font-display text-xl font-bold text-teal-500 mb-1">🍽️ ${currentMonth} Meal Plan</h2>
    <p class="text-xs text-charcoal-300 mb-2">${meta.phase}</p>
    <div class="flex flex-wrap gap-2 mb-4">
      <span class="pill pill-coral">🚫🧀 Dairy-Free</span>
      <span class="pill pill-coral">🚫🍅 Tomato-Free</span>
      <span class="pill pill-coral">🚫🦐 Seafood-Free</span>
      <span class="pill pill-sage">✅ Low-Fat</span>
      <span class="pill pill-sage">✅ Low-Sugar</span>
      <span class="pill pill-teal">✅ Freezer-Friendly</span>
    </div>`;
  // Split into Sun→Sat weeks (mirrors calendar)
  const weeks = [];
  let _wk = [];
  plan.forEach(function(p) {
    var dow = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].indexOf(p.dayName);
    if(dow === 0 && _wk.length > 0) { weeks.push(_wk); _wk = []; }
    _wk.push(p);
  });
  if(_wk.length > 0) weeks.push(_wk);
  weeks.forEach((w,wi) => {
    const s = w[0].day, e = w[w.length-1].day;
    const dayRange = w[0].dayName + ' ' + s + '–' + w[w.length-1].dayName + ' ' + e;
    html += `<h3 class="font-display font-bold text-sm mt-4 mb-2"><span class="pill ${badges[wi]}">📅 Week ${wi+1} — ${dayRange}</span></h3>
    <div class="overflow-x-auto"><table class="meal-table"><thead><tr>
      <th>Day</th><th>Date</th><th>Breakfast</th><th>Lunch</th><th>Dinner</th><th>Snack</th><th>~Cal</th><th>Prep</th>
    </tr></thead><tbody>`;
    w.forEach(d => {
      // ── Compute real calories from genRecipe ──
      const _rb = RECIPE_DB[d.breakfast] || genRecipe(d.breakfast);
      const _rl = RECIPE_DB[d.lunch]     || genRecipe(d.lunch);
      const _rd = RECIPE_DB[d.dinner]    || genRecipe(d.dinner);
      const _rs = RECIPE_DB[d.snack]     || genRecipe(d.snack);
      const totalCal = (_rb.nutrition.cal||0) + (_rl.nutrition.cal||0) + (_rd.nutrition.cal||0) + (_rs.nutrition.cal||0);

      // ── Compute accurate prep time ──
      function _mealPrep(name) {
        const n = name.toLowerCase();
        if (/overnight|chia pudding/i.test(n)) return 'overnight';
        if (/smoothie|oat|pancake|toast|egg muffin|chia/i.test(n)) return '5 min';
        if (/hummus|apple|banana|orange|pear|mango|rice cake|trail mix|edamame|pumpkin seed|walnut|sunflower|chickpea|roasted chick|grapes|cucumber|celery|berry|peach|watermelon|strawberry/i.test(n)) return '5 min';
        if (/slow cooker/i.test(n)) return '15 min';
        if (/baked|roast|meatloaf|shepherd|tenderloin/i.test(n)) return '15 min';
        if (/stir.fry|skillet|fajita/i.test(n)) return '10 min';
        if (/soup|stew|chili|chowder|curry/i.test(n)) return '10 min';
        if (/salad|bowl|wrap|lettuce|taco/i.test(n)) return '10 min';
        if (/tofu/i.test(n)) return '15 min';
        return '10 min';
      }
      const _preps = [_mealPrep(d.breakfast), _mealPrep(d.lunch), _mealPrep(d.dinner)].filter(p=>p!=='overnight');
      const _maxPrep = _preps.includes('15 min') ? '15 min' : _preps.includes('10 min') ? '10 min' : '5 min';
      const prepDisplay = /overnight|chia/i.test(d.breakfast) ? '5 min + overnight' : _maxPrep;

      // ── Cal color: green ≤1800, amber ≤2200, red >2200 ──
      const _calColor = totalCal <= 1800 ? '#638068' : totalCal <= 2200 ? '#d4a82d' : '#e07a5f';
      html += `<tr><td class="font-semibold">${d.dayName}</td><td>${d.day}</td>
        <td onclick="goToRecipe('${d.breakfast}')" style="cursor:pointer" title="View recipe">${d.breakfast}</td>
        <td onclick="goToRecipe('${d.lunch}')"     style="cursor:pointer" title="View recipe">${d.lunch}</td>
        <td onclick="goToRecipe('${d.dinner}')"    style="cursor:pointer" title="View recipe">${d.dinner}</td>
        <td onclick="goToRecipe('${d.snack}')" style="cursor:pointer" title="View recipe">${d.snack}</td>
        <td class="text-center font-semibold" style="color:${_calColor}">~${totalCal}</td>
        <td class="text-center">${prepDisplay}</td></tr>`;
    });
    html += '</tbody></table></div>';
  });
  html += '</div>';
  return html;
}

function renderRecipes() {
  const meta = MONTH_META[currentMonth];
  const pool = MEAL_POOLS[meta.rotation];
  const season = getSeason(currentMonth);
  const seasonEmoji = getSeasonEmoji(currentMonth);
  const categories = [
    {key:'breakfasts',label:'🍳 Breakfasts',items:pool.breakfasts},
    {key:'lunches',label:'🥗 Lunches',items:pool.lunches},
    {key:'dinners',label:'🍽️ Dinners',items:pool.dinners},
    {key:'snacks',label:'🍎 Snacks',items:pool.snacks}
  ];
  const activeCat = categories.find(function(c){ return c.key === currentRecipeCategory; }) || categories[0];

  // Seasonal tag helper
  function seasonTag(name) {
    const n = name.toLowerCase();
    const s = season.toLowerCase();
    const isSummerFood = /watermelon|mango|peach|cucumber|corn|zucchini|berry|strawberry|smoothie/.test(n);
    const isFallFood   = /pumpkin|squash|apple|sweet potato|harvest|maple|cider/.test(n);
    const isWinterFood = /soup|stew|chili|cocoa|warm|cozy|roast|cranberry/.test(n);
    const isSpringFood = /asparagus|pea|mint|lemon|fresh|spring/.test(n);
    if(isSummerFood && s==='summer') return `<span class="pill" style="background:#fff3cd;color:#856404;">☀️ In Season</span>`;
    if(isFallFood   && s==='fall')   return `<span class="pill" style="background:#fde8d8;color:#7c4a00;">🍂 In Season</span>`;
    if(isWinterFood && s==='winter') return `<span class="pill" style="background:#dbeafe;color:#1e40af;">❄️ Seasonal</span>`;
    if(isSpringFood && s==='spring') return `<span class="pill" style="background:#d1fae5;color:#065f46;">🌱 In Season</span>`;
    return '';
  }

  let html = `<div class="sticky-sub no-print flex flex-wrap gap-2 mb-4">
    ${categories.map(function(c){ return `<button class="recipe-nav-btn${c.key===activeCat.key?' active':''}" onclick="setRecipeCategory('${c.key}')">${c.label}</button>`; }).join('')}
  </div>`;

  html += `<div id="section-${activeCat.key}">
    <h3 class="font-display text-lg font-bold text-teal-500 mt-6 mb-3 pb-2 border-b-2 border-teal-100">${activeCat.label} <span class="text-xs text-charcoal-300 font-normal">(${activeCat.items.length} recipes · ${seasonEmoji} ${season} · Rotation ${meta.rotation})</span></h3>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-3">`;

  activeCat.items.forEach(function(name) {
    const r = RECIPE_DB[name] || genRecipe(name);
    const sTags = seasonTag(name);
    html += `<div class="recipe-card" id="${slugName(name)}">
      <h4 class="font-display font-bold text-sm text-teal-700 mb-1">${name}</h4>
      <div class="flex flex-wrap gap-1 mb-2">
        <span class="pill pill-teal">⏱ Prep: ${r.prep}</span>
        <span class="pill pill-sage">🔥 Cook: ${r.cook}</span>
        <span class="pill pill-gold">👨‍👩‍👧‍👧 Serves ${r.serves}</span>
        <span class="pill ${r.freezer?'pill-teal':'pill-coral'}">${r.freezer?'🧊 Freezer ✅':'❌ No Freeze'}</span>
        ${sTags}
      </div>
      <div class="text-xs mb-2"><strong>Ingredients:</strong> ${r.ingredients.join(' · ')}</div>
      <ol class="text-xs pl-4 mb-2" style="list-style:decimal;">
        ${r.steps.map(function(s){ return `<li class="mb-0.5">${s}</li>`; }).join('')}
      </ol>
      <div class="kid-box">
        <div class="text-xs font-bold text-coral-500 mb-1">👧 Kid Helper Tasks</div>
        <div class="text-xs text-charcoal-600">
          <div class="mb-0.5"><strong class="text-teal-700">Aleene (11):</strong> ${r.kids.aleene}</div>
          <div class="mb-0.5"><strong class="text-sage-600">Kaily (9):</strong> ${r.kids.kaily}</div>
          <div><strong class="text-gold-500">Lilly (7):</strong> ${r.kids.lilly}</div>
        </div>

    </div>`;
  });

  html += '</div></div>';
  return html;
}


function renderGrocery() {
  const plan = buildDailyPlan(currentMonth);

  let wk = [];
  plan.forEach(function(d) {
    if(d.dayName === 'Sat' && wk.length > 0) { weeks.push(wk); wk = []; }
    wk.push(d);
  });
  if(wk.length) weeks.push(wk);

  // Category emoji map for grouping ingredient strings
  const CAT_EMOJI = {
    'Produce':'\uD83E\uDD66','Protein':'\uD83E\uDED8','Eggs':'\uD83E\uDD5A','Dairy Alt':'\uD83E\uDD5B',
    'Frozen':'❄️','Snacks':'\uD83C\uDF4E','Bakery':'\uD83C\uDF5E','Grains':'\uD83C\uDF3E',
    'Beans & Legumes':'\uD83E\uDED8','Condiments & Oils':'\uD83E\uDDF4','Pantry':'\uD83E\uDD6B',
    'Spices & Herbs':'\uD83C\uDF3F','Sweeteners':'\uD83C\uDF6F','Nut Butters & Nuts':'\uD83E\uDD5C',
    'Canned Goods':'\uD83E\uDD6B','Beverages':'\uD83E\uDD64','Other':'\uD83D\uDCE6'
  };

  // Categorize an ingredient string by keyword detection
  function categorize(ing) {
    const s = ing.toLowerCase();
    if(/\begg(s)?\b/.test(s)) return 'Eggs';
    if(/\boat milk|almond milk|coconut milk|oat cream\b/.test(s)) return 'Dairy Alt';
    if(/\bspinach|kale|lettuce|arugula|broccoli|cauliflower|zucchini|cucumber|carrot|onion|garlic|ginger|bell pepper|mushroom|celery|corn|edamame|peas|sweet potato|potato|tomato|avocado|banana|apple|berry|berries|mango|lemon|lime|orange|peach|pear|grape|fig|date|scallion|green onion|jalapen|cilantro|parsley|basil|herb\b/.test(s)) return 'Produce';
    if(/\bchicken|turkey|ground beef|beef|pork|tofu|tempeh|lentil|protein powder\b/.test(s)) return 'Protein';
    if(/\bblack bean|kidney bean|chickpea|pinto bean|navy bean|cannellini|white bean|garbanzo\b/.test(s)) return 'Beans & Legumes';
    if(/\brice|quinoa|oat|pasta|noodle|bread|tortilla|flour|panko|breadcrumb\b/.test(s)) return 'Grains';
    if(/\bfrozen\b/.test(s)) return 'Frozen';
    if(/\bcanola oil|olive oil|coconut oil|sesame oil|avocado oil|oil\b|vinegar|soy sauce|tamari|fish sauce|hot sauce|sriracha|salsa|mustard|ketchup|tahini\b/.test(s)) return 'Condiments & Oils';
    if(/\bcan(ned)?|broth|stock|tomato paste|tomato sauce|crushed tomato|diced tomato\b/.test(s)) return 'Canned Goods';
    if(/\bsalt|pepper|cumin|paprika|turmeric|oregano|thyme|rosemary|chili powder|cayenne|cinnamon|nutmeg|cardamom|coriander|curry|garam|seasoning|spice\b/.test(s)) return 'Spices & Herbs';
    if(/\bmaple syrup|honey|sugar|agave|stevia\b/.test(s)) return 'Sweeteners';
    if(/\bbaking soda|baking powder|cornstarch|vanilla|yeast|cocoa|chocolate\b/.test(s)) return 'Pantry';
    if(/\balmond butter|peanut butter|cashew butter|nut butter|almond|cashew|walnut|pecan|pistachio|mixed nut|sunflower seed|pumpkin seed|chia|flax|hemp seed\b/.test(s)) return 'Nut Butters & Nuts';
    if(/\bwater|coffee|tea|juice\b/.test(s)) return 'Beverages';
    if(/\bhummus|rice cake|cracker|granola|protein bar|trail mix\b/.test(s)) return 'Snacks';
    return 'Other';
  }

  // ─── Smart Ingredient Parser ─────────────────────────────────────────────
  // Parses qty, unit, canonical name; sums quantities for the same ingredient.

  function parseFraction(s) {
    s = String(s).trim();
    var mx = s.match(/^(\d+)\s+(\d+)\s*\/\s*(\d+)$/);
    if (mx) return parseInt(mx[1]) + parseInt(mx[2]) / parseInt(mx[3]);
    var fx = s.match(/^(\d+)\s*\/\s*(\d+)$/);
    if (fx) return parseInt(fx[1]) / parseInt(fx[2]);
    return parseFloat(s) || 0;
  }

  function fmtQty(n) {
    if (!n && n !== 0) return '';
    var i = Math.floor(n), f = n - i;
    var fs = '';
    if (Math.abs(f - 0.5)  < 0.02) fs = '\u00bd';
    else if (Math.abs(f - 0.25) < 0.02) fs = '\u00bc';
    else if (Math.abs(f - 0.75) < 0.02) fs = '\u00be';
    else if (Math.abs(f - 0.333) < 0.02) fs = '\u2153';
    else if (Math.abs(f - 0.667) < 0.02) fs = '\u2154';
    else if (f > 0.02) fs = String(Math.round(f * 10) / 10).replace('0.', '.');
    return (i > 0 ? String(i) : '') + fs || String(n);
  }

  function normalizeUnit(u) {
    if (!u) return '';
    u = u.toLowerCase().trim();
    var m = { cups:'cup', cup:'cup', tablespoons:'tbsp', tablespoon:'tbsp', tbsps:'tbsp', tbsp:'tbsp',
              teaspoons:'tsp', teaspoon:'tsp', tsps:'tsp', tsp:'tsp',
              ounces:'oz', pounds:'lb', lbs:'lb', grams:'g', kilograms:'kg',
              cloves:'clove', heads:'head', stalks:'stalk', bunches:'bunch',
              cans:'can', slices:'slice', pieces:'piece', bags:'bag',
              jars:'jar', cartons:'carton', boxes:'box', blocks:'block',
              packages:'pkg', pkgs:'pkg' };
    return m[u] || u;
  }

  function stripPrep(s) {
    return s
      .replace(/\([^)]*\)/g, ' ')
      // Remove cooking-method prep words
      .replace(/\b(drained|rinsed|rinsed and drained|chopped|diced|minced|sliced|peeled|shredded|grated|julienned|cubed|halved|quartered|trimmed|cored|seeded|crushed|pressed|roughly|finely|thinly|freshly|coarsely|lightly|gently|toasted|roasted|cooked|uncooked|thawed|softened|melted|beaten|whisked|separated|pitted|deveined|deboned|scrambled|steamed|boiled|baked|saut\u00e9ed|mashed|spiralized|zested|squeezed)\b/gi, ' ')
      // Remove descriptor words
      .replace(/\b(large|medium|small|extra|firm|soft|silken|fresh|frozen|dried|raw|organic|whole|boneless|skinless|ripe|baby|mini|lean|unsweetened|low-sodium|reduced-sodium|light|dark|plain|unsalted|cooked|uncooked|pure|canned|pure|ground|packed|heaping|level)\b/gi, ' ')
      // Remove "for X" phrases at end
      .replace(/\bfor\s+(serving|topping|garnish|dipping|coating|the\s+pan|pan)\b.*/gi, '')
      // Remove "cut into X" phrases
      .replace(/\bcut\s+into\b.*/gi, '')
      // Remove "into X" at start when left over
      .replace(/^into\b.*/gi, '')
      // Remove "about X" quantifiers
      .replace(/\babout\s+\d+/gi, '')
      // Remove " or X" alternative choices (e.g. "low-sodium soy sauce" → "soy sauce")
      // But only for short alternatives that look like ingredient choices
      .replace(/\s+or\s+[\w\s-]{1,25}$/, '')
      .replace(/,\s*(and\b|or\b)?/g, ' ')
      .replace(/\band\b/g, ' ')
      // Strip leading fractions/numbers that leaked through (e.g. "½ " at start)
      .replace(/^[\d\/\u00bc-\u00be\u2150-\u215e\s]+/, '')
      .replace(/\s+/g, ' ')
      .trim()
      .replace(/^[-,;\s]+|[-,;\s]+$/g, '')
      .trim();
  }

  function canonicalize(s) {
    var r = s.toLowerCase()
      .replace(/[^\w\s]/g, ' ')
      .replace(/\s+/g, ' ')
      .trim();
    // Depluralize: avocados→avocado, berries→berry, potatoes→potato, leaves→leaf
    r = r.replace(/ies\b/g, 'y');       // berries→berry, blueberries→blueberry
    r = r.replace(/ves\b/g, 'f');       // leaves→leaf, halves→half
    r = r.replace(/ses\b/g, 's');       // processes→process
    r = r.replace(/xes\b/g, 'x');      // boxes→box
    r = r.replace(/ches\b/g, 'ch');    // batches→batch
    r = r.replace(/shes\b/g, 'sh');    // dishes→dish
    r = r.replace(/oes\b/g, 'o');      // tomatoes→tomato, potatoes→potato
    r = r.replace(/(?<![aeiou])es\b/g, ''); // classes→class (only strip es when not oes/ies)
    r = r.replace(/(?<![aeiou])s\b/g, ''); // avocados→avocado, carrots→carrot
    r = r.replace(/\s+/g, ' ').trim();
    return r;
  }

  function parseIngredient(ing) {
    var s = ing.trim();

    // Egg whites → eggs
    var ewM = s.match(/^((?:\d+\s+)?\d+(?:\s*\/\s*\d+)?|\d+(?:\.\d+)?)\s+egg\s+whites?/i);
    if (ewM) {
      return { qty: parseFraction(ewM[1].replace(/\s/g,'')), unit: '', name: 'eggs', display: 'eggs', cat: categorize('eggs'), isTaste: false };
    }
    if (/\begg\s+whites?\b/i.test(s)) {
      return { qty: 2, unit: '', name: 'eggs', display: 'eggs', cat: categorize('eggs'), isTaste: false };
    }

    var isTaste = /\bto\s+taste\b/i.test(s) || /\bpinch\b|\bdash\b/i.test(s);

    // Match leading number (integer, fraction, or mixed fraction)
    var qtyRaw = '', rest = s;
    var nm = s.match(/^((?:\d+\s+)?\d+(?:\s*\/\s*\d+)?|\d+(?:\.\d+)?)\s*/);
    if (nm) { qtyRaw = nm[1].trim(); rest = s.slice(nm[0].length); }

    // Match unit
    var unitRaw = '';
    var um = rest.match(/^(cups?|tbsps?|tablespoons?|tsps?|teaspoons?|oz|ounces?|lbs?|pounds?|g(?:rams?)?|kg|ml|l(?:iter)?|cans?|cloves?|heads?|stalks?|bunches?|slices?|pieces?|bags?|jars?|blocks?|cartons?|pkgs?|packages?)\b\s*/i);
    if (um) { unitRaw = um[1]; rest = rest.slice(um[0].length); }

    // Parenthetical notes (e.g. "(15oz each)") right after unit
    rest = rest.replace(/^\([^)]*\)\s*/, '');
    // Strip any leading fraction or number that leaked into display name
    // (handles "½ avocado mashed" where ½ is part of the name string)
    rest = rest.replace(/^(\d+\s*\/\s*\d+|[\u00bc\u00bd\u00be\u2150-\u215e]|\d+\.\d+)\s*/, '');

    var qty  = qtyRaw ? parseFraction(qtyRaw) : (isTaste ? 0 : 1);
    var unit = normalizeUnit(unitRaw);
    var cleanName = stripPrep(rest || s);
    var canonical = canonicalize(cleanName);
    if (!canonical || canonical.length < 2) {
      cleanName = stripPrep(s); canonical = canonicalize(cleanName);
    }
    if (!canonical || canonical.length < 2) canonical = canonicalize(s);

    return { qty: qty, unit: unit, name: canonical, display: cleanName || s, cat: categorize(ing), isTaste: isTaste };
  }

  // Extract ingredients from a recipe entry in RECIPE_DB
