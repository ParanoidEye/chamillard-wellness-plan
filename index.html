      <span class="pill pill-gold kid-total" data-kid="${kid}">${total}⭐</span>
    </div><div class="flex flex-wrap gap-1">`;
    for(let d=1;d<=60;d++){
      const filled = kidStars[d];
      // All 60 stars use identical styling — no visual distinction between month days and future days
      html += '<div class="star-cell ' + (filled?'filled':'') + '" data-kid="' + kid + '" data-day="' + d + '">' + (filled?'⭐':d) + '</div>';
    }
    html += '</div></div>';

  html += '</div></div>';

// ═══════════════════════════════════
// MASTER RENDER
// ═══════════════════════════════════
function render() {
  const content = document.getElementById('content');
  switch(currentTab) {
    case 'calendar': content.innerHTML = renderCalendar(); break;
    case 'meals': content.innerHTML = renderMeals(); break;
    case 'recipes': content.innerHTML = renderRecipes(); break;
    case 'grocery': content.innerHTML = renderGrocery(); break;
    case 'batch': content.innerHTML = renderBatch(); break;
    case 'freezer': content.innerHTML = renderFreezer(); break;
    case 'exercise': content.innerHTML = renderExercise(); break;
    case 'tracker': content.innerHTML = renderTracker(); break;
    case 'budget': content.innerHTML = renderBudget(); break;
    case 'kids': content.innerHTML = renderKids(); break;
  }
  renderSidebar();
  bindDynamicEvents();
  if (typeof lucide !== "undefined" && typeof lucide.createIcons === "function") {
    lucide.createIcons();
  }
}

// ═══════════════════════════════════
// EVENT BINDING
// ═══════════════════════════════════
function bindDynamicEvents() {
  // Exercise checkboxes
  document.querySelectorAll('.exercise-cb').forEach(cb => {
    cb.addEventListener('change', function() {
      const key = `exercise_${currentMonth}`;
      const saved = JSON.parse(localStorage.getItem(key)||'{}');
      saved[this.dataset.key] = this.checked;
      localStorage.setItem(key, JSON.stringify(saved));
    });
  });

  // Tracker weights
  document.querySelectorAll('.tracker-weight').forEach(inp => {
    inp.addEventListener('input', function() {
      const key = `tracker_${currentMonth}`;
      const saved = JSON.parse(localStorage.getItem(key)||'{"weights":{},"measurements":{},"notes":""}');
      if(!saved.weights) saved.weights = {};
      saved.weights[`${this.dataset.member}_w${this.dataset.week}`] = this.value;
      localStorage.setItem(key, JSON.stringify(saved));
    });
  });

  // Tracker measurements
  document.querySelectorAll('.tracker-measure').forEach(inp => {
    inp.addEventListener('input', function() {
      const key = `tracker_${currentMonth}`;
      const saved = JSON.parse(localStorage.getItem(key)||'{"weights":{},"measurements":{},"notes":""}');
      if(!saved.measurements) saved.measurements = {};
      saved.measurements[`${this.dataset.person}_${this.dataset.type}`] = this.value;
      localStorage.setItem(key, JSON.stringify(saved));
    });
  });

  // Tracker notes
  const notesEl = document.querySelector('.tracker-notes');
  if(notesEl) {
    notesEl.addEventListener('input', function() {
      const key = `tracker_${currentMonth}`;
      const saved = JSON.parse(localStorage.getItem(key)||'{"weights":{},"measurements":{},"notes":""}');
      saved.notes = this.value;
      localStorage.setItem(key, JSON.stringify(saved));
    });
  }

  // Budget
  document.querySelectorAll('.budget-actual, .budget-note').forEach(inp => {
    inp.addEventListener('input', function() {
      const key = `budget_${currentMonth}`;
      const saved = JSON.parse(localStorage.getItem(key)||'{}');
      saved[this.dataset.cat] = this.value;
      localStorage.setItem(key, JSON.stringify(saved));
      // Update total
      let total = 0;
      document.querySelectorAll('.budget-actual').forEach(a => { total += parseFloat(a.value)||0; });
      const el = document.getElementById('budget-total');
      if(el) el.textContent = '$'+total;
    });
  });

  // Star chart
  document.querySelectorAll('.star-cell').forEach(cell => {
    cell.addEventListener('click', function() {
      const kid = this.dataset.kid, day = this.dataset.day;
      const key = `stars_${currentMonth}`;
      const saved = JSON.parse(localStorage.getItem(key)||'{}');
      if(!saved[kid]) saved[kid] = {};
      saved[kid][day] = !saved[kid][day];
      localStorage.setItem(key, JSON.stringify(saved));
      this.classList.toggle('filled');
      this.textContent = saved[kid][day] ? '⭐' : day;
      // Update total
      const total = Object.values(saved[kid]).filter(v=>v).length;
      const totalEl = document.querySelector(`.kid-total[data-kid="${kid}"]`);
      if(totalEl) totalEl.textContent = total+'⭐';
    });
  });

  // Recipe nav
  // Calendar view toggle
  document.querySelectorAll('.cal-view-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      calendarView = this.dataset.calview;
      document.getElementById('content').innerHTML = renderCalendar();
      bindDynamicEvents();
    });
  });

  // recipe-nav-btn clicks handled via inline onclick="setRecipeCategory()"

  // Exercise day checkboxes — weekly storage (exday_month_wN)
  document.querySelectorAll('.ex-day-check').forEach(function(cb) {
    cb.addEventListener('change', function() {
      var wk = this.dataset.wk;
      var dayKey = this.dataset.daykey;
      var exKey = 'exday_' + currentMonth + '_w' + wk;
      var saved = {};
      try { saved = JSON.parse(localStorage.getItem(exKey)||'{}'); } catch(e) { saved = {}; }
      if(this.checked) { saved[dayKey] = true; } else { delete saved[dayKey]; }
      localStorage.setItem(exKey, JSON.stringify(saved));
      // Update the "X/N done" counter
      var wkItems = document.querySelectorAll('.ex-day-check[data-wk="' + wk + '"]');
      var doneNow = 0;
      wkItems.forEach(function(c){ if(c.checked) doneNow++; });
      var badge = document.querySelector('.exdone-ex-' + wk);
      if(badge) badge.textContent = doneNow + '/' + wkItems.length + ' done';
    });
  });

  // Kid-act link clicks → switch to dictionary and highlight that card
  document.querySelectorAll('.kid-act-link').forEach(function(link) {
    link.addEventListener('click', function(e) {
      e.preventDefault();
      var slug = this.dataset.kidslug;
      if(typeof switchExTab === 'function') { switchExTab('dictionary', slug); }
      else { localStorage.setItem('exTab_' + currentMonth, 'dictionary'); localStorage.setItem('exHighlight_' + currentMonth, slug); render(); }
      setTimeout(function() {
        var card = document.getElementById('excard_' + slug);
        if (card) card.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }, 120);
    });
  });

  // Family Team Plan — sub-tab switching (plain string, NOT JSON)
  document.querySelectorAll('[data-teamtab]').forEach(function(btn) {
    btn.addEventListener('click', function() {
      localStorage.setItem('teamTab_' + currentMonth, this.dataset.teamtab);
      render();
    });
  });

  // Family Team Plan — win/goal/notes textareas
  document.querySelectorAll('.team-win').forEach(function(el) {
    el.addEventListener('input', function() {
      var key = 'teamweek_' + currentMonth + '_w' + this.dataset.week;
      var saved = JSON.parse(localStorage.getItem(key)||'{}');
      saved[this.dataset.member + '_win'] = this.value;
      localStorage.setItem(key, JSON.stringify(saved));
    });
  });
  document.querySelectorAll('.team-goal').forEach(function(el) {
    el.addEventListener('input', function() {
      var key = 'teamweek_' + currentMonth + '_w' + this.dataset.week;
      var saved = JSON.parse(localStorage.getItem(key)||'{}');
      saved[this.dataset.member + '_goal'] = this.value;
      localStorage.setItem(key, JSON.stringify(saved));
    });
  });
  document.querySelectorAll('.team-notes').forEach(function(el) {
    el.addEventListener('input', function() {
      var key = 'teamweek_' + currentMonth + '_w' + this.dataset.week;
      var saved = JSON.parse(localStorage.getItem(key)||'{}');
      saved['family_notes'] = this.value;
      localStorage.setItem(key, JSON.stringify(saved));
    });
  });

  // Batch Prep sub-tab switching
  document.querySelectorAll('[data-batchtab]').forEach(function(btn) {
    btn.addEventListener('click', function() {
      localStorage.setItem('batchTab_' + currentMonth, this.dataset.batchtab);
      render();
    });
  });

  // Grocery sub-tab switching
  document.querySelectorAll('[data-groctab]').forEach(function(btn) {
    btn.addEventListener('click', function() {
      localStorage.setItem('grocTab_' + currentMonth, this.dataset.groctab);
      render();
    });
  });

  // Tracker exercise day checkboxes
  document.querySelectorAll('.ex-tracker-check').forEach(function(cb) {
    cb.addEventListener('change', function() {
      var wk = this.dataset.wk;
      var dayKey = this.dataset.daykey;
      var exKey = 'excheck_' + currentMonth + '_w' + wk;
      var saved = {};
      try { saved = JSON.parse(localStorage.getItem(exKey)||'{}'); } catch(e) { saved = {}; }
      if(this.checked) { saved[dayKey] = true; } else { delete saved[dayKey]; }
      localStorage.setItem(exKey, JSON.stringify(saved));
      // Update the "X/N done" counter without full re-render
      var card = this.closest('.card-sm');
      if(card) {
        var total = card.querySelectorAll('.ex-tracker-check').length;
        var done = card.querySelectorAll('.ex-tracker-check:checked').length;
        var spans = card.querySelectorAll('span');
        for(var s=0; s<spans.length; s++) {
          if(spans[s].textContent.indexOf('/ done') !== -1 || spans[s].textContent.match(/\d+\/\d+ done/)) {
            spans[s].textContent = done + '/' + total + ' done'; break;
          }
        }
      }
    });
  });

  // Exercise tab switching (plan vs dictionary)
  document.querySelectorAll('[data-extab]').forEach(function(btn) {
    btn.addEventListener('click', function() {
      localStorage.setItem('exTab_' + currentMonth, this.dataset.extab);
      render();
    });
  });
}

// ═══════════════════════════════════
// INIT — defensive wrapper for Safari/iOS
// ═══════════════════════════════════
window.onerror = function(msg, src, line, col, err) {
  var c = document.getElementById('content');
  if (c) {
    c.innerHTML = '<div style="padding:24px;background:#c53030;color:#fff;font-family:monospace;border-radius:8px;margin:20px;">'
      + '<b>App Error (line ' + line + '):</b><br>' + msg
      + (err ? '<br><br>' + err.stack : '') + '</div>';
  }
};

function _initApp() {
  // Lucide icons (loaded with defer — may or may not be ready)
  if (typeof lucide !== 'undefined' && typeof lucide.createIcons === 'function') {
    try { lucide.createIcons(); } catch(e) {}
  }

  // Month nav
  var monthNav = document.getElementById('month-nav');
  if (monthNav) {
    monthNav.addEventListener('click', function(e) {
      var btn = e.target.closest('.month-btn');
      if (!btn) return;
      currentMonth = btn.dataset.month;
      calendarView = 'month';
      render();
      var sb = document.getElementById('sidebar');
      if (sb) sb.classList.remove('open');
    });
  }

  // Tab nav
  var tabBar = document.getElementById('tab-bar');
  if (tabBar) {
    tabBar.addEventListener('click', function(e) {
      var btn = e.target.closest('.tab-btn');
      if (!btn || btn.id === 'print-btn') return;
      currentTab = btn.dataset.tab;
      document.querySelectorAll('.tab-btn').forEach(function(b) { b.classList.remove('active'); });
      btn.classList.add('active');
      render();
    });
  }

  // Print button
  var printBtn = document.getElementById('print-btn');
  if (printBtn) {
    printBtn.addEventListener('click', function() { window.print(); });
  }

  // Mobile menu toggle
  var mobileBtn = document.getElementById('mobile-menu-btn');
  if (mobileBtn) {
    mobileBtn.addEventListener('click', function() {
      var sb = document.getElementById('sidebar');
      if (sb) sb.classList.toggle('open');
    });
  }

  // Initial render — wrapped so errors display visibly instead of silently crashing
  try {
    render();
  } catch(e) {
    var c = document.getElementById('content');
    if (c) {
      c.innerHTML = '<div style="padding:24px;background:#c53030;color:#fff;font-family:monospace;border-radius:8px;margin:20px;">'
        + '<b>Render Error:</b><br>' + e.message
        + '<br><br>' + (e.stack || '') + '</div>';
    }
  }
}

// Ensure DOM is ready regardless of script position or browser quirks
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', _initApp);
} else {
  _initApp();
}
</script>
