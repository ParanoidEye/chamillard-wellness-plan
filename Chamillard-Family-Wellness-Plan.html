:root {
  --teal: #0d6b7c; --cream: #fdf8f0; --sage: #7b9e87; --coral: #e07a5f;

}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { font-family: 'Inter', sans-serif; background: var(--cream); color: var(--charcoal); margin:0; }
.font-display { font-family: 'Nunito', sans-serif; }

/* Sidebar */
#sidebar { width:220px; min-height:100vh; background: linear-gradient(180deg, #0d6b7c 0%, #094d5a 100%); position:fixed; left:0; top:0; z-index:40; overflow-y:auto; transition: transform .3s; }
#sidebar .month-btn { display:block; width:100%; text-align:left; padding:7px 14px; font-size:12px; color:#b3e0e6; border:none; background:none; cursor:pointer; transition: all .15s; border-left:3px solid transparent; }
#sidebar .month-btn:hover { background:rgba(255,255,255,.1); color:#fff; }
#sidebar .month-btn.active { background:rgba(255,255,255,.15); color:#fff; font-weight:700; border-left-color:#e07a5f; }
#sidebar .phase-badge { font-size:9px; display:block; opacity:.7; margin-top:1px; }

/* Main */
#main { margin-left:220px; min-height:100vh; }
#tab-bar { display:flex; flex-wrap:wrap; gap:4px; padding:8px 16px; background:#fff; border-bottom:1px solid #e6f5f7; position:sticky; top:0; z-index:30; }
.tab-btn { padding:6px 12px; font-size:12px; font-weight:600; border:none; border-radius:8px; cursor:pointer; background:#f0f5f1; color:#2d3748; transition: all .15s; white-space:nowrap; }
.tab-btn.active { background:#0d6b7c; color:#fff; }
.tab-btn:hover:not(.active) { background:#d4e3d8; }

#content { padding:20px; max-width:1200px; margin:0 auto; }

/* Cards */
.card { background:#fff; border-radius:14px; padding:20px; box-shadow:0 2px 12px rgba(13,107,124,.06); margin-bottom:16px; }
.card-sm { background:#fff; border-radius:10px; padding:14px; box-shadow:0 1px 6px rgba(13,107,124,.05); }

/* Pills */
.pill { display:inline-block; padding:2px 8px; border-radius:20px; font-size:10px; font-weight:600; }
.pill-yellow { background:#fef9e7; color:#b88c1a; }
.pill-green { background:#f0f5f1; color:#4b6050; }
.pill-teal { background:#e6f5f7; color:#0d6b7c; }
.pill-orange { background:#fdf0ec; color:#d4634a; }
.pill-coral { background:#f9d6cc; color:#b84e38; }
.pill-sage { background:#d4e3d8; color:#3a4a3e; }
.pill-gold { background:#fef9e7; color:#b88c1a; }
.pill-purple { background:#f5f0fa; color:#6b3f92; }

/* Calendar */
.cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:3px; }
.cal-header { font-size:11px; font-weight:700; text-align:center; padding:6px 2px; color:#0d6b7c; }
.cal-cell { border:1px solid #e6f5f7; border-radius:8px; padding:4px; min-height:90px; font-size:9px; background:#fff; }
.cal-cell .day-num { font-weight:700; font-size:12px; color:#0d6b7c; }
.cal-empty { background:transparent; border:none; }

/* Tables */
.meal-table { width:100%; border-collapse:separate; border-spacing:0; font-size:11px; }
.meal-table th { background:#0d6b7c; color:#fff; padding:8px 6px; text-align:left; font-size:11px; font-weight:600; }
.meal-table th:first-child { border-radius:8px 0 0 0; }
.meal-table th:last-child { border-radius:0 8px 0 0; }
.meal-table td { padding:7px 6px; border-bottom:1px solid #e6f5f7; }
.meal-table tr:nth-child(even) { background:#fdf8f0; }
.meal-table tr:hover { background:#e6f5f7; }

/* Recipe cards */
.recipe-card { background:#fff; border-radius:12px; padding:16px; box-shadow:0 1px 8px rgba(13,107,124,.06); margin-bottom:12px; page-break-inside:avoid; }
.recipe-card h4 { color:#0d6b7c; font-family:'Nunito',sans-serif; font-weight:700; font-size:15px; margin:0 0 8px; }
.kid-box { background:#fdf0ec; border-radius:8px; padding:10px; margin-top:8px; border-left:3px solid #e07a5f; }

/* Star chart */
.star-cell { width:28px; height:28px; display:flex; align-items:center; justify-content:center; cursor:pointer; border-radius:6px; font-size:16px; transition:all .15s; border:1px solid #e6f5f7; }
.star-cell:hover { background:#fef9e7; }
.star-cell.filled { background:#fef9e7; }

/* Checkbox */
.cb-item { display:flex; align-items:flex-start; gap:8px; padding:4px 0; font-size:13px; }
.cb-item input[type=checkbox] { margin-top:3px; accent-color:#0d6b7c; width:16px; height:16px; }

/* Sticky subnav */
.sticky-sub { position:sticky; top:48px; background:#fdf8f0; z-index:20; padding:8px 0; border-bottom:1px solid #e6f5f7; }
.sticky-sub button { padding:5px 14px; border-radius:20px; font-size:12px; font-weight:600; border:1px solid #b3e0e6; background:#fff; color:#0d6b7c; cursor:pointer; transition:all .15s; }
.sticky-sub button:hover, .sticky-sub button.active { background:#0d6b7c; color:#fff; }

/* Print */
@media print {
  #sidebar, #tab-bar, #mobile-menu-btn, #mobile-sidebar, .no-print, .sticky-sub { display:none !important; }
  #main { margin-left:0 !important; }
  body { background:#fff !important; }
  .card, .recipe-card { box-shadow:none !important; border:1px solid #ddd; }
  .recipe-card { page-break-inside:avoid !important; }
  .recipe-section-header { page-break-before:always !important; }
  .grocery-week { page-break-before:always !important; }
  .tracker-section { page-break-before:always !important; }
  @page { size:letter; margin:0.5in; }
  * { font-size:11pt; }
  .cal-grid { font-size:8pt; }
}

/* Mobile */
@media (max-width:768px) {
  #sidebar { transform:translateX(-100%); }
  #sidebar.open { transform:translateX(0); }
  #main { margin-left:0; }
  .cal-cell { min-height:60px; font-size:7px; }
  .cal-cell .day-num { font-size:10px; }
  #tab-bar { gap:3px; padding:6px 8px; }
  .tab-btn { padding:5px 8px; font-size:10px; }

.week-dinner{background:#e6f5f7;color:#0b5c6b;}.week-snack{background:#fdf0ec;color:#b84e38;}
@media print{

function getSeasonFromKey(monthKey) {
  var m = monthKey.split(' ')[0];
  if (m==='Jun'||m==='Jul'||m==='Aug') return 'summer';
  if (m==='Sep'||m==='Oct'||m==='Nov') return 'fall';
  if (m==='Dec'||m==='Jan'||m==='Feb') return 'winter';
  return 'spring';
}

function seasonalizeMeal(meal, season) {
  var swaps = SEASONAL_SWAPS[season];
  return (swaps && swaps[meal]) ? swaps[meal] : meal;
}

const DAY_NAMES = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

function buildDailyPlan(monthKey) {
  if (planCache[monthKey]) return planCache[monthKey];
  const {rotation,days,shift} = MONTH_META[monthKey];
  const p = MEAL_POOLS[rotation];
  const _mn = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const _pts = monthKey.split(" ");
  const startDow = new Date(parseInt(_pts[1]), _mn.indexOf(_pts[0]), 1).getDay();
  const season = getSeasonFromKey(monthKey);
  const plan = [];
  for (let d=0; d<days; d++) {
    plan.push({
      day: d+1,
      dayName: DAY_NAMES[(startDow+d)%7],
      breakfast: seasonalizeMeal(p.breakfasts[d], season),
      lunch:     seasonalizeMeal(p.lunches[(d+shift)%31], season),
      dinner:    seasonalizeMeal(p.dinners[(d+(shift*2)%31+31)%31], season),
      snack:     seasonalizeMeal(p.snacks[(d+(shift*3)%31+31)%31], season)
    });
  }
  planCache[monthKey] = plan;
  return plan;
}

Object.assign(RECIPE_DB, SEASONAL_RECIPES);

function genRecipe(name) {
  if (RECIPE_DB[name]) return RECIPE_DB[name];
  const isBreakfast = MB.includes(name);
  const isLunch     = ML.includes(name);
  const isDinner    = MD.includes(name);
  const isSnack     = MS.includes(name);
  const cat = isBreakfast?'breakfast':isLunch?'lunch':isDinner?'dinner':'snack';
  const isSoup     = /soup|stew|chili|chowder/i.test(name);
  const isSlow     = /slow cooker/i.test(name);
  const isBaked    = /baked|roast|meatloaf|shepherd/i.test(name);
  const isStirFry  = /stir.fry|skillet|fajita/i.test(name);
  const isOats     = /oat|overnight|chia|pudding/i.test(name);
  const isSalad    = /salad|lettuce|wrap/i.test(name);
  const isSmoothie = /smoothie/i.test(name);
  const isToast    = /toast/i.test(name) && !isSmoothie;
  const isGreenSmoothie = /green/i.test(name) && isSmoothie;
  const isBowl     = /bowl/i.test(name) && !isSmoothie && !isOats && !isToast;
  const freezer    = isSoup||isBaked||isStirFry||/meatball|burger|muffin cup|pancake|chili|taco/i.test(name);

  let prep='15min', cook='25min';
  if(isOats)            { prep='5min';  cook='0min'; }
  if(isSmoothie)        { prep='5min';  cook='0min'; }
  if(isSlow)            { prep='15min'; cook='6–8hr'; }
  if(isBaked)           { prep='15min'; cook='35min'; }
  if(isSoup && !isSlow) { prep='10min'; cook='30min'; }
  if(isSnack)           { prep='5min';  cook='0min'; }
  if(isToast)           { prep='5min';  cook='10min'; }

  let cal=300, protein='20g', fat='8g', carbs='30g', sugar='4g';
  if(isBreakfast) { cal=320; protein='12g'; fat='8g';  carbs='42g'; sugar='8g'; }
  if(isSnack)     { cal=150; protein='4g';  fat='6g';  carbs='18g'; sugar='5g'; }
  if(isLunch)     { cal=380; protein='28g'; fat='10g'; carbs='38g'; sugar='4g'; }
  if(isDinner)    { cal=450; protein='35g'; fat='14g'; carbs='40g'; sugar='5g'; }

  const ing = [];
  // Protein
  if      (/chicken/i.test(name))               ing.push('1.5 lbs chicken breast');
  else if (/turkey/i.test(name))                ing.push('1 lb ground turkey');
  else if (/beef/i.test(name))                  ing.push('1 lb lean ground beef');
  else if (/pork/i.test(name))                  ing.push('1 lb pork tenderloin');
  else if (/egg|scramble|frittata/i.test(name)) ing.push('6 large eggs');
  else if (/lentil/i.test(name))                ing.push('1.5 cups green lentils');
  else if (/black bean/i.test(name))            ing.push('2 cans black beans, drained');
  else if (/white bean/i.test(name))            ing.push('2 cans white beans, drained');
  else if (/chickpea/i.test(name))              ing.push('2 cans chickpeas, drained');
  else if (/quinoa/i.test(name))                ing.push('1.5 cups quinoa, rinsed');

  // Grains
  if (/oat/i.test(name))    ing.push('2 cups rolled oats');
  if (/chia/i.test(name) && !ing.some(function(x){return /chia/.test(x);})) ing.push('3 tbsp chia seeds');
  if (/rice(?! cake)/i.test(name) && !ing.some(function(x){return /rice/.test(x);})) ing.push('2 cups brown rice, cooked');
  if (/pasta|noodle/i.test(name)) ing.push('8 oz whole wheat pasta');
  if (/toast|bread/i.test(name))  ing.push('5 slices whole wheat bread');

  // Vegetables - always type-specific, never skipped
  if (isSoup || isSlow) {
    ing.push('2 carrots, diced');
    ing.push('3 stalks celery, sliced');
    ing.push('1 yellow onion, diced');
    if      (/spring|vegetable|veggie/i.test(name)) { ing.push('1 cup frozen peas'); ing.push('1 cup zucchini, chopped'); }
    else if (/butternut|squash/i.test(name))        { ing.push('3 cups butternut squash, cubed'); }
    else if (/kale|white bean/i.test(name))         { ing.push('3 cups chopped kale'); }
    else if (/sweet potato/i.test(name))            { ing.push('2 sweet potatoes, cubed'); }
    else                                             { ing.push('2 cups baby spinach'); }
    ing.push('4 cups low-sodium chicken broth');
  } else if (isStirFry) {
    ing.push('1 red bell pepper, sliced');
    ing.push('2 cups broccoli florets');
    ing.push('1 cup snap peas');
    ing.push('3 cloves garlic, minced');
  } else if (isBaked && !isOats) {
    if      (/broccoli/i.test(name))    { ing.push('3 cups broccoli florets'); }
    else if (/brussels/i.test(name))    { ing.push('2 cups Brussels sprouts, halved'); }
    else if (/asparagus/i.test(name))   { ing.push('1 bunch asparagus, trimmed'); }
    else if (/root|carrot/i.test(name)) { ing.push('3 carrots, chopped'); ing.push('2 parsnips, chopped'); }
    else if (/sweet potato/i.test(name)){ ing.push('3 sweet potatoes, cubed'); }
    else                                 { ing.push('2 cups mixed roasting vegetables'); }
  } else if (isSalad || isBowl) {
    if (/corn/i.test(name))     { ing.push('1 cup corn kernels'); }
    if (/cucumber/i.test(name)) { ing.push('1 cucumber, diced'); }
    ing.push('2 cups mixed greens');
    ing.push('1 cup cucumber, diced');
  } else if (!isOats && !isSmoothie && !isSnack && !isToast) {
    ing.push('1 cup diced bell pepper');
    ing.push('1 cup zucchini, sliced');
    ing.push('1 yellow onion, diced');
  }

  // Fruit
  if (/banana/i.test(name))                         ing.push('3 ripe bananas');
  if (/mango/i.test(name))                          ing.push('1 cup frozen mango chunks');
  if (/berry|blueberry|strawberry/i.test(name))     ing.push('1 cup mixed berries');
  if (/apple/i.test(name) && !isSnack)              ing.push('1 apple, diced');
  if (/peach/i.test(name))                          ing.push('1 cup frozen peaches');
  if (/avocado/i.test(name))                        ing.push('2 ripe avocados');
  if (/sweet potato/i.test(name) && !ing.some(function(x){return /sweet potato/.test(x);})) ing.push('2 sweet potatoes');

  // Pantry
  if (/almond butter|almond milk/i.test(name))      ing.push('3 tbsp almond butter');
  if (/hummus/i.test(name))                         ing.push('1 cup hummus');
  if (/pumpkin/i.test(name))                        ing.push('1 cup canned pumpkin puree');
  if (/peanut butter|pb/i.test(name))             ing.push('3 tbsp peanut butter');
  if (!isSoup && !isSlow && !isSnack && !isOats && !isSmoothie && !isToast) {
    ing.push('2 tbsp olive oil');
    ing.push('1 tsp garlic powder, 1 tsp cumin, salt & pepper');
  }
  if (isOats)     { ing.push('1 tsp cinnamon'); ing.push('1 tbsp honey or maple syrup'); }
  if (isSmoothie) {
    if (isGreenSmoothie) {
      ing.push('5 cups fresh spinach or baby kale');
      ing.push('5 frozen bananas, sliced');
      ing.push('2.5 cups frozen strawberries or mixed berries');
      ing.push('2.5 cups unsweetened almond milk');
      ing.push('5 tbsp honey or maple syrup');
      ing.push('optional: 5 tbsp chia seeds or ground flax');
    } else {
      ing.push('2.5 cups unsweetened almond milk');
      ing.push('5 frozen bananas');
      ing.push('2.5 cups frozen fruit of choice');
      ing.push('5 tbsp honey or maple syrup');
    }
  }
  if (isSoup || isSlow) { /* broth already added above */ }
  if (isToast) {
    // ingredients are added above via the egg/bread/protein lines;
    // add vinegar + seasoning
    ing.push('1 tbsp white vinegar (for poaching)');
    ing.push('salt & freshly ground black pepper');
    if (/avocado/i.test(name)) { ing.push('2 ripe avocados, mashed'); }
  }

  // Snack specifics
  if (isSnack) {
    if (/rice cake/i.test(name))    ing.push('6 rice cakes');
    if (/trail mix/i.test(name))    { ing.push('1 cup mixed nuts'); ing.push('1/2 cup dried fruit'); }
    if (/edamame/i.test(name))      ing.push('2 cups shelled edamame');
    if (/hard.boil/i.test(name))    { ing.push('6 large eggs'); ing.push('1 tsp everything bagel seasoning'); }
    if (/walnut/i.test(name))       { ing.push('1 cup walnuts'); ing.push('1/4 cup dried cranberries'); }
    if (/sunflower/i.test(name))    { ing.push('1/2 cup sunflower seeds'); ing.push('1/4 cup raisins'); }
    if (ing.length < 2)             { ing.push('fresh cut vegetables or fruit'); ing.push('dipping sauce of choice'); }
  }

  const ingredients = ing.slice(0, 9);

  // Expanded kid-friendly steps
  var steps;
  if (isSlow) {
    steps = [
      'Wash your hands and gather all ingredients on the counter.',
      'Dice the onion, carrots, and celery into small bite-sized pieces.',
      'If using raw protein, cut into 1-inch chunks and pat dry with a paper towel.',
      'Add the protein to the slow cooker first, then layer vegetables on top.',
      'Pour in the broth and sprinkle all the spices evenly over everything.',
      'Put the lid on securely. Set to LOW for 6-8 hours (or HIGH for 3-4 hours).',
      'When done, use two forks to shred the protein right in the pot.',
      'Taste, adjust salt if needed, and serve with rice or bread.'
    ];
  } else if (isSoup) {
    steps = [
      'Wash your hands and chop all vegetables into small, even pieces.',
      'Heat olive oil in a large pot over medium heat until it shimmers.',
      'Add the onion and cook, stirring often, for 3 minutes until softened.',
      'Add the garlic and remaining vegetables; stir and cook 3 more minutes.',
      'If using raw protein, add it now and stir until no longer pink.',
      'Pour in all the broth and bring to a boil over high heat.',
      'Reduce to low heat, cover, and simmer 20 minutes until vegetables are tender.',
      'Season with salt, pepper, and spices. Taste and adjust. Serve hot!'
    ];
  } else if (isBaked) {
    steps = [
      'Preheat the oven to 375F and line a baking sheet with foil or parchment.',
      'Wash and cut all vegetables into similar-sized pieces so they cook evenly.',
      'Pat the protein completely dry with paper towels - this helps it brown nicely.',
      'In a small bowl, mix olive oil, garlic powder, cumin, salt, and pepper.',
      'Coat the protein all over with the spice mixture using your hands or a brush.',
      'Arrange protein on one side of the pan and vegetables on the other.',
      'Drizzle vegetables with a little extra olive oil and toss to coat evenly.',
      'Bake 30-40 minutes until protein is cooked through and vegetables are tender.',
      'Let rest 5 minutes before serving - this keeps everything juicy!'
    ];
  } else if (isStirFry) {
    steps = [
      'Wash your hands and prep all vegetables - slice evenly so everything cooks at the same speed.',
      'In a small bowl, stir together soy sauce, garlic, and any other sauce ingredients. Set aside.',
      'Heat a large skillet or wok over HIGH heat until very hot.',
      'Add 1 tbsp oil and swirl to coat. Add protein in a single layer - do not crowd it.',
      'Cook protein without stirring 2 minutes, then stir and cook until done. Remove to a plate.',
      'Add remaining oil to the pan. Add vegetables starting with the firmest ones first.',
      'Stir-fry 3-4 minutes, tossing constantly, until vegetables are tender-crisp.',
      'Return protein to the pan, pour sauce over everything, and toss to combine.',
      'Serve immediately over brown rice or noodles!'
    ];
  } else if (isOats && /overnight/i.test(name)) {
    steps = [
      'Measure oats into a mason jar or container with a tight-fitting lid.',
      'Pour in the almond milk and stir well so all the oats are wet.',
      'Add chia seeds and stir again quickly to prevent clumping.',
      'Stir in cinnamon and your sweetener of choice.',
      'Add any mix-ins like nut butter or berries, or keep separate for the morning.',
      'Seal the jar tightly and refrigerate for at least 6 hours or overnight.',
      'In the morning, give it a big stir. Add a splash of milk if too thick.',
      'Top with fresh fruit, nuts, or a drizzle of honey and enjoy cold!'
    ];
  } else if (isOats) {
    steps = [
      'Measure oats and almond milk into a small saucepan.',
      'Place over medium heat and stir constantly as the mixture warms up.',
      'Once it starts to bubble gently, reduce the heat to low.',
      'Keep stirring every minute for 4-5 minutes until thick and creamy.',
      'Remove from heat and stir in cinnamon and sweetener.',
      'Spoon into bowls and let cool 1-2 minutes so no one burns their mouth.',
      'Add your favorite toppings - fruit, nuts, or a drizzle of nut butter.',
      'Enjoy while warm!'
    ];
  } else if (isSmoothie) {
    steps = [
      'Gather all ingredients and place them near the blender.',
      'Add the liquid (almond milk) to the blender first - this helps everything blend smoothly.',
      'Add the frozen or fresh fruit next.',
      'Spoon in nut butter, honey, or any other add-ins.',
      'Put the lid on tightly and press it down with your hand before blending.',
      'Blend on high for 45-60 seconds until completely smooth with no chunks.',
      'Taste - add more honey if sweeter, more milk if too thick.',
      'Pour into bowls or glasses, add toppings, and enjoy right away!'
    ];
  } else if (isSalad || isBowl) {
    steps = [
      'Wash all vegetables and fruit under cold running water.',
      'Chop or slice each ingredient into bite-sized pieces.',
      'Cook any grains (rice or quinoa) per package directions; let cool slightly.',
      'Cook protein if needed - let cool, then slice or cube it.',
      'In a small bowl or jar, whisk together all dressing ingredients until combined.',
      'Build the bowl: start with greens or grains as your base.',
      'Arrange colorful toppings in sections for a beautiful presentation.',
      'Drizzle dressing over the top just before serving and enjoy!'
    ];
  } else if (isSnack) {
    steps = [
      'Wash your hands and gather all the ingredients.',
      'Wash any fresh fruit or vegetables under cold running water.',
      'Slice or cut everything into easy, fun-sized pieces for snacking.',
      'Arrange on a plate or in a container in a colorful pattern.',
      'Add any dipping sauce or nut butter in a small bowl on the side.',
      'Enjoy right away or seal tightly to save for later!'
    ];
  } else if (isToast) {
    steps = [
      'Wash your hands and gather all ingredients on the counter.',
      'Fill a medium saucepan with 3 inches of water and bring to a gentle simmer — small bubbles, not a rolling boil.',
      'Add 1 tbsp white vinegar to the water — this helps the egg whites hold their shape.',
      'Crack each egg individually into a small cup or ramekin first — never directly into the water.',
      'While the water simmers, toast the whole wheat bread slices until golden brown.',
      'Using a spoon, stir the water gently in a circle to create a soft vortex, then slide one egg from the cup into the center.',
      'Poach 2.5–3 min for a runny yolk, or 4 min for a firmer set yolk. Repeat for remaining eggs.',
      'Lift each egg with a slotted spoon and drain briefly on a paper towel.',
      'Place toast on plates, top each slice with a poached egg, season with salt & pepper, and serve immediately!'
    ];
  } else {
    steps = [
      'Wash your hands and gather all ingredients on the counter.',
      'Dice the onion and chop all vegetables into similar-sized pieces.',
      'Pat protein completely dry, then season all over with garlic powder, cumin, salt, and pepper.',
      'Heat olive oil in a large skillet over medium-high heat until shimmering.',
      'Add protein and cook until browned and cooked through, turning once halfway.',
      'Remove protein to a plate; add vegetables to the same pan.',
      'Cook vegetables 4-5 minutes, stirring often, until tender and slightly caramelized.',
      'Return protein to the pan, stir everything together, and heat through 1 minute.',
      'Taste, adjust seasoning, plate up, and serve hot!'
    ];
  }

  return {category:cat, prep:prep, cook:cook, serves:5, freezer:freezer, 
    ingredients:ingredients, steps:steps,
    kids: isSlow      ? {aleene:'Load ingredients into slow cooker', kaily:'Measure spices and broth',      lilly:'Stir everything together'}
         : isSoup      ? {aleene:'Chop vegetables and brown protein',  kaily:'Measure and pour in broth',    lilly:'Stir the pot and taste-test'}
         : isBaked     ? {aleene:'Season and arrange in baking dish',  kaily:'Preheat oven and set timer',   lilly:'Sprinkle toppings on top'}
         : isStirFry   ? {aleene:'Slice protein and vegetables',       kaily:'Mix the stir-fry sauce',       lilly:'Toss ingredients in the pan'}
         : isOats      ? {aleene:'Measure oats and pour the liquid',   kaily:'Stir in mix-ins and spices',   lilly:'Add fruit and toppings'}
         : isSmoothie  ? {aleene:'Add all ingredients to blender',     kaily:'Press blend and watch it go',  lilly:'Pour into bowls or glasses'}
         : isSalad     ? {aleene:'Chop and prep all the toppings',     kaily:'Whisk together the dressing',  lilly:'Toss the salad and plate it'}
         : isSnack     ? {aleene:'Portion out the ingredients',        kaily:'Arrange nicely on the plate',  lilly:'Add the dipping sauce'}
         : isToast     ? {aleene:'Toast the bread slices',             kaily:'Crack eggs into small cups',      lilly:'Season with salt and pepper'}
         :               {aleene:'Prep and season the protein',        kaily:'Chop and measure vegetables',  lilly:'Plate and add the finishing touch'},
    nutrition:{cal:cal, protein:protein, fat:fat, carbs:carbs, sugar:sugar}};
}

function slugName(n) {
  return 'recipe-' + n.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');

function goToRecipe(name) {
  // Detect which category this recipe belongs to
  const meta = MONTH_META[currentMonth];
  const pool = MEAL_POOLS[meta.rotation];
  if (pool.lunches.includes(name))       currentRecipeCategory = 'lunches';
  else if (pool.dinners.includes(name))  currentRecipeCategory = 'dinners';
  else if (pool.snacks.includes(name))   currentRecipeCategory = 'snacks';
  else                                   currentRecipeCategory = 'breakfasts';

  currentTab = 'recipes';
  document.querySelectorAll('.tab-btn').forEach(function(b) {
    b.classList.toggle('active', b.dataset.tab === 'recipes');

  document.getElementById('content').innerHTML = renderRecipes();

      el.style.outlineOffset = '3px';
      setTimeout(function() { el.style.outline = ''; el.style.outlineOffset = ''; }, 2000);

function renderGrocery() {
  const plan = buildDailyPlan(currentMonth);
  const mn = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const pts = currentMonth.split(' ');
  const year = parseInt(pts[1]);
  const monthIdx = mn.indexOf(pts[0]);

  // Group into Saturday-Friday shopping weeks
  // Days before the first Saturday form their own partial week
  const weeks = [];
  let week = [];
  plan.forEach(d => {
    if (d.dayName === 'Sat' && week.length > 0) {
      weeks.push(week);
      week = [];
    }
    week.push(d);
  });
  if (week.length > 0) weeks.push(week);

  // Categorize an ingredient string into grocery department
  function catIng(ing) {
    const low = ing.toLowerCase();
    if (/chicken|turkey|beef|pork|egg|tofu|sausage/i.test(low)) return 'protein';
    if (/almond milk|oat milk|coconut milk|dairy.free|non.dairy/i.test(low)) return 'dairy';
    if (/broccoli|carrot|onion|bell pepper|zucchini|kale|spinach|garlic(?! powder)|cucumber|snap pea|avocado|banana|apple|mango|orange|pear|berr|sweet potato|lemon|lime|ginger|celery|asparagus|green bean|corn|mushroom|arugula|romaine|cilantro|parsley|jalape|mixed greens|shredded carrot|frozen fruit|frozen mixed/i.test(low)) return 'produce';
    if (/frozen/i.test(low)) return 'frozen';
    return 'pantry';
  }

  // Format a calendar date label
  function fmtDate(yr, mIdx, dayNum) {
    const dow = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    const mo  = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    const d = new Date(yr, mIdx, dayNum);
    return `${dow[d.getDay()]} ${mo[d.getMonth()]} ${dayNum}`;
  }

  let html = `<div class="card"><h2 class="font-display text-xl font-bold text-teal-500 mb-3">🛒 ${currentMonth} Grocery Lists</h2>
    <p class="text-xs text-charcoal-300 mb-4">Saturday morning shopping · Sat–Fri weekly lists · dairy-free, tomato-free, seafood-free</p>`;

  weeks.forEach((w, wi) => {
    const firstDay = w[0].day;
    const lastDay  = w[w.length - 1].day;
    const startLabel = fmtDate(year, monthIdx, firstDay);
    const endLabel   = fmtDate(year, monthIdx, lastDay);

    const isSatStart = w[0].dayName === 'Sat';
    const tripHeader = isSatStart
      ? `🛒 Shopping Trip: ${startLabel} – ${endLabel}`
      : `🛒 Carry-over week: ${startLabel} – ${endLabel}`;

    // Collect all meal names for this week
    const allMeals = new Set();
    w.forEach(d => [d.breakfast, d.lunch, d.dinner, d.snack].forEach(m => allMeals.add(m)));

    // ── ingredient deduplication helpers ──────────────────────────────────
    const _UNICODE_FRAC = {'½':0.5,'¼':0.25,'¾':0.75,'⅓':1/3,'⅔':2/3,'⅛':0.125,'⅜':0.375,'⅝':0.625,'⅞':0.875};
    function _parseQty(s) {
      s = (s||'').trim();
      if (_UNICODE_FRAC[s] !== undefined) return _UNICODE_FRAC[s];
      const rng = s.match(/^(\d+(?:\.\d+)?)\s*[–-]\s*(\d+(?:\.\d+)?)$/);
      if (rng) return (parseFloat(rng[1]) + parseFloat(rng[2])) / 2;
      const n = parseFloat(s);
      return isNaN(n) ? 0 : n;
    }
    const _UNITS = 'cups?|tbsp|tsp|lbs?|oz|g|kg|cloves?|cans?|slices?|pieces?|scoops?|handfuls?|pkg|packages?|bags?|jars?|heads?|bunch|stalks?|pinch';
    const _UNIT_RE = new RegExp('^(\\d+(?:[./]\\d+)?(?:\\s*[–-]\\s*\\d+(?:[./]\\d+)?)?|[½¼¾⅓⅔⅛⅜⅝⅞])?\\s*(' + _UNITS + ')?\\s*(?:of\\s+)?(.+)$', 'i');
    function _parseIng(raw) {
      const m = raw.trim().match(_UNIT_RE);
      if (!m) return { qty:0, unit:'', name:raw.trim() };
      return { qty: _parseQty(m[1]), unit: (m[2]||'').toLowerCase().replace(/s$/,''), name: (m[3]||raw).trim() };
    }
    const _STRIP_MODS = /\b(large|small|medium|extra|big|mini|jumbo|ripe|frozen|fresh|raw|cooked|diced|sliced|chopped|mashed|cubed|shredded|grated|minced|peeled|pitted|halved|whole|baby|unsweetened|sweetened|boneless|skinless|lean|ground|dried|canned)\b\s*/gi;
    function _canonIng(raw) {
      let s = raw.toLowerCase().trim();
      // strip leading qty+unit
      s = s.replace(/^(\d+(?:[./]\d+)?(?:\s*[–-]\s*\d+(?:[./]\d+)?)?|[½¼¾⅓⅔⅛⅜⅝⅞])\s*/, '');
      s = s.replace(new RegExp('^(' + _UNITS + ')s?\\s+(?:of\\s+)?', 'i'), '');
      s = s.replace(_STRIP_MODS, '').replace(/,.*$/, '').replace(/\(.*?\)/g, '').replace(/\s+/g,' ').trim();
      return s.charAt(0).toUpperCase() + s.slice(1);
    }
    function _mergeIngs(rawList) {
      const map = new Map(); // canon -> {display, qty, unit}
      rawList.forEach(raw => {
        const { qty, unit } = _parseIng(raw);
        const canon = _canonIng(raw);
        if (!map.has(canon)) {
          map.set(canon, { display: canon, qty, unit: unit || '' });
        } else {
          map.get(canon).qty += qty;
        }
      });
      const out = [];
      map.forEach(({ display, qty, unit }) => {
        if (qty > 0) {
          const qs = Number.isInteger(qty) ? `${qty}` : `${Math.round(qty * 10) / 10}`;
          const us = unit ? ` ${unit}` : '';
          out.push(`${display} (×${qs}${us})`);
        } else {
          out.push(display);
        }
      });
      return out;
    }
    // ── end helpers ─────────────────────────────────────────────────────────

    // Aggregate ingredients from each recipe into raw arrays per category
    const catRaw = { protein:[], produce:[], pantry:[], frozen:[], dairy:[] };
    // Fixed weekly staples (not qty-merged)
    const _STAPLES = [
      'Olive oil (16 oz bottle)',
      'Garlic powder (refill if low)',
      'Cumin (refill if low)',
      'Salt & black pepper',
      'Unsweetened almond milk (½ gallon)'
    ];
    catRaw.pantry.push('Olive oil (16 oz bottle)','Garlic powder (refill if low)','Cumin (refill if low)','Salt & black pepper');
    catRaw.dairy.push('Unsweetened almond milk (½ gallon)');

    allMeals.forEach(mealName => {
      try {
        const r = genRecipe(mealName);
        (r.ingredients || []).forEach(ing => {
          const cat = catIng(ing);
          catRaw[cat].push(ing);
        });
      } catch(e) { /* skip unknown */ }
    });

    // Build final cats: staples first (deduped), then merged recipe ingredients
    const _stapleSet = new Set(_STAPLES);
    const cats = {};
    ['protein','produce','pantry','frozen','dairy'].forEach(key => {
      const fixed   = [...new Set(catRaw[key].filter(i => _stapleSet.has(i)))];
      const recipe  = catRaw[key].filter(i => !_stapleSet.has(i));
      cats[key] = [...fixed, ..._mergeIngs(recipe)];
    });

    // Estimate cost using week index for slight variation
    const est = 135 + (wi % 4) * 5;

    html += `<div class="${wi > 0 ? 'mt-6 pt-4 border-t border-teal-100' : ''}">
      <h3 class="font-display font-bold text-sm mt-2 mb-3">
        <span class="pill pill-teal">${tripHeader}</span>
        <span class="text-xs text-charcoal-300 ml-2">Est. $${est}–${est + 20}</span>
      </h3>
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">`;

    [
      { title: '🥩 Proteins',       key: 'protein' },
      { title: '🥦 Produce',        key: 'produce' },
      { title: '🥫 Pantry',         key: 'pantry'  },
      { title: '❄️ Frozen',         key: 'frozen'  },
      { title: '🧴 Dairy-Free',     key: 'dairy'   }
    ].forEach(sec => {
      if (cats[sec.key].length === 0) return;
      html += `<div class="card-sm"><h4 class="font-bold text-xs text-teal-600 mb-2">${sec.title}</h4>`;
      cats[sec.key].forEach(item => {
        html += `<div class="cb-item"><input type="checkbox"><span>${item}</span></div>`;
      });
      html += '</div>';
    });

    html += '</div></div>';
  });

  html += '</div>';
  return html;
}

function renderFreezer() {
  const plan = buildDailyPlan(currentMonth);
  const freezerMeals = [];
  plan.forEach(d => {
    const r = RECIPE_DB[d.dinner]||genRecipe(d.dinner);
    if(r.freezer && !freezerMeals.find(f=>f.name===d.dinner)) {
      freezerMeals.push({name:d.dinner,day:d.day});
    }
  });
  let html = `<div class="card"><h2 class="font-display text-xl font-bold text-teal-500 mb-3">🧊 ${currentMonth} Freezer Guide</h2>

// EVENT BINDING
// ═══════════════════════════════════
function bindDynamicEvents() {
  // Exercise checkboxes
  document.querySelectorAll('.exercise-cb').forEach(cb => {
    cb.addEventListener('change', function() {
      const key = `exercise_${currentMonth}`;
      const saved = JSON.parse(localStorage.getItem(key)||'{}');
      saved[this.dataset.key] = this.checked;
      localStorage.setItem(key, JSON.stringify(saved));
    });
  });

  // Tracker weights
  document.querySelectorAll('.tracker-weight').forEach(inp => {
    inp.addEventListener('input', function() {
      const key = `tracker_${currentMonth}`;
      const saved = JSON.parse(localStorage.getItem(key)||'{"weights":{},"measurements":{},"notes":""}');
      if(!saved.weights) saved.weights = {};
      saved.weights[`${this.dataset.member}_w${this.dataset.week}`] = this.value;
      localStorage.setItem(key, JSON.stringify(saved));
    });
  });

  // Tracker measurements
  document.querySelectorAll('.tracker-measure').forEach(inp => {
    inp.addEventListener('input', function() {
      const key = `tracker_${currentMonth}`;
      const saved = JSON.parse(localStorage.getItem(key)||'{"weights":{},"measurements":{},"notes":""}');
      if(!saved.measurements) saved.measurements = {};
      saved.measurements[`${this.dataset.person}_${this.dataset.type}`] = this.value;
      localStorage.setItem(key, JSON.stringify(saved));
    });
  });

  // Tracker notes
  const notesEl = document.querySelector('.tracker-notes');
  if(notesEl) {
    notesEl.addEventListener('input', function() {
      const key = `tracker_${currentMonth}`;
      const saved = JSON.parse(localStorage.getItem(key)||'{"weights":{},"measurements":{},"notes":""}');
      saved.notes = this.value;
      localStorage.setItem(key, JSON.stringify(saved));
    });
  }

  // Budget
  document.querySelectorAll('.budget-actual, .budget-note').forEach(inp => {
    inp.addEventListener('input', function() {
      const key = `budget_${currentMonth}`;
      const saved = JSON.parse(localStorage.getItem(key)||'{}');
      saved[this.dataset.cat] = this.value;
      localStorage.setItem(key, JSON.stringify(saved));
      // Update total
      let total = 0;
      document.querySelectorAll('.budget-actual').forEach(a => { total += parseFloat(a.value)||0; });
      const el = document.getElementById('budget-total');
      if(el) el.textContent = '$'+total;
    });
  });

  // Star chart
  document.querySelectorAll('.star-cell').forEach(cell => {
    cell.addEventListener('click', function() {
      const kid = this.dataset.kid, day = this.dataset.day;
      const key = `stars_${currentMonth}`;
      const saved = JSON.parse(localStorage.getItem(key)||'{}');
      if(!saved[kid]) saved[kid] = {};
      saved[kid][day] = !saved[kid][day];
      localStorage.setItem(key, JSON.stringify(saved));
      this.classList.toggle('filled');
      this.textContent = saved[kid][day] ? '⭐' : day;
      // Update total
      const total = Object.values(saved[kid]).filter(v=>v).length;
      const totalEl = document.querySelector(`.kid-total[data-kid="${kid}"]`);
      if(totalEl) totalEl.textContent = total+'⭐';
    });
  });

  // Recipe nav
  // Calendar view toggle
  document.querySelectorAll('.cal-view-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      calendarView = this.dataset.calview;
      document.getElementById('content').innerHTML = renderCalendar();
      bindDynamicEvents();
    });
  });

  // recipe-nav-btn clicks handled via inline onclick="setRecipeCategory()"
}

// ═══════════════════════════════════
// INIT (Safari-safe wrapper)
// ═══════════════════════════════════
function _init() {
  try {
    if (typeof lucide !== 'undefined' && typeof lucide.createIcons === 'function') {
      lucide.createIcons();
    }

    // Month nav
    var monthNav = document.getElementById('month-nav');
    if (monthNav) {
      monthNav.addEventListener('click', function(e) {
        var btn = e.target.closest('.month-btn');
        if (!btn) return;
        currentMonth = btn.dataset.month;
        calendarView = 'month';
        render();
        var sb = document.getElementById('sidebar');
        if (sb) sb.classList.remove('open');
      });
    }

    // Tab nav
    var tabBar = document.getElementById('tab-bar');
    if (tabBar) {
      tabBar.addEventListener('click', function(e) {
        var btn = e.target.closest('.tab-btn');
        if (!btn || btn.id === 'print-btn') return;
        currentTab = btn.dataset.tab;
        document.querySelectorAll('.tab-btn').forEach(function(b) { b.classList.remove('active'); });
        btn.classList.add('active');
        render();
      });
    }

    // Print
    var printBtn = document.getElementById('print-btn');
    if (printBtn) {
      printBtn.addEventListener('click', function() { window.print(); });
    }

    // Mobile menu
    var mobileBtn = document.getElementById('mobile-menu-btn');
    if (mobileBtn) {
      mobileBtn.addEventListener('click', function() {
        var sb = document.getElementById('sidebar');
        if (sb) sb.classList.toggle('open');
      });
    }

    // Initial render
    render();

  } catch(err) {
    var c = document.getElementById('content');
    if (c) {
      c.innerHTML = '<div style="padding:24px;background:#fee2e2;border:2px solid #dc2626;border-radius:12px;color:#991b1b;font-family:monospace;margin:20px;">' +
        '<strong style="font-size:16px;">&#9888; JavaScript Error (Safari)</strong><br><br>' +
        '<strong>Message:</strong> ' + (err.message || 'Unknown') + '<br><br>' +
        '<strong>Stack:</strong><pre style="white-space:pre-wrap;font-size:12px;">' + (err.stack || 'No stack') + '</pre>' +
        '</div>';
    }
  }
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', _init);
} else {
  _init();
}
</script>
</body>
</html>
